variables:
  VITESS_VERSION: "3.5"

stages:
  - build
  - test
  - package

compile-rocky8:
  stage: build
  image: rockylinux:8
  variables:
    OS: Rocky8
    ARCH: x86_64
    OSARCH: ${OS}-${ARCH}
  before_script:
    - dnf install -y make gcc 'gcc-c++'
  script:
    - cd SRC
    - make
    - make install
    - make clean
    - cd ..
    - mkdir artifacts-${OSARCH}
    - cp -r MODULES artifacts-${OSARCH}
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts-${OSARCH}/

compile-centos7:
  stage: build
  image: centos:7
  variables:
    OS: CentOS7
    ARCH: x86_64
    OSARCH: ${OS}-${ARCH}
  before_script:
    - yum install -y make gcc 'gcc-c++'
  script:
    - cd SRC
    - make
    - make install
    - make clean
    - cd ..
    - mkdir artifacts-${OSARCH}
    - cp -r MODULES artifacts-${OSARCH}
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts-${OSARCH}/

