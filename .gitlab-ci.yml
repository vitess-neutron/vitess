variables:
  VITESS_VERSION: "3.8"
  GR_VERSION: "0.73.22"

stages:
  - build
  - test
  - package
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.compile-base:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" '
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true
  artifacts:
    expire_in: 1 week

.compile-unix:
  extends: .compile-base
  script:
    - cd SRC
    - make all LTO=1
    - make install
    - cd ..
    - mkdir -p artifacts-${OS}-${ARCH}
    - cp -r MODULES artifacts-${OS}-${ARCH}
  artifacts:
    paths:
      - artifacts-${OS}-${ARCH}/

.compile-linux:
  extends: .compile-unix
  variables:
    LINUX_DATA_REPO: "iffgit.fz-juelich.de/vitess/vitess-linux-data.git"
    LINUX_DATA_USER: "gitlab+deploy-token-147"
    LINUX_DATA_PASSWORD: "gldt-UDysz-dxdz-iXsSPQRy-"
    LIBTORCHFILE: "libtorch-cxx11-abi-2.2.2.zip"
    LIBTORCHPATH: "${CI_PROJECT_DIR}/vitess-data/libtorch"

.linux_before_script: &linux_before_script
  - git clone -b vitess${VITESS_VERSION} https://${LINUX_DATA_USER}:${LINUX_DATA_PASSWORD}@${LINUX_DATA_REPO} vitess-data
  - cd vitess-data
  - unzip "${LIBTORCHFILE}"
  - cd ..

compile-rocky8:
  extends: .compile-linux
  image: rockylinux:8
  variables:
    OS: Rocky8
    ARCH: x86_64
    LIBTORCHFILE: "libtorch-2.2.2-rocky8.zip"
  before_script:
    - dnf install -y epel-release
    - dnf install -y make gcc-toolset-12 libXpm-devel libpng-devel gd-devel zlib-devel git unzip cmake libxml2-devel python3.12
    - . /opt/rh/gcc-toolset-12/enable
    - *linux_before_script

compile-rocky9:
  extends: .compile-linux
  rules:
    - when: on_success
  image: rockylinux:9
  variables:
    OS: Rocky9
    ARCH: x86_64
  before_script:
    - dnf install -y --nobest glibc-devel
    - dnf install -y make gcc 'gcc-c++' libXpm-devel libpng-devel gd-devel zlib-devel git unzip cmake libxml2-devel python3
    - *linux_before_script

compile-ubuntu:
  extends: .compile-linux
  image: ubuntu:latest
  variables:
    OS: Ubuntu
    ARCH: x86_64
  before_script:
    - apt-get update
    - apt-get install -y make gcc 'g++' libxpm-dev libpng-dev libgd-dev zlib1g-dev git unzip cmake libxml2-dev python3
    - *linux_before_script

compile-fedora40:
  extends: .compile-linux
  image: fedora:40
  variables:
    OS: Fedora40
    ARCH: x86_64
  before_script:
    - dnf install -y make gcc 'gcc-c++' libXpm-devel libXpm-devel gd-devel zlib-devel git unzip cmake libxml2-devel python3
    - *linux_before_script

compile-debian:
  extends: .compile-linux
  image: debian:bookworm
  variables:
    OS: Debian
    ARCH: x86_64
  before_script:
    - apt-get update
    - apt-get install -y make gcc 'g++' libxpm-dev libpng-dev libgd-dev zlib1g-dev git unzip cmake libxml2-dev python3
    - *linux_before_script

compile-darwin:
  extends: .compile-unix
  rules:
    - when: on_success
  image: macos:sonoma-xcode
  tags:
    - utm
  variables:
    OS: Darwin
    ARCH: universal
    DARWIN_DATA_REPO: "iffgit.fz-juelich.de/vitess/vitess-darwin-data.git"
    DARWIN_DATA_USER: "gitlab+deploy-token-92"
    DARWIN_DATA_PASSWORD: "4rGWsgBgYvzNeCK6mek6"
    LIBTORCHVERSION: "2.2.2"
    LIBTORCHPATH: "${CI_PROJECT_DIR}/vitess-data/libtorch"
    NOGD: 0
    DARWIN_UNIVERSAL: 1
  before_script:
    - git clone -b vitess${VITESS_VERSION} https://${DARWIN_DATA_USER}:${DARWIN_DATA_PASSWORD}@${DARWIN_DATA_REPO} vitess-data
    - cd vitess-data
    - sudo hdiutil attach XQuartz-2.8.2.dmg
    - sudo installer -package /Volumes/XQuartz-2.8.2/XQuartz.pkg -target /
    - sudo hdiutil detach /Volumes/XQuartz-2.8.2
    - tar xzf libgd-2.3.3.tar.gz
    - cd libgd-2.3.3
    - ./configure --with-x --x-includes=/opt/X11/include --x-libraries=/opt/X11/lib --disable-shared CC="cc" CXX="c++" CFLAGS="-arch x86_64 -arch arm64" CXXFLAGS="-arch x86_64 -arch arm64"
    - make
    - sudo make install
    - cd ..
    - tar xzf cmake.tgz
    - sudo cp -a CMake.app /Applications/
    - sudo ln -s /Applications/CMake.app/Contents/bin/cmake /usr/local/bin/cmake
    - mkdir libtorch
    - cd libtorch
    - unzip "../libtorch-macos-arm64-${LIBTORCHVERSION}.zip"
    - mv libtorch arm64
    - unzip "../libtorch-macos-x86_64-${LIBTORCHVERSION}.zip"
    - mv libtorch x86_64
    - cd ..
    - mkdir -p ../artifacts-${OS}-${ARCH}
    - tar -xzf tcltk.tgz -C ../artifacts-${OS}-${ARCH}
    - curl -LOv https://gr-framework.org/downloads/gr-${GR_VERSION}-Darwin-universal.tar.gz
    - tar -xzf gr-${GR_VERSION}-Darwin-universal.tar.gz -C ../artifacts-${OS}-${ARCH}
    - cd ../artifacts-${OS}-${ARCH}/gr
    - rm -rf Applications/gksqt.app Applications/GKSTerm.app
    - mkdir -p bin
    - echo -e '#!/bin/sh\nGRDIR="$(realpath "$(dirname "$0")/..")"\nDYLD_FALLBACK_LIBRARY_PATH="${GRDIR}/lib" "${GRDIR}/Applications/grplot.app/Contents/MacOS/grplot" "$@"' > bin/grplot
    - chmod +x bin/grplot
    # workaround for gr 0.73.22
    - rm -rf Applications/grplot/Contents/Frameworks/Qt* && tar -xzf ../../vitess-data/qt6.tgz -C Applications/grplot.app/Contents/Frameworks/
    - cd ../..
  artifacts:
    paths:
      - artifacts-Darwin-universal/

.compile-windows-base:
  extends: .compile-base
  rules:
    - when: on_success
  image: windows:10-vc17
  tags:
    - libvirt
  variables:
    OS: Windows10
    WINDOWS_DATA_REPO: "iffgit.fz-juelich.de/vitess/vitess-windows-data.git"
    WINDOWS_DATA_USER: "gitlab+deploy-token-91"
    WINDOWS_DATA_PASSWORD: "NzWKCpEizPVzMEUSgxGA"
  before_script:
    - cd /c
    - git clone -b vitess${VITESS_VERSION} https://${WINDOWS_DATA_USER}:${WINDOWS_DATA_PASSWORD}@${WINDOWS_DATA_REPO} vitess-data
    - mv vitess-data/tcl /c/
    - curl -LOv https://gr-framework.org/downloads/gr-${GR_VERSION}-Windows-x86_64-msvc.tar.gz
    - tar -xzf gr-${GR_VERSION}-Windows-x86_64-msvc.tar.gz -C /c/
    - cd -

.windows_package_script: &windows_package_script
  - mkdir artifacts-${OS}-${ARCH}
  - cp -r MODULES artifacts-${OS}-${ARCH}/
  - mkdir -p /c/vitess${VITESS_VERSION}
  - cp -r `cat filelist.txt` /c/vitess${VITESS_VERSION}/
  - /c/vitess-data/innosetup/ISCC.exe TOOLS/Win10Vitess${VITESS_VERSION}.iss
  - cp TOOLS/Output/mysetup.exe artifacts-${OS}-${ARCH}/Vitess${VITESS_VERSION}-${OS}-${ARCH}.exe

compile-windows32:
  extends: .compile-windows-base
  variables:
    ARCH: x86
  script:
    - cd SRC
    - /c/vitess-data/vcvars_cmd32 nmake -f vitess.mak all
    - /c/vitess-data/vcvars_cmd32 nmake -f vitess.mak install
    - cd ..
    - *windows_package_script
  artifacts:
    paths:
      - artifacts-Windows10-x86/

compile-windows64:
  extends: .compile-windows-base
  variables:
    ARCH: x86_64
  script:
    - cd SRC
    - vcvars_cmd nmake -f vitess.mak all
    - vcvars_cmd nmake -f vitess.mak install
    - cd ..
    - *windows_package_script
  artifacts:
    paths:
      - artifacts-Windows10-x86_64/

test-rocky9:
  extends: compile-rocky9
  stage: test
  rules:
    - when: on_success
  needs: []
  before_script:
    - dnf install -y --nobest glibc-devel
    - dnf install -y make gcc 'gcc-c++' libXpm-devel libpng-devel gd-devel zlib-devel git unzip cmake libxml2-devel python3 diffutils libasan libubsan
    - *linux_before_script
  script:
    - cd SRC
    - make install DEBUG=2 NOG2=1
    - cd ..
    - tests/test_examples.sh
    - tests/test_modules.sh
  artifacts:
    paths: []

test-darwin:
  extends: compile-darwin
  stage: test
  rules:
    - when: on_success
  needs: []
  script:
    - cd SRC
    - make install DEBUG=2 NOG2=1
    - cd ..
    - tests/test_examples.sh
    - tests/test_modules.sh
  artifacts:
    paths: []

test-windows64:
  extends: compile-windows64
  stage: test
  rules:
    - when: on_success
  needs: []
  script:
    - pacman -S --noconfirm diffutils
    - cd SRC
    - vcvars_cmd nmake -f vitess.mak DEBUG=1 all
    - vcvars_cmd nmake -f vitess.mak DEBUG=1 install
    - cd ..
    - tests/test_modules.sh
  artifacts:
    paths: []

test-files:
  stage: test
  image: rockylinux:9
  needs:
    - job: compile-rocky9
  before_script:
    - dnf install -y python3 python3-pyyaml
  script:
    - cp -rf artifacts-Rocky9-x86_64/MODULES .
    - python3 tests/coverage.py || true
    - python3 tests/test_yaml_format.py -v
    - LARGEFILES="$(find . -type f -size +100M -not -path './.git/*' -print)";
      if [ -n "${LARGEFILES}" ]; then
        echo "The following files exceed the github limit of 100MB:";
        echo "${LARGEFILES}";
        exit 1;
      fi

package:
  stage: package
  image: rockylinux:8
  rules:
    - if: ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" )
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    - mkdir Downloads
    - for OSARCH in Rocky8-x86_64 Ubuntu-x86_64 Darwin-universal Windows10-x86 Windows10-x86_64 Rocky9-x86_64 Fedora40-x86_64 Debian-x86_64; do
        mkdir -p ${OSARCH}/vitess${VITESS_VERSION};
        cp -r `cat filelist.txt` ${OSARCH}/vitess${VITESS_VERSION}/;
        cp -rf artifacts-${OSARCH}/MODULES ${OSARCH}/vitess${VITESS_VERSION}/;
        [ ${OSARCH} = Darwin-universal ] && cp -r artifacts-${OSARCH}/Wish.app ${OSARCH}/vitess${VITESS_VERSION}/ && cp -r artifacts-${OSARCH}/gr ${OSARCH}/vitess${VITESS_VERSION}/;
        tar -czf Downloads/Vitess${VITESS_VERSION}-${OSARCH}.tar.gz -C ${OSARCH} vitess${VITESS_VERSION};
      done
    - cp artifacts-Windows10-x86/Vitess${VITESS_VERSION}-Windows10-x86.exe Downloads/
    - cp artifacts-Windows10-x86_64/Vitess${VITESS_VERSION}-Windows10-x86_64.exe Downloads/
  artifacts:
    paths:
      - Downloads/

pages:
  stage: publish
  image: rockylinux:9
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
    - when: never
  dependencies: []
  script:
    - cp -r WWW public
    - echo '/vitess/ /vitess/vitess.html 301' > public/_redirects
  artifacts:
    paths:
    - public

sync:
  stage: publish
  environment: sync
  image: rockylinux:9
  only:
    - master@vitess/vitess
    - develop@vitess/vitess
    - tags@vitess/vitess
  dependencies: []
  before_script:
    - dnf install -y git
  script:
    - mkdir --mode=700 ~/.ssh
    - echo -e "-----BEGIN OPENSSH PRIVATE KEY-----\n${VITESS_GITHUB_KEY}\n-----END OPENSSH PRIVATE KEY-----" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "${GITHUB_HOST_KEY}" >> ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
    - git clone --mirror "$CI_REPOSITORY_URL" vitess_mirror
    - cd vitess_mirror && git push -f --tags git@github.com:vitess-neutron/vitess.git refs/heads/master refs/heads/develop
