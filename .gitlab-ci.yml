compile-darwin:
  stage: build
  image: macos:catalina-xcode
  tags:
      - libvirt
  script:
    - cd SRC
    - make
    - make install
    - make clean
    - cd ..
    - mkdir artifacts-Darwin-x86_64
    - cp -r MODULES artifacts-Darwin-x86_64
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts-Darwin-x86_64/

test-rocky8:
  when: manual
  stage: test
  image: rockylinux:8
  script:
    - cp -rf artifacts-Rocky8-x86_64/MODULES .
    - echo "TODO no tests defined yet"

package-tarballs:
  stage: package
  image: rockylinux:8
  script:
    - mkdir Downloads
    - for OSARCH in Rocky8-x86_64 CentOS7-x86_64 Darwin-x86_64; do
        mkdir -p ${OSARCH}/vitess${VITESS_VERSION};
        cp -r `cat filelist.txt` ${OSARCH}/vitess${VITESS_VERSION}/;
        cp -rf artifacts-${OSARCH}/MODULES ${OSARCH}/vitess${VITESS_VERSION}/;
        tar -czf Downloads/Vitess${VITESS_VERSION}-${OSARCH}.tar.gz -C ${OSARCH} vitess${VITESS_VERSION};
      done
  artifacts:
    paths:
      - Downloads/
