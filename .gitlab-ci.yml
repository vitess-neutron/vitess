compile-darwin:
  stage: build
  image: macos:catalina-xcode
  tags:
      - libvirt
  script:
    - cd SRC
    - make
    - make install
    - make clean
    - cd ..
    - mkdir artifacts-darwin
    - cp -r MODULES artifacts-darwin/
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts-darwin/

test-rocky8:
  stage: test
  image: rockylinux:8
  script:
    - cp -rf artifacts-rocky8/MODULES .
    - echo "TODO no tests defined yet"

package-rocky8:
  stage: package
  image: rockylinux:8
  variables:
    DIR_NAME: vitess${VITESS_VERSION}
    TAR_NAME: Vitess${VITESS_VERSION}_Linux_x86_64.tar.gz
  script:
    - cp -rf artifacts-rocky8/MODULES .
    - mkdir ${DIR_NAME}
    - cp -r `cat filelist.txt` ${DIR_NAME}/
    - tar -czf ${TAR_NAME} ${DIR_NAME}
  artifacts:
    name: Vitess_Linux_x86_64
    paths:
      - ${TAR_NAME}

package-centos7:
  stage: package
  image: centos:7
  variables:
    DIR_NAME: vitess${VITESS_VERSION}
    TAR_NAME: Vitess${VITESS_VERSION}_Linux_x86_64.tar.gz
  script:
    - cp -rf artifacts-centos7/MODULES .
    - mkdir ${DIR_NAME}
    - cp -r `cat filelist.txt` ${DIR_NAME}/
    - tar -czf ${TAR_NAME} ${DIR_NAME}
  artifacts:
    name: Vitess_Linux_x86_64
    paths:
      - ${TAR_NAME}

