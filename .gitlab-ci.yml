variables:
  VITESS_VERSION: "3.5"

stages:
  - build
  - test
  - package

compile-rocky8:
  stage: build
  image: rockylinux:8
  before_script:
    - dnf install -y make gcc 'gcc-c++'
  script:
    - cd SRC
    - make
    - make install
    - make clean
    - cd ..
    - mkdir artifacts-rocky8
    - cp -r MODULES artifacts-rocky8/
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts-rocky8/

compile-centos7:
  stage: build
  image: centos:7
  before_script:
    - yum install -y make gcc 'gcc-c++'
  script:
    - cd SRC
    - make
    - make install
    - make clean
    - cd ..
    - mkdir artifacts-centos7
    - cp -r MODULES artifacts-centos7/
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts-centos7/

