#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe

monitor2D:                    # source module that will be executed 
  - category:  "monitor"

  - sMonFile :                # -O "sample"  common part of the output file names, up to 3 files possible with x-parameter A, B and C
      type:    "file" 
      plottable: true
      descr:   "monitor file" 
      default: "monitor1D.dat" 
      tooltip: "common part of the output file names, up to 3 files possible with x-parameter A, B and C"

  - ePar1  :                 # -X   VtMonPar  MonPar_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "1st parameter on x-axis"
      tooltip: "x-axis parameter for the 2D monitor file"
      enum:    "VtMonPar"
      options: ["none","pos_x","pos_y","pos_z","div_y","div_z", "lambda","energy","time","k_y","k_z",
                "pos_r","pos_phi","dir_phi","dir_theta", "col_vert","col_hor","color"]
      default:  "none"
      column:  0                     
      prefix:  "-X"   
  - ePar2  :                 # -Y   VtMonPar  MonPar_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "2nd parameter on y-axis"
      tooltip: "x-axis parameter for the 2D monitor file"
      enum:    "VtMonPar"
      options: ["none","pos_x","pos_y","pos_z","div_y","div_z", "lambda","energy","time","k_y","k_z",
                "pos_r","pos_phi","dir_phi","dir_theta", "col_vert","col_hor","color"]
      default:  "none"
      column:  1                     
      prefix:  "-Y"   

  - MinPar1 :                 # -w          minimal x value for the 2D monitor file
      type:    "float" 
      descr:   "min. x value 1st par." 
      tooltip: "minimal x value for the 2D monitor file"
      default: 0.0
      column:  0                     
      prefix:  "-w"  
  - MinPar2 :                 # -h          minimal x value for the 2D monitor file
      type:    "float" 
      descr:   "min. x value 2nd par." 
      tooltip: "minimal y value for the 2D monitor file"
      default: 0.0
      column:  1                     
      prefix:  "-h"  

  - MaxPar1 :                 # -W  10.0   maximal x value for the 2D monitor file 
      type:    "float" 
      descr:   "max. x value 1st par."
      tooltip: "maximal x value for the 2D monitor file"
      default: 10.0
      column:  0                     
      prefix:  "-W"  
  - MaxPar2 :                 # -H  10.0   maximal x value for the 2D monitor file 
      type:    "float" 
      descr:   "max. x value 1st par."
      tooltip: "maximal y value for the 2D monitor file"
      default: 10.0
      column:  1                     
      prefix:  "-H"  

  - nBinPar1:                 # -x   100    number of x channels for the 2D monitor file 
      type:    "int" 
      descr:   "number of bins 1st par." 
      tooltip: "number of x channels for the 2D monitor file" 
      default: 100
      min:     1
      column:  0                     
      prefix:  "-x"  
  - nBinPar2:                 # -y   100    number of x channels for the 2D monitor file 
      type:    "int" 
      descr:   "number of bins 2nd par." 
      tooltip: "number of y channels for the 2D monitor file" 
      default: 100
      min:     1
      column:  1                     
      prefix:  "-y"  


  - bProbWeight :                 # -p  YES   Display  : YES: Beam intensity   NO: number of trajectories
      type:    "switch" 
      descr:   "probability weight" 
      tooltip: "yes: the beam intensity is monitored \nno : the number of trajectories is monitored"
      default:  yes
      column:   0                     
      prefix:  "-p"  
  - bExcl:                 # -e  NO    Exclusion: YES: only neutrons meeting the monitor conditions are written  NO: all are written
      type:    "switch" 
      descr:   "exclusive counts" 
      tooltip: "yes: only trajectories meeting the monitor conditions are written \nno : all trajectories are written"
      default:  no
      column:   1                     
      prefix:  "-e"  
  - eFormat :              #     -F    VtFormat2D Format2D_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "file format" 
      tooltip:  "file format for output:  matrix: 2D matrix   xyz: 3 columns x, y, f(x,y); \ncompact: only 1 line of header, minimal number of digits."
      enum:     "VtFormat2D"
      options: ["matrix","xyz","matrix compact","xyz compact"]
      default:  "matrix"
      column:  2                     
      prefix:  "-F"  
 
  - title_FilSelect: 
      type:    "title" 
      default: "Filter selection"
  - LambdaMin :                 # -l       minimum wavelength to be taken into account [Ang]
      type:    "float" 
      descr:   "lambda min [Ang]"  
      tooltip: "minimum wavelength to be taken into account [Ang]"
      column:  1                     
      prefix:  "-l"   
  - LambdaMax :                 # -L       maximum wavelength to be taken into account [Ang]
      type:    "float" 
      descr:   "lambda max [A]" 
      tooltip: "maximum wavelength to be taken into account [Ang]" 
      column:   2                     
      prefix:  "-L"  

  - eFilterPar1 :                 # -I VtMonPar  MonPar_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "filter parameter 1"  
      tooltip: "filter parameter 1"
      enum:    "VtMonPar"
      options: ["none","pos_x","pos_y","pos_z","div_y","div_z","lambda","energy","time","k_y","k_z",
                "pos_r","pos_phi","dir_phi","dir_theta","col_vert","col_hor","color"]
      default:  "none"
      column:  0                     
      prefix:  "-I"  
  - MinFilterVal1:                # -u        minimum value of filter parameter 1 to be taken into account
      type:    "float" 
      descr:   "filter 1 min value" 
      tooltip: "minimum value of filter parameter 1 to be taken into account"
      column:  1                     
      prefix:  "-u"  
  - MaxFilterVal1:                 # -U       maximum value of filter parameter 1 to be taken into account 
      type:    "float" 
      descr:   "filter 1 max value" 
      column:  2                     
      prefix:  "-U"  

  - eFilterCombi:                 # -C  VtFiltComb FiltComb_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "filter combination" 
      tooltip: "filter 1 and 2 combined with AND or OR"
      enum:    "VtFiltComb"
      options: ["AND", "OR"]
      default:  "AND"
      column:   0                     
      prefix:  "-C"  

  - eFilterPar2 :                 # -J  VtMonPar  MonPar_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "filter parameter 2"
      tooltip: "filter parameter 2"
      enum:    "VtMonPar"
      options: ["none","pos_x","pos_y","pos_z","div_y","div_z","lambda","energy","time","k_y","k_z",
                "pos_r","pos_phi","dir_phi","dir_theta","col_vert","col_hor","color"]
      default:  "none"
      column:  0                    
      prefix:  "-J"  
  - MinFilterVal2:                 # -v        minimum value of parameter 2 to be taken into account
      type:    "float" 
      descr:   "filter 2 min value"  
      tooltip: "minimum value of parameter 2 to be taken into account" 
      column:  1                     
      prefix:  "-v"  
  - MaxFilterVal2:                 # -V        maximum value of parameter 2 to be taken into account
      type:    "float" 
      tooltip: "maximum value of parameter 2 to be taken into account"
      descr:   "filter 2 max value"
      column:  2                     
      prefix:  "-V"  

  - title_Pol: 
      type:    "title" 
      default: "Polarisation analysis"
  - bPolAnalysis :                 # -P  NO    YES: polarisation monitored   NO: intensity monitored
      type:    "switch" 
      descr:   "Polarisation analysis" 
      tooltip: "yes: polarisation is monitored \nno : intensity is monitored"
      default:  no
      column:   0                     
      prefix:  "-P"  

  - PolDirX :                 # -r        x-component of the vector defining the quantization direction
      type:    "float" 
      descr:   "direction X" 
      tooltip: "x-component of the vector defining the quantization direction"
      column:  0                     
      prefix:  "-r"  
  - PolDirY :                 # -s        y-component of the vector defining the quantization direction 
      type:    "float" 
      descr:   "direction Y" 
      tooltip: "y-component of the vector defining the quantization direction"
      column:  1                     
      prefix:  "-s"  
  - PolDirZ :                 # -t        z-component of the vector defining the quantization direction  
      type:    "float" 
      descr:   "direction Z" 
      tooltip: "z-component of the vector defining the quantization direction"
      column:  2                     
      prefix:  "-t"  

