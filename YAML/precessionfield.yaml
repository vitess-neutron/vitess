precessionfield:
  - category: "magnetic_field"

  - Title_param:
      type: "title"
      default: "Field options"

  - bf:
      type: "file"
      plottable: false
      editable: true
      descr: "field map file"
      tooltip: "data file giving the field map which is read in externally"
      default: "magneticmap.dat"
      column: 0
      prefix: "-P"

  - inh:
      type: "int"
      descr: "field option"
      tooltip: "magnetic field option: 0: homogenenous, 1: inhomogeneous"
      min: 0
      max: 1
      default: 1
      column: 0
      prefix: "-O"

  - Title_param:
      type: "title"
      default: "Homogeneous field case"

  - dx:
      type: "float"
      descr: "dimension field X [cm]"
      tooltip: "active if homogeneous field, gives x dimension of the precession volume"
      default: 10
      column: 0
      prefix: "-X"

  - dy:
      type: "float"
      descr: "dimension field Y [cm]"
      tooltip: "active if homogeneous field, gives y dimension of the precession volume"
      default: 10
      column: 1
      prefix: "-Y"

  - dz:
      type: "float"
      descr: "dimension field Z [cm]"
      tooltip: "active if homogeneous field, gives z dimension of the precession volume"
      default: 10
      column: 2
      prefix: "-V"

  - mx:
      type: "float"
      descr: "magnetic field X [Gs]"
      tooltip: "x component of the magnetic field in Gauss"
      default: 1
      column: 0
      prefix: "-T"

  - my:
      type: "float"
      descr: "magnetic field Y [Gs]"
      tooltip: "y component of the magnetic field in Gauss"
      default: 0
      column: 1
      prefix: "-G"

  - mz:
      type: "float"
      descr: "magnetic field Z [Gs]"
      tooltip: "z component of the magnetic field in Gauss"
      default: 0
      column: 2
      prefix: "-H"

  - Title_param:
      type: "title"
      default: "Geometry"

  - x:
      type: "float"
      descr: "position main X [cm]"
      tooltip: "center x position of the field map "
      default: 5
      column: 0
      prefix: "-k"

  - y:
      type: "float"
      descr: "position main Y [cm]"
      tooltip: "center y position of the field map "
      default: 0
      column: 1
      prefix: "-l"

  - z:
      type: "float"
      descr: "position main Z [cm]"
      tooltip: "center z position of the field map "
      default: 0
      column: 2
      prefix: "-m"

  - ho:
      type: "float"
      descr: "offset horiz. [deg]"
      tooltip: "horizontal (first rotation) rotation angle of the field map"
      default: 0
      column: 0
      prefix: "-i"

  - vo:
      type: "float"
      descr: "offset vert. [deg]"
      tooltip: "vertical (first rotation) rotation angles of the	field map"
      default: 0
      column: 1
      prefix: "-j"

  - Title_param:
      type: "title"
      default: "Output frame"

  - ox:
      type: "float"
      descr: "output X [cm]"
      tooltip: "x position of the output frame (in the input frame)"
      default: 10
      column: 0
      prefix: "-p"

  - oy:
      type: "float"
      descr: "output Y [cm]"
      tooltip: "y position of the output frame (in the input frame)"
      default: 0
      column: 1
      prefix: "-r"

  - oz:
      type: "float"
      descr: "output Z [cm]"
      tooltip: "z position of the output frame (in the input frame)"
      default: 0
      column: 2
      prefix: "-s"
