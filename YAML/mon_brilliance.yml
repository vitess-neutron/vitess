monitor1_pol:
   sName:
   sMonFile: "Sample.brl" #     -O  "monitor file"              "Monitor output file containing brilliance or brilliance transfer as a function of the chosen parameter"
   sRefFile:              #     -S  "reference file"            "Brilliance file used as reference (it is used to calculate the brilliance transfer)"
   sFlxFile:              #     -F  "flux file"                 "This file is used to monitor the average and max. brilliance as a function of the given parameter set.\n1 line is written in each simulation"

   ePar:     VT_NOT_DEF   #     -k  "variable\nparameter"       "ID for the parameter, as a function of which the brilliance is shown"
   eBrl:     BRL_ABS      #     -N  "norm. type"                "BRL_ABS: absolute brilliance [n/(cm²s sr Ang)]   BRL_TRANSF: relative brilliance (= brilliance transfer)   BRL_PCT: brilliance within 1% DelLamdba/Lambda [n/(cm²s sr)]
   bLogBin:   NO          #     -B  "logarithmic\nbinning"      "YES: bin size increases exponentially   NO: linear binning
   bExclude:  NO          #     -e  "exclusive\ncounts"         "YES: only neutrons meeting the monitor conditions are written   NO: all are written
   nBins:    100          # >=1 -n  "number\nof bins"           "number of monitor channels"
   iColour:               #     -C  "color"                     "color of the trajectories condidered by the monitor   (default: ALL)
   
   TimeMin:               #     -t  "min. time [ms]"            "minimal time-of-flight to be taken into account"
   TimeMax:               #     -T  "min. time [ms]"            "minimal time-of-flight to be taken into account"
   LmbdMin:               #     -l  "min. lambda [Ang]"         "minimal wavelength to be taken into account
   LmbdMax:               #     -L  "max. lambda [Ang]"         "minimal wavelength to be taken into account
   EMin:                  #     -m  "min. energy [meV]"         "minimal energy to be taken into account
   EMax:                  #     -M  "max. energy [meV]"         "minimal energy to be taken into account
   yMin:                  #     -y  "min. width  [cm]"          "minimal width to be taken into account
   yMax:                  #     -Y  "max. width  [cm]"          "minimal width to be taken into account
   zMin:                  #     -z  "min. height [cm]"          "minimal height to be taken into account
   zMax:                  #     -Z  "max. height [cm]"          "minimal height to be taken into account
   DivYMin:               #     -h  "min. hor. \ndiv. [deg]"    "minimal hor. div. to be taken into account
   DivYMax:               #     -H  "max. hor. \ndiv. [deg]"    "minimal hor. div. to be taken into account
   DivZMin:               #     -v  "min. vert. \ndiv. [deg]"   "minimal vert. div. to be taken into account
   DivZMax:               #     -V  "max. vert. \ndiv. [deg]"   "minimal vert. div. to be taken into account
   DivRMin:               #     -r  "min. radial \ndiv. [deg]"  "minimal radial div. to be taken into account
   DivRMax:               #     -R  "max. radial \ndiv. [deg]"  "minimal radial div. to be taken into account
   Freq:                  #     -f  "frequency [Hz]"            "source frequency"
                               
                               