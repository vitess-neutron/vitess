# description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe
eval_elast:            # source module that will be executed
  - category:  "evaluation"

  - Title_File:
      type:    "title"
      default: "Evalation parameter and output file"
  - eEvalPar:          # VtEvalPar EvalPar_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "evaluation parameter"
      tooltip: "Parameter, as a function of which the intensity is shown"
      enum:    "VtEvalPar"
      options: ["VT_EVAL_DSP", "VT_EVAL_Q", "VT_EVAL_ANGLE", "VT_EVAL_LMBD"]
      default: "VT_EVAL_DSP"
      prefix:  "-k"
  - sEvalFile:
      type:    "file"
      plottable: true
      descr:   "evaluation file"
      tooltip: "Output file of the evaluation containing the intensity as a function of the chosen parameter"
      default: "evaluation.dat"
      prefix:  "-o"

  - Title_Range:
      type:    "title"
      default: "Range and parameters"
  - nBins:
      type:    "int"
      descr:   "number of bins"
      tooltip: "Number of evaluation channels"
      default: 100
      min:     1
      column:  0
      prefix:  "-n"
  - MinX    :
      type:    "float"
      descr:   "min. value [Ang] [1/Ang] [deg]"
      tooltip: "Lower bound value of the evaluated range"
      default: 0.0
      column:  1
      prefix:  "-m"
  - MaxX    :
      type:    "float"
      descr:   "max. value [Ang] [1/Ang] [deg]"
      tooltip: "Upper bound value of the evaluated range"
      default: 10.0
      column:  2
      prefix:  "-M"

  - LogPct:
      type:    "float"
      descr:   "increase to next bin [%]"
      tooltip: "Percentage p of increase to next bin\np = 0: linear binning \np > 0: logarithmic binning (number of bins ignored)"
      default: 0.0
      column:  0
      prefix:  "-R"
  - DeadSpot:
      type:    "float"
      descr:   "dead spot [deg]"
      tooltip: "Excludes all neutrons with a scattering angle < DeadSpot"
      column:  1
      prefix:  "-d"
  - LambdaRef :
      type:    "float"
      descr:   "reference wavelength [Ang]"
      tooltip: "The (average) wavelength set by velocity selector, monchromator or chopper system (NOT used for TOF option)"
      min:     0.0
      column:  2
      prefix:  "-r"

  - bProbWeight :
      type:    "switch"
      descr:   "probability weight"
      tooltip: "yes: beam intensity is monitored \nno : number of trajectories is monitored"
      default:  yes
      column:   0
      prefix:  "-p"
  - bExcl:
      type:    "switch"
      descr:   "exclusive counts"
      tooltip: "yes: only neutrons meeting the evaluation conditions are written \nno: all are written"
      default:  no
      column:   1
      prefix:  "-c"
  - eAxis :            # VtAxis  Axis_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "Scat. axis of the sample"
      tooltip: "Defines if the scattering of the sample occurs only in y-direction or only in z-direction or is isotropic"
      enum:    "VtAxis"
      options: ["NO_AXIS", "Y_AXIS", "Z_AXIS"]
      default: "NO_AXIS"
      column:   2
      prefix:  "-A"

  - Title_TOF:
      type:    "title"
      default: "TOF option"
  - bTof :
      type:    "switch"
      descr:   "time of flight"
      tooltip: "yes: time of flight instrument \nno : instrument for continuous measurement"
      default:  no
      column:   0
      prefix:  "-w"
  - bPathCorrect:
      type:    "switch"
      descr:   "correct TOF to distance"
      tooltip: "yes: the distance from sample center to the position of the neutron detection is used to calculate the correct flight path \nno : the given 'filght path' is used"
      default:  yes
      column:   1
      prefix:  "-t"

  - FlightPath:
      type:    "float"
      descr:   "flight path [cm]"
      tooltip: "Nominal length of the neutron flight path from origin to detector (for TOF option)"
      min:     0.0
      column:  0
      prefix:  "-l"
  - DetDist:
      type:    "float"
      descr:   "sample-detector distance [cm]"
      tooltip: "Nominal distance from sample to detector (for TOF option)"
      min:     0.0
      column:  1
      prefix:  "-D"
  - TimeOffset:
      type:    "float"
      descr:   "time offset [ms]"
      tooltip: "global shift of the neutron time (t - TimeOffset) [ms] (for TOF option)"
      column:  2
      prefix:  "-T"

  - Title_Intens:
      type:    "title"
      default: "Peak intensities"
  - sIntFile:
      type:    "file"
      plottable: false
      descr:   "integration file"
      tooltip: "Optional: output file containing integrated intensities (see Help|evaluation) "
      default: ""
      prefix:  "-O"
  - sCtrlFile:
      type:    "file"
      plottable: false
      descr:   "control file"
      tooltip: "Optional: file controlling the output of integrated intensities (only needed for that)"
      default: ""
      prefix:  "-I"

  - Title_Filter:
      type:    "title"
      default: "Filter selection"
  - FilterTimeMin :
      type:    "float"
      descr:   "time interval begin [ms]"
      tooltip: "minimal TOF to be taken into account for evaluation (used for TOF and continuous instruments)"
      column:  0
      prefix:  "-e"
  - FilterTimeMax :
      type:    "float"
      descr:   "time interval end [ms]"
      tooltip: "maximal TOF to be taken into account for evaluation (used for TOF and continuous instruments)"
      column:  1
      prefix:  "-E"
  - iColor:
      type:    "int"
      descr:   "color"
      tooltip: "Excludes all neutrons with different color from evaluation.\n color=-1 means that all trajectories are regarded  "
      min:     -1
      column:  2
      prefix:  "-C"
