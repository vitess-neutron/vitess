spin_reset:
  - category: "event_handling"

  - scpoldeg:
      type: "float"
      descr: "degree of pola- rization [%]"
      tooltip: "percentage of polarisation"
      default: 0
      column: 0
      prefix: "-P"

  - scpolx:
      type: "float"
      descr: "polarisation X direction"
      tooltip: "X-component of the polarisation direction"
      default: 0
      column: 0
      prefix: "-X"

  - scpoly:
      type: "float"
      descr: "Y"
      tooltip: "Y-component of the polarisation direction"
      default: 0
      column: 1
      prefix: "-Y"

  - scpolz:
      type: "float"
      descr: "Z"
      tooltip: "Z-component of the polarisation direction"
      default: 1
      column: 2
      prefix: "-Z"

  - Title_param:
      type: "title"
      default: "Colour Reset"

  - sccolor:
      type: "int"
      descr: "number of colours"
      tooltip: "if greater zero, the colour of the trajectories will be reset (to a value between 1 and this number)"
      default: 0
      column: 0
      prefix: "-c"
