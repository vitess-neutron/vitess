mirror_elliptical:
  - category: "mirror"

  - Title_param:
      type: "title"
      default: "Geometry description of the elliptic mirror"

  - fx:
      type: "float"
      descr: "Semi axis X [cm]"
      tooltip: "Semi axis X for elliptic mirror"
      default: 250
      column: 0
      prefix: "-a"
      min: 0

  - fy:
      type: "float"
      descr: "Semi axis Y [cm]"
      tooltip: "Semi axis Y for elliptic mirror"
      default: 50
      column: 1
      prefix: "-b"
      min: 1.0e-6

  - fz:
      type: "float"
      descr: "Semi axis Z [cm]"
      tooltip: "Semi axis Z for elliptic mirror"
      default: 50
      column: 2
      prefix: "-c"
      min: 1.0e-6

  - px:
      type: "float"
      descr: "Center position main X [cm]"
      tooltip: "Center position of the elliptic mirror"
      default: 250
      column: 0
      prefix: "-d"

  - py:
      type: "float"
      descr: "Center position main Y [cm]"
      tooltip: "Center position of the elliptic mirror"
      default: 0
      column: 1
      prefix: "-e"

  - pz:
      type: "float"
      descr: "Center position main Z [cm]"
      tooltip: "Center position of the elliptic mirror"
      default: 0
      column: 2
      prefix: "-k"

  - ang:
      type: "float"
      descr: "Rotation angle [deg]"
      tooltip: "Rotate mirror (ONLY) around the center of the ellipsoide"
      default: 0
      column: 0
      prefix: "-Q"

  - ake:
      type: "int"
      descr: "Rotate around the axis"
      tooltip: "axis of rotation of the mirror  (0: X  1: Y  2: Z)"
      min: 0
      max: 2
      default: 0
      column: 0
      prefix: "-g"

  - Title_param:
      type: "title"
      default: "X, Y and Z Limits for the elliptic mirror"

  - pmx:
      type: "float"
      descr: "X_MIN [cm]"
      tooltip: "X minimum limitation for the elliptic mirror"
      default: 100
      column: 0
      prefix: "-A"

  - pmz:
      type: "float"
      descr: "Y_MIN [cm]"
      tooltip: "Y minimum limitation for the elliptic mirror"
      default: 20
      column: 1
      prefix: "-D"

  - pmt:
      type: "float"
      descr: "Z_MIN [cm]"
      tooltip: "Z minimum limitation for the elliptic mirror"
      default: -30
      column: 2
      prefix: "-H"

  - pmy:
      type: "float"
      descr: "X_MAX [cm]"
      tooltip: "X maximum limitation for the elliptic mirror"
      default: 400
      column: 0
      prefix: "-C"

  - pmw:
      type: "float"
      descr: "Y_MAX [cm]"
      tooltip: "Y maximum limitation for the elliptic mirror"
      default: 50
      column: 1
      prefix: "-E"

  - pmk:
      type: "float"
      descr: "Z_MAX [cm]"
      tooltip: "Z maximum limitation for the elliptic mirror"
      default: 30
      column: 2
      prefix: "-K"

  - Title_param:
      type: "title"
      default: "Output Plane"

  - ox:
      type: "float"
      descr: "output X [cm]"
      tooltip: "position of the output frame (in the input frame)"
      default: 500
      column: 0
      prefix: "-s"

  - oy:
      type: "float"
      descr: "output Y [cm]"
      tooltip: "position of the output frame (in the input frame)"
      default: 0
      column: 1
      prefix: "-t"

  - oz:
      type: "float"
      descr: "output Z [cm]"
      tooltip: "position of the output frame (in the input frame)"
      default: 0
      column: 2
      prefix: "-w"

  - Title_param:
      type: "title"
      default: "Visualisation"

  - visu:
      type: "switch"
      descr: "Activate visualisation"
      tooltip: "activate visualisation"
      default: true
      column: 0
      prefix: "-y"

  - visuty:
      type: "int"
      descr: "Type of visualisation"
      tooltip: "visualisation plane (0: XZ  1: XY  2: YZ)"
      min: 0
      max: 2
      default: 0
      column: 1
      prefix: "-Y"

  - visual:
      type: "switch"
      descr: "Full visualisation"
      tooltip: "Visualisation all neutrons paths or only refleted neutrons from mirror"
      default: false
      column: 2
      prefix: "-v"

  - visualty:
      type: "int"
      descr: "Output device (for Unix only)"
      tooltip: "for Unix/Linux: device for output (0: xwin  1:ps file)"
      min: 0
      max: 1
      default: 0
      column: 0
      prefix: "-l"

  - Title_param:
      type: "title"
      default: "Reflectivity for the elliptic mirror"

  - bfp:
      type: "file"
      plottable: false
      editable: true
      descr: "Spin_up reflectivity file"
      tooltip: "Spin_up file reflectivity"
      default: "mirr3+.dat"
      column: 0
      prefix: "-i"

  - bff:
      type: "file"
      plottable: false
      editable: true
      descr: "Spin_down reflectivity file"
      tooltip: "Spin_down file reflectivity"
      default: "mirr3+.dat"
      column: 0
      prefix: "-I"

  - surwav:
      type: "float"
      descr: "surface waviness [deg]"
      tooltip: "This parameter controls the simulation of surface waviness. This value is the maximal angle of deviation of the surface normal from the ideal normal."
      default: 0
      column: 0
      prefix: "-q"
      min: 0

  - reflne:
      type: "switch"
      descr: "Reflected neutrons"
      tooltip: "If yes is chosen, only reflected neutrons are going later, if no all neutrons are going later"
      default: false
      column: 0
      prefix: "-u"

  - outkey:
      type: "switch"
      descr: "Ideal reflection"
      tooltip: "Choose ideal reflection or from reflectivities files"
      default: true
      column: 1
      prefix: "-R"

  - pola:
      type: "switch"
      descr: "polarisation"
      tooltip: "yes: split into spin-down and spin-up reflectivity\nno: spin-up reflectivity for all neutrons"
      default: true
      column: 2
      prefix: "-p"

  - spiqua:
      type: "int"
      descr: "neutron spin axis"
      tooltip: "spin quantisation direction: 0: axis X, 1: axis Y, 2: axis Z"
      min: 0
      max: 2
      default: 0
      column: 0
      prefix: "-V"

  - Title_param:
      type: "title"
      default: "Air Attenuation Tair=293K"

  - himidi:
      type: "float"
      descr: "Air Himidity [%]"
      tooltip: "Choose himidity of air"
      default: 55.0
      column: 0
      prefix: "-r"
      min: 1.0e-6

  - airact:
      type: "switch"
      descr: "Air Attenuation"
      tooltip: "Activate or not the air attenuation of neutron beam, T=293K"
      default: false
      column: 0
      prefix: "-z"
