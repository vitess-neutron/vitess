source:
   Simulation: 
      SimName : "First Simulation"
      nTraj   :    1.0e7            # -n   1.0e6 [-]   number of neutron trajectories (events)  
      Lmin    :    0.75             # -m        [Ang]  minimum of the wavelength range 
      Lmax    :    2.4              # -M        [Ang]  maximum of the wavelength range 
      Tmin    :    0.0              # -t        [ms]   minimum of the time frame to start neutrons 
      Tmax    :    2.5              # -T        [ms]   maximum of the time frame to start neutrons 
      Divmin  :    0.0              # -y        [deg]  maximum horizontal divergence (half of angular spread x-y-plane) 
      Divmax  :    0.0              # -z        [deg]  maximum vertical divergence   (half of angular spread x-z-plane) 

      eDir    :  WINDOW             # -d  WINDOW [-]   enum: mode to determine neutron directions: DIVERGENCE  WINDOW 
      TDist   :  200.0              # -D   0.0  [cm]   distance moderator - target window 
      TWidth  :    2.0              # -w  10.0  [cm]   width of the target window 
      THeight :    4.0              # -h  10.0  [cm]   height of the target window 
      TofDist :  200.0              # -s   0.0  [cm]   distance moderator - position of time window   
      TofMin  :    2.0              # -f  -1e10 [cm]   min TOF allowed in time window  
      TofMax  :    4.0              # -F   1e10 [cm]   max TOF allowed in time window 

      TimeMeas:    0.0              # -A   0.0   [s]   time of measurement in second
      LmbdWant:    0.0              # -W   0.0  [Ang]  desired wavelength           
                                  
      PolVecX :    0.0              # -X   0.0  [cm]   x-component of the polarisation 
      PolVecY :    0.0              # -Y   0.0  [cm]   y-component of the polarisation
      PolVecZ :    0.0              # -V   0.0  [cm]   z-component of the polarisation
      PolDeg  :    0.0              # -P   0.0  [cm]   degree of polarization [%] 
                                   
      TrcFile :                     # -r         [-]   name of the file containing the IDs for tracing
      eTrcMode:    0                # -k   0           mode: NO_TRACING  WRITE_TRC_FILES  ONLY_TRC_TRAJ

   Source:
      SrcName : "ESS"               # -N   ""    [-]   name of the source
      eType   :  LPSS               # -S         [-]   enum: source type:  CWS  SPSS  LPSS 
      Freq    :   24.0              # -R        [Hz]   pulse frequency 
      Power   :    2.0              # -L   2.0  [MW]   average source power
      Length  :    0.0833           # -p   2.0  [ms]   proton pulse length  
      DataVsn :    1                # -v   1     [-]   version of the data base
      Beamline: "S3"                # -B         [-]   name of the beamline  
      Decl    :    0.0              # -i   0.0  [deg]  declination between moderator surface normal and propagation window 

   Moderator:
      - ModName : "Thermal moderator"
        eType   :  COUPLED          # COUPLED     [-]  enum: moderator type:  POISONED DECOUPLED COUPLED 
        eShape  :  CIRCULAR         # RECTANGULAR [-]  enum: moderator shape: RECTANGULAR CIRCULAR 
        Diameter:    4.4            #      0.0  [cm]   diameter of the moderator 
        Height  :    0.0            #      0.0  [cm]   height of the moderator 
        Width   :    0.0            #      0.0  [cm]   width  of the moderator 
        Order   :    2              #      0     [-]   spatial order of the moderator (the higher the number the more it is in the background) 
        Color   :    1              #      0     [-]   the trajectories can be marked by this 'color' to identify the moderator of origin 
        CntrX   :    0.0            #      0.0  [cm]   x coordinate of the center of the moderator 
        CntrY   :    0.0            #      0.0  [cm]   y coordinate of the center of the moderator 
        CntrZ   :    0.0            #      0.0  [cm]   x coordinate of the center of the moderator 
        Temp    :  305.0            #           [cm]   temperature of a Maxwellian distribution 
        Flux    :    4.3e12         #        [n/cm²/s] Flux on moderator surface into solid angle 2*pi integrated over wavelength 
        Current :                   #           [n/s]  Moderator current (only useful if moderator flux is zero) 
        PfmcFact:    1.0            #      1.0  [cm]   Factor allowing for losses by aging or engineering design d 
        LmbdFile: ""                #      ""    [-]   file containing the wavelength distribution function 
        TimeFile: ""                #      ""    [-]   file containing the time distribution function 
        L_T_File: ""                #      ""    [-]   file containing the wavelength-time distribution function 
        tau_1   :   26.0            #      0.0  [us]   first time constant of the pulse (ascending) tau_1 < tau_2 
        tau_2   :  130.0            #      0.0  [us]   second time constant of the pulse (descending) tau_1 < tau_2 
      - ModName : "Cold moderator"
        eType   :  COUPLED          # COUPLED     [-]  enum: moderator type:  POISONED DECOUPLED COUPLED 
        eShape  :  CIRCULAR         # RECTANGULAR [-]  enum: moderator shape: RECTANGULAR CIRCULAR 
        Diameter:    2.0            #      0.0  [cm]   diameter of the moderator 
        Order   :    1              #      0     [-]   spatial order of the moderator (the higher the number the more it is in the background) 
        Color   :    2              #      0     [-]   the trajectories can be marked by this 'color' to identify the moderator of origin 
        Temp    :  305.0            #           [cm]   temperature of a Maxwellian distribution 
        Flux    :    6.6e12         #        [n/cm²/s] Flux on moderator surface into solid angle 2*pi integrated over wavelength 
        tau_1   :   26.0            #      0.0  [us]   first time constant of the pulse (ascending) tau_1 < tau_2 
        tau_2   :  130.0            #      0.0  [us]   second time constant of the pulse (descending) tau_1 < tau_2 
