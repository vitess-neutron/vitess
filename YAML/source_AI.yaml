#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

source_ai:
  - category: "source"
  - Title_Shape:
      type: "title"
      default: "Variational Autoencoder model. Needs libtorch installation"
  - sModFile:
      type: "file"
      plottable: false
      descr: "Model file"
      tooltip: "The model is the result of torch.jit.save(model) in python, where model is a PyTorch model. Model file Specifies the model to be used (ending .model in FILES/moderators"
      default: "vae_hbs.model"
      prefix: "-M"
  - nNeut:
      type : "int"
      descr: "Number of traj. per bunch"
      tooltip: "number of neutrons simulates in a single bunch. the total number of neutrons is nNeut x nBunches"
      column: 0
      default: 10000
      prefix: "-n"
  - nBunches:
      type : "int"
      descr: "number of neutron bunches"
      tooltip: "neutrons are bunches into nBunches, total number of neutrons will be nNeut x nBunches."
      column: 1
      default : 10
      prefix: "-b"

