flipper_coil:
  - category: "flipper"

  - Title_param:
      type: "title"
      default: "Rectangular coil flipper"

  - x:
      type: "float"
      descr: "position main X [cm]"
      tooltip: "center position x of the rectangular coil"
      default: 5
      column: 0
      prefix: "-k"

  - y:
      type: "float"
      descr: "position main Y [cm]"
      tooltip: "center position y of the rectangular coil"
      default: 0
      column: 1
      prefix: "-l"

  - z:
      type: "float"
      descr: "position main Z [cm]"
      tooltip: "center position z of the rectangular coil"
      default: 0
      column: 2
      prefix: "-m"

  - cas:
      type: "int"
      descr: "orientation of the coil axes"
      tooltip: "1: Y direction, 2: Z direction"
      default: 0
      column: 0
      prefix: "-y"

  - hof:
      type: "float"
      descr: "offset horiz. [deg]"
      tooltip: "rotation angle (first rotation) of the coil axes in horizontal direction"
      default: 0
      column: 0
      prefix: "-i"

  - vof:
      type: "float"
      descr: "offset vert. [deg]"
      tooltip: "rotation angle (first rotation) of the coil axes in vertical direction"
      default: 0
      column: 1
      prefix: "-j"

  - dx:
      type: "float"
      descr: "dimension X [cm]"
      tooltip: "dimension of the rectangular coil in X direction"
      default: 10
      column: 0
      prefix: "-X"

  - dy:
      type: "float"
      descr: "dimension Y [cm]"
      tooltip: "dimension of the rectangular coil in Y direction"
      default: 10
      column: 1
      prefix: "-Y"

  - dz:
      type: "float"
      descr: "dimension Z [cm]"
      tooltip: "dimension of the rectangular coil in Z direction"
      default: 10
      column: 2
      prefix: "-V"

  - gf:
      type: "float"
      descr: "guide field [Gs]"
      tooltip: "strength of the guide magnetic field which is considered parallel to the beam axes"
      default: 0.9787
      column: 0
      prefix: "-G"

  - cf:
      type: "float"
      descr: "coil field component [Gs]"
      tooltip: "strength of the coil magnetic field which is considered parallel to the coil axes"
      default: 0.9787
      column: 0
      prefix: "-H"

  - wt:
      type: "float"
      descr: "wall thickness [cm]"
      tooltip: "thickness of the coil wire (wall)"
      default: 0.2
      column: 1
      prefix: "-t"
      min: 0

  - ns:
      type: "float"
      descr: "field mesh steps"
      tooltip: "number of 'boxes' in which the field is devided (max:100)"
      default: 10
      column: 0
      prefix: "-N"

  - ox:
      type: "float"
      descr: "output X [cm]"
      tooltip: "x position of the output frame (in the input frame)"
      default: 10
      column: 0
      prefix: "-p"

  - oy:
      type: "float"
      descr: "output Y [cm]"
      tooltip: "y position of the output frame (in the input frame)"
      default: 0
      column: 0
      prefix: "-r"

  - oz:
      type: "float"
      descr: "output Z [cm]"
      tooltip: "z position of the output frame (in the input frame)"
      default: 0
      column: 0
      prefix: "-s"


