sample_elasticisotr:
   Name    : "vanadium"
   bColor  :    0             # -c ANY_COLOR [-]  color: if != -1, only neutrons of this colour are treated 
   Repete  :    1             # -A    1    [-]    repetitions (number of trajectories generated per incoming trajectory) 
   SmplFile: "elast.iso"      # -P         [-]    sample parameter file name 

   ScatHor :   90.0           # file  0.0 [deg]   horizontal rotation defining the main scattering direction
   ScatVert:    0.0           # file  0.0 [deg]   vertical rotation defining the main scattering direction
   VarHor  :    1.0           # file  0.0 [deg]   variation DelTheta determining the hor. scat. range [Theta-DelTheta/2, Theta+DelTheta/2]
   VarVert :    1.0           # file  0.0 [deg]   variation DelPhi determining the vert. scat. range [Phi-DelPhi/2, Phi+DelPhi/2]
   MuScaTot:    0.0           # file  0.0 [1/cm]  user defined macroscopic total scattering cross section of the sample 
   MuAbs   :    0.0           # file  0.0 [1/cm]  user defined macroscopic absorption cross section of the sample 

   SmplGeom:  CYLINDER        # file       [-]    enum sample geometry: CYLINDER  SPHERE  CUBOID  HOLLOW_CYLINDER
   PosX    :  100.0           # file  0.0  [cm]   center x position of the sample 
   PosY    :    0.0           # file  0.0  [cm]   center y position of the sample 
   PosZ    :    0.0           # file  0.0  [cm]   center z position of the sample 
   SmplHor :    0.0           # file  0.0  [-]    horizontal rotation of the sample 
   SmplVert:    0.0           # file  0.0  [-]    vertical rotation of the sample
   SizePar1:    0.2           # file  0.0  [cm]   thickness of cuboid / (outer) diameter of sphere or cylinder
   Height  :    3.0           # file  0.0  [cm]   height of cuboid or cylinder
   Width   :    0.0           # file  0.0  [cm]   width of cuboid or inner diameter of a hollow cylinder

   OutX    :  100.0           # file  0.0  [cm]   x coordinate in output frame 
   OutY    :    0.0           # file  0.0  [cm]   y coordinate in output frame 
   OutZ    :    0.0           # file  0.0  [cm]   x coordinate in output frame 
   OutHor  :   90.0           # file  0.0 [deg]   horizontal angular coordinate in output frame 
   OutVert :    0.0           # file  0.0 [deg]   vertical angular coordinate in output frame 
