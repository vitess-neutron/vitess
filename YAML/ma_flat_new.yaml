#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

monochromator:
  - category: "monochr_analyser"

  - option:
      type: int
      descr: "Type of crystal simulation"
      tooltip: "1: Crystal_flat, 2: Crystal_focus, 3: Crystal_focus_dat"
      hidden: true
      min: 1
      max: 3
      default: 1
      prefix: "-O"

  - Title_param:
      type: "title"
      default: "Monochromator Analyser"

  - parfile :
      type:    "file"
      plottable: false
      editable: true
      descr:   "parameter file"
      default: "crys.par"
      tooltip: "This files contains parameters describing a crystal element (CE)"
      prefix:  "-P"

  - mode:
      type: "combo"
      descr: "Geometry"
      tooltip: "Choose between 'reflection' and 'transmission' geometry of the monochromator."
      enum: "VtMonoType"
      options: ["REFL_MONO", "TRANSM_MONO"]
      default: "REFL_MONO"
      column: 0
      prefix: "-X"

  - trns:
      type: "switch"
      descr: "transmission"
      tooltip: "Select if the neutrons that are not reflected by the crystals shall be treated. Note that in both cases the 'standard frame generation' rotates the co-ordinate to the reflected beam."
      default: false
      column: 1
      prefix: "-B"

  - dist:
      type: "combo"
      descr: "d-distribution"
      tooltip: "defines the d-spacing distribution function"
      enum: "VtDistr"
      options: ["LORENTZIAN", "GAUSSIAN"]
      default: "LORENTZIAN"
      column: 2
      prefix: "-d"

  - Title_param:
      type: "title"
      default: "Crystal parameters"

  - shoriz:
      type: "float"
      descr: "mosaic spread horiz. [deg]"
      tooltip: "Horizontal fwhm component of the 2-dimensional Gaussian mosaic distribution [deg]"
      default: 0.8
      column: 0
      prefix: "-m"
      min: 0

  - svert:
      type: "float"
      descr: "mosaic spread vert. [deg]"
      tooltip: "Vertical fwhm component of the 2-dimensional Gaussian mosaic distribution [deg]"
      default: 0.8
      column: 1
      prefix: "-M"
      min: 0

  - dspread:
      type: "float"
      descr: "d spread"
      tooltip: "Fwhm of the d-spacing distribution function divided by the lattice parameter under consideration. It is zero for a perfect crystal."
      default: 0.00005
      column: 2
      prefix: "-D"
      min: 0

  - refl:
      type: "float"
      descr: "peak reflectivity"
      tooltip: "(Experimentally determined) peak reflectivity of this monochromator."
      default: 1
      column: 0
      prefix: "-R"
      min: 1.0e-6

  - Title_param:
      type: "title"
      default: "Rotation and Oscillation"

  - mo_move:
      type: "combo"
      descr: "movement"
      tooltip: "Type of movement of the monochromator crystal(s)"
      enum: "VtMonoMove"
      options: ["VT_MONO_FIX", "VT_MONO_ROT", "VT_MONO_PST", "VT_MONO_OSC"]
      default: "VT_MONO_FIX"
      column: 0
      prefix: "-b"

  - mo_rndt:
      type: "switch"
      descr: "randomize TOF"
      tooltip: "yes: the time of arrival at the monochromator is defined by a random choice within the period of the monochromator rotation/oscillation, i.e. the real TOF is ignored. Useful for a PST on a continuous source"
      default: false
      column: 1
      prefix: "-K"

  - mo_freq:
      type: "float"
      descr: "frequency [Hz]"
      tooltip: "Frequency of the monochromator rotation/oscillation"
      default: 0
      column: 0
      prefix: "-f"

  - mo_phas:
      type: "float"
      descr: "initial phase [deg]"
      tooltip: "Phase of the monochromator at t=0 [deg] phase=0 means that the crystal orientations relative to the beam is	defined by the offset of the Bragg reflection"
      default: 0
      column: 1
      prefix: "-p"

  - mo_ampl:
      type: "float"
      descr: "drive amplitude[cm]"
      tooltip: "For Doppler drive only: Amplitude of the Doppler drive along the x axis"
      default: 0
      column: 2
      prefix: "-Q"

  - mo_nwnd:
      type: "float"
      descr: "number of areas"
      tooltip: "For PST only: number of identical areas, where the monochromator is mounted on the chopper"
      default: 0
      column: 0
      prefix: "-n"

  - mo_wdth:
      type: "float"
      descr: "area width [deg]"
      tooltip: "For PST only: angular range of each area, where the monochromator is mounted on the chopper"
      default: 0
      column: 1
      prefix: "-q"

  - mo_rad:
      type: "float"
      descr: "chopper radius[cm]"
      tooltip: "For PST only: distance from the chopper axle to the center of the monochromator"
      default: 0
      column: 2
      prefix: "-w"

  - Title_param:
      type: "title"
      default: "Attenuation and repetition"

  - mo_scat:
      type: "float"
      descr: "total scat- tering [1/cm]"
      tooltip: "macroscopic total scattering cross-section of the crystal [1/cm]"
      default: 0
      column: 0
      prefix: "-c"
      min: 0

  - mo_abs:
      type: "float"
      descr: "absorption [1/cm]"
      tooltip: "macroscopic absorption cross-section of the crystal for 1.798 Ang [1/cm]"
      default: 0
      column: 1
      prefix: "-C"
      min: 0

  - reprate:
      type: "int"
      descr: "repetition"
      tooltip: "If this integer > 1, the trajectory is used multiple times for better statistics."
      default: 1
      column: 2
      prefix: "-A"
      min: 1
      max: 1000
