#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

spacewindow_multiple:
  - category:  "spacewindow"

  - colfile:
      type:    "file"
      plottable: false
      editable: true
      descr:   "collimator file"
      tooltip: "File which contains the circular hole(s) data. Each line must contain a triple of data describing a hole : y,z,radius. The number of holes for each collimator must be less than 100. (see help)"
      default: ""
      prefix:  "-I"

  - dist:
      type: "float"
      descr: "distance orig <->win [cm]"
      tooltip: "Distance to window along x-direction  [cm]"
      default: 0
      column: 0
      prefix: "-D"
      min: 0

  - rad:
      type: "float"
      descr: "Outer radius [cm]"
      tooltip: "Outer radius of the circular plate (multiaperture collimators) [cm]"
      default: 100
      column: 1
      prefix: "-r"
      min: 1.0e-6

  - wndshape:
      type:    "combo"
      descr:   "shape"
      tooltip: "shape of the individual windows automatic means: 3 columns gives circular, 4 columns rectangular shape"
      enum: "VtMultWndShape"
      options: ["VT_MWND_AUTO", "VT_MWND_CIRCLE", "VT_MWND_SQUARE"]
      default:  "VT_MWND_AUTO"
      column:   0
      prefix:  "-S"

  - Title_param:
      type: "title"
      default: "Outer Material"

  - matfile:
      type:    "file"
      plottable: false
      editable: false
      descr:   "transmission file"
      tooltip: "File containing the wavelength dependent attenuation inside the window frame (not for beamstop option, see Help file for details)"
      default: ""
      prefix:  "-C"

  - thick:
      type: "float"
      descr: "thickness of frame [cm]"
      tooltip: "Thickness of the material used for the absorbing window frame. It is centered around the distance from the origin and cannot be thinner than pane (cf. help file)"
      default:
      column: 0
      prefix: "-t"
      min: 0

  - mat:
      type:    "combo"
      descr:   "frame material"
      tooltip: "Material used for the absorbing window frame.\nFor the beamstop option, vacuum is assumed"
      enum:    "VtWndAbs"
      options: ["VT_WABS_FILE", "VT_WABS_GD", "VT_WABS_CD", "VT_WABS_B10", "VT_WABS_EU", "VT_WABS_SI", "VT_WABS_IDEAL"]
      default: "VT_WABS_IDEAL"
      column:   0
      prefix:  "-c"


  - Title_param:
      type: "title"
      default: "Inner Material"

  - imatfile:
      type:    "file"
      plottable: false
      editable: true
      descr:   "transmission file"
      tooltip: "File containing the wavelength dependent attenuation inside the window pane or the beamstop (see Help file for details)"
      default: ""
      prefix:  "-m"

  - imatthick:
      type: "float"
      descr: "thickness of window pane [cm]"
      tooltip: "Thickness of the material used for the window pane or for the beamstop It is centered around the distance from the origin and cannot be thicker than frame (cf. help file)"
      default:
      column: 0
      prefix: "-T"
      min: 0

