monochromator:
   Name    : "RotMono"
   eMonGeom: SINGLE_CE        # -O    NN    [-]   Geometry option:                 SINGLE_CE   CE_ARRAY_CALC   CE_ARRAY_FILE

   eMonMode: REFL_MONO        # -X    NN    [-]   Monochr. geometry type:          REFL_MONO   TRANSM_MONO      
   bTransm : NO               # -o    NO    [-]   flag: treat transmitted beam     NO          YES
   d_sprOpt: GAUSSIAN         # -d    NN    [-]   d-spacing distribution function  LORENTZIAN  GAUSSIAN

   MosaicH :  0.27            # -m    0.0  [deg]  Horizontal mosaicity 
   MosaicV :  0.27            # -M    0.0  [deg]  Vertical mosaicity 
   d_fwhm  :  1.0e-4          # -D    0.0   [-]   relative d-spread del_d/d (fwhm)
   Reflect :  0.21            # -R    1.0   [-]   Peak Reflectivity 
   nRepete : 10               # -A    1     [-]   Number of times the neutrons is reflected at the monochromator
   Freq    : 50.0             # -f    0.0  [1/s]  Rot. frequency of the monochromator                             
   Zeta0   :  0.0             # -z    0.0  [deg]  zero time orientation of the rotating monochromator             
   MuScat  :  0.380           # -c    0.0  [1/cm] Macrosc. total scattering cross-section in the crystal          .
   MuAbs   :  0.097           # -C    0.0  [1/cm] Macrosc. absorption cross-section in the crystal for 1.798 Ang  .

   GeomFile:                  # -G          [-]   Name of the geometry file  (arrangement of the crystal elements)        
   eFocGeom:                  # -g    NN    [-]   Focusing geometry:     CONST_LMBD   SPHERICAL   VERT_CYL   DBL_FOC
   NumCEhor:                  # -H    1     [-]   Number of horizontal CE segments
   NumCEvrt:                  # -V    1     [-]   Number of vertical CE segments
   RadH    :                  # -s    0.0  [cm]   Horizontal radius
   RadV    :                  # -r    0.0  [cm]   Vertical radius
   PsiBot  :                  # -a    0.0  [deg]  Angular offset of the bottom row of the crystal elements   
   GapH    :                  # -h    0.0  [cm]   Horizontal distance between crystal elements
   GapV    :                  # -v    0.0  [cm]   Vertical distance between crystal elements
   DevH    :                  # -t    0.0  [deg]  Horizontal deviation from correct crystal orientation
   DevV    :                  # -T    0.0  [deg]  Vertical deviation from correct crystal orientation

#  ParFile :                  # -P          [-]   Name of the parameter file (orientation: positione, size of a crystal element) 
   PosX    :  100.0           # file  0.0  [cm]   center x position of the center of the monochromator 
   PosY    :    0.0           # file  0.0  [cm]   center y position of the center of the monochromator
   PosZ    :    0.0           # file  0.0  [cm]   center z position of the center of the monochromator
   SrfcHor :   45.0           # file  0.0  [deg]  Horizontal surface orientation (relative backscattering direction)
   SrfcVrt :    0.0           # file  0.0  [deg]  Vertical surface orientation (relative backscattering direction)
   BraggHor:   45.0           # file  0.0  [deg]  Horizontal crystal plane orientation (relative backscattering direction)
   BraggVrt:    0.0           # file  0.0  [deg]  Vertical crystal plane orientation (relative backscattering direction)
   ThickCE :    0.2           # file  0.0  [cm]   thickness of a crystal element
   WidthCE :    0.0           # file  0.0  [cm]   width of of a crystal element
   HeightCE:    3.0           # file  0.0  [cm]   height of of a crystal element
   d_spacin:    1.089         #       0.0  [cm]   Distance of the (h,k,l) crystal planes
   OrderRef:    1             #       1     [-]   Order of Bragg reflection (usually 1)
   bOutUser:  YES             #       0     [-]   flag: 'user defined frame' YES   NO 
   OutX    :  100.0           #       0.0  [cm]   x position of the output co-ordinate system 
   OutY    :    0.0           #       0.0  [cm]   y position of the output co-ordinate system 
   OutZ    :    0.0           #       0.0  [cm]   z position of the output co-ordinate system 
   OutHor  :   90.0           # file  0.0  [deg]  Horizontal orientation of the output co-ordinate system
   OutVert :    0.0           # file  0.0  [deg]  Vertical orientation of the output co-ordinate system
