flipper_gradient:
  - category: "flipper"

  - Title_param:
      type: "title"
      default: "Geometry description of the common field"

  - px:
      type: "float"
      descr: "position center X [cm]"
      tooltip: "Center position of the flipper"
      default: 5
      column: 0
      prefix: "-k"

  - py:
      type: "float"
      descr: "position center Y [cm]"
      tooltip: "Center position of the flipper"
      default: 0
      column: 1
      prefix: "-l"

  - pz:
      type: "float"
      descr: "position center Z [cm]"
      tooltip: "Center position of the flipper"
      default: 0
      column: 2
      prefix: "-m"

  - fx:
      type: "float"
      descr: "size field X [cm]"
      tooltip: "Length of the cuboidel of the flipper"
      default: 10
      column: 0
      prefix: "-X"
      min: 1.0e-6

  - fy:
      type: "float"
      descr: "size field Y [cm]"
      tooltip: "Width of the cuboidel of the flipper"
      default: 10
      column: 1
      prefix: "-Y"
      min: 1.0e-6

  - fz:
      type: "float"
      descr: "size field Z [cm]"
      tooltip: "Height of the cuboidel of the flipper"
      default: 10
      column: 2
      prefix: "-V"
      min: 1.0e-6

  - Title_param:
      type: "title"
      default: "Number of domains"

  - nx:
      type: "int"
      descr: "in X direction"
      tooltip: "Number of domains in the X direction"
      default: 4
      column: 0
      prefix: "-C"
      min: 1

  - ny:
      type: "int"
      descr: "in Y direction"
      tooltip: "Number of domains in the Y direction"
      default: 2
      column: 1
      prefix: "-D"
      min: 1

  - nz:
      type: "int"
      descr: "in Z direction"
      tooltip: "Number of domains in the Z direction"
      default: 2
      column: 2
      prefix: "-E"
      min: 1

  - Title_param:
      type: "title"
      default: "Rotation of Precession Volume"

  - rotproc:
      type: "float"
      descr: "horizontal offset [deg]"
      tooltip: "Horizontal (around axis OZ) angle of the field volume"
      default: 0
      column: 0
      prefix: "-i"

  - Title_param:
      type: "title"
      default: "Output Frame"

  - ox:
      type: "float"
      descr: "output frame X [cm]"
      tooltip: "Position of the output frame (in the input frame)"
      default: 10
      column: 0
      prefix: "-p"

  - oy:
      type: "float"
      descr: "output frame Y [cm]"
      tooltip: "Position of the output frame (in the input frame)"
      default: 0
      column: 1
      prefix: "-r"

  - oz:
      type: "float"
      descr: "output frame Z [cm]"
      tooltip: "Position of the output frame (in the input frame)"
      default: 0
      column: 2
      prefix: "-s"

  - Title_param:
      type: "title"
      default: "Rotating Magnetic Field"

  - mf:
      type: "float"
      descr: "magnetic field amplitude [Gs]"
      tooltip: "Amplitude of the rotating magnetic field in Gauss"
      default: 5000
      column: 0
      prefix: "-d"
      min: 0

  - rf:
      type: "float"
      descr: "rotation frequency [Hz]"
      tooltip: "Rotation frequency of the magnetic field"
      default: 300000
      column: 1
      prefix: "-w"

  - bp:
      type: "float"
      descr: "begin phase [deg] "
      tooltip: "Initial phase for the rotating field"
      default: 0
      column: 2
      prefix: "-z"

  - rax:
      type: "int"
      descr: "rotating field axis"
      tooltip: "Direction about which the field rotates: x-, y-, z-axis (values 0, 1, 2 resp.)"
      min: 0
      max: 2
      default: 0
      column: 0
      prefix: "-M"

  - chgampl:
      type: "int"
      descr: "amplitude changing by"
      tooltip: "Function of the variation of the rotating field amplitude: SINUS, PERMANENT, SOLENOID (values 0, 1, 2 resp.)"
      min: 0
      max: 2
      default: 0
      column: 1
      prefix: "-h"

  - raxx:
      type: "int"
      descr: "amplitude changing along axis"
      tooltip: "Direction of changing of the rotating field amplitude: x-, y-, z-axis (values 0, 1, 2 resp.)"
      min: 0
      max: 2
      default: 0
      column: 2
      prefix: "-y"

  - mfd:
      type: "float"
      descr: "deviation of amplitude [%]"
      tooltip: "Deviation of amplitude of the rotating magnetic field in percent"
      default: 0
      column: 0
      prefix: "-a"
      min: 0

  - rfd:
      type: "float"
      descr: "deviation of frequency [%]"
      tooltip: "Deviation of Rotation frequency of the magnetic field in percent"
      default: 0
      column: 1
      prefix: "-b"
      min: 0

  - distra:
      type: "int"
      descr: "amplitude distribution"
      tooltip: "Distribution of the amplitude of the rotating field: 0: Normal (default), 1: Uniform"
      min: 0
      max: 1
      default: 0
      column: 0
      prefix: "-e"

  - distrf:
      type: "int"
      descr: "Frequency distribution"
      tooltip: "Distribution of the frequency of the rotating field: 0: Normal (default), 1: Uniform"
      min: 0
      max: 1
      default: 0
      column: 1
      prefix: "-v"

  - tofprec:
      type: "switch"
      descr: "TOF from prec. module"
      tooltip: "Use of TOF for the rotating field phase 'yes': TOF from preceding modules 'no' TOF = 0.0"
      default: true
      column: 2
      prefix: "-n"

  - Title_param:
      type: "title"
      default: "Guide Magnetic Field"

  - pmx:
      type: "float"
      descr: "perm. / initial component X [Gs]"
      tooltip: "Permanent (for cosine amd permanent laws) or initial (for linear law) value of the X component (projection in the axis 0X) of the guide magnetic field, Gs=Gauss"
      default: 0
      column: 0
      prefix: "-I"

  - pmy:
      type: "float"
      descr: "perm. / initial component Y [Gs]"
      tooltip: "Permanent (for cosine and permanent laws) or initial (for linear law) value of the Y component (projection in the axis 0Y) of the guide magnetic field, Gs=Gauss"
      default: 0
      column: 2
      prefix: "-A"

  - pmz:
      type: "float"
      descr: "perm. / initial component Z [Gs]"
      tooltip: "Permanent (for cosine and permanent laws) or initial (for linear law) value of the Z component (projection in the axis 0Z) of the guide magnetic field, Gs=Gauss"
      default: 0
      column: 0
      prefix: "-K"

  - plmx:
      type: "float"
      descr: "amplitude or final X [Gs]"
      tooltip: "Amplitude (for cosine law) or final value (for linear law) of the X component (projection in the axis 0X) of the guide magnetic field, Gs=Gauss"
      default: 0
      column: 0
      prefix: "-P"

  - plmy:
      type: "float"
      descr: "amplitude or final Y [Gs]"
      tooltip: "Amplitude (for cosine law) or final value (for linear law) of the Y component (projection in the axis 0Y) of the guide magnetic field, Gs=Gauss"
      default: 0
      column: 1
      prefix: "-Q"

  - plmz:
      type: "float"
      descr: "amplitude or final Z [Gs]"
      tooltip: "Amplitude (for cosine law) or final value (for linear law) of the Z component (projection in the axis 0Z) of the guide magnetic field, Gs=Gauss"
      default: 0
      column: 2
      prefix: "-R"

  - pmde:
      type: "float"
      descr: "additional random magnetic field, [Gs]"
      tooltip: "Amplitude of the additional random magnetic field"
      default: 0
      column: 0
      prefix: "-q"
      min: 0

  - chgamplgui:
      type: "int"
      descr: "law of changing"
      tooltip: "Function of the variation of the guide field amplitude: COSINUS, LINEAR, PERMANENT, (values 0, 1, 2 resp.)"
      min: 0
      max: 2
      default: 0
      column: 0
      prefix: "-u"

  - chguidedch:
      type: "int"
      descr: "amplitude changing along axis"
      tooltip: "Direction of changing of the guide field amplitude: x-, y-, z-axis (values 0, 1, 2 resp.)"
      min: 0
      max: 2
      default: 0
      column: 1
      prefix: "-t"

  - Title_param:
      type: "title"
      default: "Addition options"

  - bfp:
      type: "file"
      plottable: false
      editable: true
      descr: "output file: polarisation"
      tooltip: "Name of the file for results: polarisation"
      default: "revp.dat"
      column: 0
      prefix: "-O"

  - bff:
      type: "file"
      plottable: false
      editable: true
      descr: "output file: magneticfield"
      tooltip: "Name of the file for results: magnetic field"
      default: "revm.dat"
      column: 0
      prefix: "-N"

  - outkey:
      type: "switch"
      descr: "output results"
      tooltip: "Output of intermediate simulation results in a file"
      default: false
      column: 0
      prefix: "-S"
