rotating_field:
   Name    : "Rot-Field"
   Depth   :    10.0          # -X  100.0   [cm]   x-component of the size of the homogeneous magnetic field 
   Width   :    10.0          # -Y  100.0   [cm]   y-component of the size of the homogeneous magnetic field 
   Height  :    10.0          # -V  100.0   [cm]   z-component of the size of the homogeneous magnetic field 
   PosX    :     5.0          # -k    0.0   [cm]   x-position of the centre of the magnetic field
   PosY    :     0.0          # -l    0.0   [cm]   y-position of the centre of the magnetic field
   PosZ    :     0.0          # -m    0.0   [cm]   z-position of the centre of the magnetic field
   OutX    :    10.0          # -p    0.0   [cm]   position of the new origin  (in the co-ordinate of the old origin)
   OutY    :     0.0          # -r    0.0   [cm]   position of the new origin  (in the co-ordinate of the old origin)
   OutZ    :     0.0          # -s    0.0   [cm]   position of the new origin  (in the co-ordinate of the old origin)
   AnglHor :     0.0          # -i    0.0  [deg]   horizontal rotation angle (about z axis) of the magnetic field
   nDomainX:    40            # -C    2     [-]    Number of domains in X axis direction 
   nDomainY:    20            # -D    2     [-]    Number of domains in Y axis direction 
   nDomainZ:    20            # -E    2     [-]    Number of domains in Z axis direction 
   AmplFile:                  # -t          [-]    file describing the amplitude distribution of the rotating magnetic field
   AmplFldR:  5000.0          # -d    0.0   [Oe]   amplitude of the rotating magnetic field
   ADevFldR:     0.0          # -a    0.0   [%]    deviation of the amplitude of rotating(os) magnetic field in %!
   FreqFldR:  3000.0          # -w    0.0   [Hz]   frequency of the rotating magnetic field (number of rotations per second)
   FDevFldR:     0.0          # -b    0.0   [%]    deviation for frequency of the rotating field in % 
   PhaseIni:     0.0          # -z    0.0  [deg]   initial phase
   eRotAxis:   X_AXIS         # -M  X_AXIS  [-]    direction about which the field rotates: X_AXIS, Y_AXIS, Z_AXIS
   eAmplDis:   UNIFORM        # -e UNIFORM  [-]    key: law of distribution of amplitude of rotating field: NORMAL_RND, UNIFORM_RND, NORMAL, UNIFORM, FROM_FILE
   eFreqDis:   UNIFORM        # -v UNIFORM  [-]    key: law of distribution of frequency of rotating field: NORMAL_RND, UNIFORM_RND, UNIFORM  
   bTofPhas:     YES          # -n  YES     [-]    flag: neutron TOF from preceding modules is used for the rotating field phase NO  YES
   FieldX  :     0.0          # -I    0.0   [Oe]   x-component of the permanent magnetic field
   FieldY  :     0.0          # -A    0.0   [Oe]   y-component of the permanent magnetic field
   FieldZ  :     0.0          # -K    0.0   [Oe]   z-component of the permanent magnetic field
   AmplFldR:     1.0          # -q    0.0   [Oe]   Amplitude of the additional random magnetic field  
   Waveleng:    12.0          # -W   20.0  [Ang]   Wavelength for calculation
   bPolOut :     NO           # -S  NO      [-]    flag: output polarisation components in the file during flight of domains    NO  YES
   bAutoClc:     NO           # -x  NO      [-]    flag: auto calculation of some parameters, default zero :NO,YES
   bBootStr:     NO           # -T  NO      [-]    flag: Use or do not use a bootstrap configuration
   PolFileO:                  # -O          [-]    output file for the polarization components  
   FldFileO:                  # -N          [-]    output file for the magnetic field 

