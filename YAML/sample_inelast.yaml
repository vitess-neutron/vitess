#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
sample_inelast:
  - Name    : 
      type:    "string" 
      descr:   "name" 
  - Title_param: 
      type:    "title" 
      default: "S(q,w):  main (P) and dispersion (D) parameters"
  - P1      :                 # -a    0.0 [ueV]   reference energy (: peak position for vanishing energy dispersion)
      type:    "float" 
      descr:   "P1 [microeV]"
      tooltip: "reference energy (peak position for vanishing energy dispersion)"
      default: 0.0
      column:  0                     
      prefix:  "-a"     
  - P2      :                 # -b    0.0 [ueV]   Lorentzian width (HWHM)
      type:    "float" 
      descr:   "P2 [microeV]"
      min:     0.0
      default: 0.0 
      tooltip: "Lorentzian width (HWHM)"
      column:  1                     
      prefix:  "-b"     
  - P3      :                 # -c    0.0  [-]    scaling factor (for both peaks)
      type:    "float" 
      descr:   "P3"
      min:     0.0001
      tooltip: "scaling factor (for both peaks)"
      default: 0.0 
      column:  2                     
      prefix:  "-c"     
  - P4      :                 # -d    0.0  [-]    intensity of the second peak relative to the first
      type:    "float" 
      descr:   "P4"
      tooltip: "intensity of the second peak relative to the first"
      column:  0                     
      prefix:  "-d"     
  - Temp    :                 # -T    0.0  [cm]   temperature of the sample
      type:    "float" 
      descr:   "temperature [K]"
      min:     0.0001
      tooltip: "temperature of the sample"
      column:  1                     
      prefix:  "-T"     
  - Repete  :                 # -A    1    [-]    repetitions (number of trajectories generated per incoming trajectory) 
      type:    "int" 
      descr:   "repetition" 
      min:     1
      tooltip: "repetitions (number of trajectories generated per incoming trajectory"
      column:  2                     
      prefix:  "-A"     
  - D1      :                 # -x    0.0  [cm]   linear energy dispersion coefficient of momentum component x
      type:    "float" 
      descr:   "D1 [microeV*A]"
      tooltip: "linear energy dispersion coefficient of momentum component x"
      column:  0                     
      prefix:  "-x"     
  - D2      :                 # -y    0.0 [deg]   linear energy dispersion coefficient of momentum component y
      type:    "float" 
      descr:   "D2 [microeV*A]"
      tooltip: "linear energy dispersion coefficient of momentum component y"
      column:  1                     
      prefix:  "-y"     
  - D3      :                 # -z    0.0 [deg]   linear energy dispersion coefficient of momentum component z
      type:    "float" 
      descr:   "D3 [microeV*A]"
      tooltip: "linear energy dispersion coefficient of momentum component z"
      column:  2                     
      prefix:  "-z"     
  - bBoseFac:                 # -D    NO  flag: multiplication with the Bose factor
      type:    "switch" 
      descr:   "Bose factor?" 
      tooltip: "flag   multiplication with the Bose factor"
      column:  0                     
      prefix:  "-D"     

  - Title_scattering: 
      type: "title" 
      default: "Scattering parameters" 
  - ScatLmbd:          	     	# 0.0 [Ang]   average wavelength Lmbd of the scattered neutrons
      type:    "float" 
      descr:   "lambda\nfinal[Ang]"
      tooltip: "average wavelength Lmbd of the scattered neutrons"
      default: 0.0
      prefix:  "-l"     
      column:  0                     

  - ScatHor:            	# 0.0 [deg]   horizontal rotation defining the main scattering direction
      type:    "float" 
      descr:   "angle horiz\nfinal [deg]"
      tooltip: "horizontal rotation defining the main scattering direction"
      default: 0.0
      prefix:  "-s"     
      column:  1                     

  - ScatVert:                  	# 0.0 [deg]   vertical rotation defining the main scattering direction
      type:    "float" 
      descr:   "angle vert\nfinal [deg]"
      tooltip: "vertical rotation defining the main scattering direction"
      default: 0.0
      prefix:  "-S"     
      column:  2                     

  - VarLmbd:                   # 0.0 [Ang]   wavelength variation DelLmbd of the scattered neutrons [Lmbd-DelLmbd/2, Lmbd+DelLmbd/2]
      type:    "float" 
      descr:   "delta lambda\nfinal [Ang]"
      tooltip: "wavelength variation DelLmbd of the scattered neutrons [Lmbd-DelLmbd/2, Lmbd+DelLmbd/2]"
      prefix:  "-L"     
      column:  0                     

  - VarHor:                   # 0.0 [deg]   variation DelTheta determining the hor. scat. range [Theta-DelTheta/2, Theta+DelTheta/2]
      type:    "float" 
      descr:   "delta angle\nhoriz [deg]"
      tooltip: "variation DelTheta determining the hor. scat. range\n[Theta-DelTheta/2, Theta+DelTheta/2]"
      prefix:  "-v"     
      column:  1                     
 
  - VarVert:                  # 0.0 [deg]   variation DelPhi determining the vert. scat. range [Phi-DelPhi/2, Phi+DelPhi/2]
      type:    "float" 
      descr:   "delta angle\nvert [deg]"
      tooltip: "variation DelPhi determining the vert. scat. range\n[Phi-DelPhi/2, Phi+DelPhi/2]"
      default: 0.0
      prefix:  "-V"     
      column:  2                     

  - MuScaTot:                   # 0.0 [1/cm]  user defined macroscopic total scattering cross section of the sample 
      type:    "float" 
      descr:   "scattering\ncoeff. [1/cm]"
      tooltip: "user defined macroscopic total scattering cross section of the sample"
      default: 0.0
      prefix:  "-m"     
      column:  0                     

  - MuAbs   :                   # 0.0 [1/cm]  user defined macroscopic absorption cross section of the sample 
      type:    "float" 
      descr:   "absorption\ncoeff. [1/cm/Ang]"
      tooltip: "user defined macroscopic absorption cross section of the sample"
      default: 0.0
      prefix:  "-M"     
      column:  1                     


  - Title_position: 
      type: "title" 
      default: "Position and direction of the sample" 

  -  SmplGeom:                   # enum sample geometry: CYLINDER  SPHERE  CUBOID  HOLLOW_CYLINDER
      type:    "combo" 
      descr:   "sample\ngeometry"
      tooltip: "sample geometry  CYLINDER  SPHERE  CUBOID  HOLLOW_CYLINDER RECTANGULAR"
      default: [cylinder, sphere, cuboid, hollow-cylinder, rectangular]
      prefix:  "-G"     
      column:  0 
                    
  - PosX:                   # 0.0  [cm]   center x position of the sample
      type:    "float" 
      descr:   "X [cm]"
      tooltip: "center x position of the sample"
      default: 0.0
      prefix:  "-X"     
      column:  0                     

  - PosY:                   # 0.0  [cm]   center y position of the sample 
      type:    "float" 
      descr:   "Y [cm]"
      tooltip: "center y position of the sample"
      default: 0.0
      prefix:  "-Y"     
      column:  1                     

  - PosZ:                   #  0.0  [cm]   center z position of the sample 
      type:    "float" 
      descr:   "Z [cm]"
      tooltip: "center z position of the sample"
      default: 0.0
      prefix:  "-Z"     
      column:  2  
                   
  - SmplHor:                   # 0.0  [deg]    horizontal rotation of the sample 
      type:    "float" 
      descr:   "horizontal\nangle [deg]"
      tooltip: "horizontal rotation of the sample"
      default: 0.0
      prefix:  "-r"     
      column:  0                     

  - SmplVert:                   # 0.0  [deg]    vertical rotation of the sample
      type:    "float" 
      descr:   "vertical\nangle [deg]"
      tooltip: "vertical rotation of the sample"
      default: 0.0
      prefix:  "-R"     
      column:  1                     

  - SizePar1:                   #  0.0  [cm]   thickness of cuboid or (outer) diameter of sphere or cylinder
      type:    "float" 
      descr:   "thickness or\ndiameter [cm]"
      tooltip: "thickness of cuboid or (outer) diameter of sphere or cylinder"
      default: 0.0
      prefix:  "-e"     
      column:  0                     

  - Height:                   #  0.0  [cm]   height of cuboid or cylinder
      type:    "float" 
      descr:   "height [cm]"
      tooltip: "height of cuboid or cylinder"
      default: 0.0
      prefix:  "-H"     
      column:  1                      

  -  Width:                   # 0.0  [cm]   width of cuboid or inner diameter of a hollow cylinder 
      type:    "float" 
      descr:   "inner diameter\nor width [cm]"
      tooltip: "width of cuboid or inner diameter of a hollow cylinder"
      default: 0.0
      prefix:  "-W"     
      column:  2                     

  - Title_frame: 
      type: "title" 
      default: "Output frame" 

  - bUser:                   #   NO   [-]    flag: user defined output frame
      type:    "switch" 
      descr:   "output frame\ndefinition"
      tooltip: "flag user defined output frame"
      prefix:  "-E"     
      column:  0                     

  - LmbdInit:                   #  6.0 [Ang]   initial wavelength
      type:    "float" 
      descr:   "lambda\ninitial [Ang]"
      tooltip: "initial wavelength"
      default: 6.0
      prefix:  "-I"     
      column:  0                     

  - DirInHor:                   # 0.0 [deg]   horizontal orientation of the incoming neutron 
      type:    "float" 
      descr:   "angle horiz\ninitial [deg]"
      tooltip: "horizontal orientation of the incoming neutron"
      default: 0.0
      prefix:  "-n"     
      column:  1                     

  - DirInVrt:                   # 0.0 [deg]   vertical orientation of the incoming neutron
      type:    "float" 
      descr:   "angle vert\ninitial [deg]"
      tooltip: "vertical orientation of the incoming neutron"
      default: 0.0
      prefix:  "-N"     
      column:  2                     

  - OutX:                   #  0.0  [cm]   x coordinate in output frame 
      type:    "float" 
      descr:   "X' [cm]"
      tooltip: "x coordinate in output frame"
      default: 0.0
      prefix:  "-u"     
      column:  0                     

  - OutY:                   # 0.0  [cm]   y coordinate in output frame 
      type:    "float" 
      descr:   "Y' [cm]"
      tooltip: "y coordinate in output frame"
      default: 0.0
      prefix:  "-U"     
      column:  1                     

  - OutZ:                   # 0.0  [cm]   z coordinate in output frame  
      type:    "float" 
      descr:   "Z' [cm]"
      tooltip: "z coordinate in output frame"
      default: 0.0
      prefix:  "-w"     
      column:  2                     

  - OutHor:                   #  0.0 [deg]   horizontal angular coordinate in output frame  
      type:    "float" 
      descr:   "horiz. angle\n[deg]"
      tooltip: "horizontal angular coordinate in output frame"
      default: 0.0
      prefix:  "-k"     
      column:  0                     

  - OutVert   :                   # 0.0  [deg]   vertical angular coordinate in output frame 
      type:    "float" 
      descr:   "vert. angle\n[deg]"
      tooltip: "vertical angular coordinate in output frame"
      default: 0.0
      prefix:  "-K"     
      column:  1                     

