#descr of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: descr of the parameter lable
# tooltip: detailed descr shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

guide_elliptic:
  - category:  "guide"
  - Title_Shape :
      type:    "title"
      default: "Shape and size of the guide"

  - keyshape_y:
      type: "int"
      descr: "horizontal shape"
      tooltip: "Shape of the guide in x-y-plane. Note that in constant case entrance and exit width must be the same! 0: constant, 1: linear, 2: elliptic"
      min: 0
      max: 2
      default: 0
      column: 0
      prefix: "-H"

  - keyshape_z:
      type: "int"
      descr: "vertical shape"
      tooltip: "Shape of the guide in x-z-plane. Note that in constant case entrance and exit width must be the same! 0: constant, 1: linear, 2: elliptic"
      min: 0
      max: 2
      default: 0
      column: 1
      prefix: "-V"

  - shape_file:
      type: "file"
      default: "guide_shape.dat"
      descr: "guide shape"
      plottable: true
      editable: true
      column: 0
      prefix: "-O"
      tooltip: "File containing ellipse parameters"

  - axis_long_hor:
      type: "float"
      descr: "Major ellipse axis in x-y plane [m]"
      tooltip: "Size of major ellipse axis in horizontal plane in m"
      column: 0
      prefix: "-a"
      default: 13
      min: 0

  - axis_short_hor:
      type: "float"
      descr: "Minor ellipse axis in x-y plane [m]"
      tooltip: "Size of minor ellipse axis in horizontal plane in m"
      column: 1
      prefix: "-b"
      default: 0.04
      min: 0

  - axis_long_ver:
      type: "float"
      default: 13
      descr: "Major ellipse axis in x-z plane [m]"
      tooltip: "Size of major ellipse axis in vertical plane in m"
      column: 0
      prefix: "-A"
      min: 0

  - axis_short_ver:
      type: "float"
      default: 0.04
      descr: "Minor ellipse axis in x-z plane [m]"
      tooltip: "Size of minor ellipse axis in vertical plane in m"
      column: 1
      prefix: "-B"
      min: 0

  - enter_width:
      type: "float"
      default: 6
      descr: "entrance width [cm]"
      tooltip: "Entrance of guide: width in cm (center of entrance window = origin)"
      column: 0
      prefix: "-w"
      min: 0

  - enter_height:
      type: "float"
      default: 10
      descr: "entrance height [cm]"
      tooltip: "Entrance of guide: height in cm (center of entrance window = origin)"
      column: 1
      prefix: "-u"
      min: 0

  - exit_width:
      type: "float"
      default: 6
      descr: "exit width [cm]"
      tooltip: "Exit of guide: width in cm (center of exit window = new origin)"
      column: 0
      prefix: "-W"
      min: 0

  - exit_height:
      type: "float"
      default: 10
      descr: "exit height [cm]"
      tooltip: "Exit of guide: height in cm (center of exit window = new origin)"
      column: 1
      prefix: "-U"
      min: 0

  - length_guide:
      type: "float"
      default: 25
      descr: "Guide length [m]"
      tooltip: "Length of guide in meters"
      column: 0
      prefix: "-l"
      min: 0

  - dist_focus_hor:
      type: "float"
      descr: "Distance from exit to focus in hor. plane [m]"
      tooltip: "Distance from guide exit to focal point of the ellipse in horizontal plane."
      column: 1
      prefix: "-d"
      min: 0

  - dist_focus_ver:
      type: "float"
      descr: "Distance from exit to focus in ver. plane [m]"
      tooltip: "Distance from guide exit to focal point of the ellipse in vertical plane."
      column: 2
      prefix: "-D"
      min: 0

  - addColor:
      type: "float"
      default: 0
      descr: "Add to color"
      tooltip: "Modify the color of a trajectory every time a reflection with guide walls occurs."
      column: 0
      prefix: "-C"

  - Title_Shape:
      type:    "title"
      default: "Guide_characteristics"

  - Title_Shape :
      type:    "title"
      default: "Reflectivity numbers"

  - mLeft:
      type:    "float"
      descr:   "left plane"
      tooltip: "Reflectivity of the left plane is calculated based on the\nm-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
      default: 0
      min:     0.0
      column:  0
      prefix:  "-e"

  - mRight:
      type:    "float"
      descr:   "right plane"
      tooltip: "Reflectivity of the right plane is calculated based on the\nm-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
      default: 0
      min:     0.0
      column:  1
      prefix:  "-E"

  - mTop:
      type:    "float"
      descr:   "top plane"
      tooltip: "Reflectivity of the top plane is calculated based on the\nm-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
      default: 0
      min:     0.0
      column:  0
      prefix:  "-f"

  - mBottom:
      type:    "float"
      descr:   "bottom plane"
      tooltip: "Reflectivity of the bottom plane is calculated based on the\nm-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
      default: 0
      min:     0.0
      column:  1
      prefix:  "-F"

  - Title_Shape:
      type:    "title"
      default: "Reflectivity files"

  - lrefl_filename:
      type: "file"
      descr: "left plane"
      tooltip: "Reflectivity file for left plane (where y > 0)"
      plottable: false
      editable: true
      default: "mirr1a.dat"
      format: "dat"
      column: 0
      prefix: "-i"

  - rrefl_filename:
      type: "file"
      descr: "right plane"
      tooltip: "Reflectivity file for right plane (where y < 0)"
      plottable: false
      editable: true
      default: "mirr1a.dat"
      column: 0
      prefix: "-I"
      format: "dat"

  - tbrefl_filename:
      type: "file"
      descr: "top plane"
      tooltip: "Reflectivity file for top plane"
      plottable: false
      editable: true
      default: "mirr1a.dat"
      column: 0
      prefix: "-j"
      format: "dat"

  - brefl_filename:
      type: "file"
      descr: "bottom plane"
      tooltip: "Reflectivity file for bottom plane"
      plottable: false
      editable: true
      default: "mirr1a.dat"
      column: 0
      prefix: "-J"
      format: "dat"
