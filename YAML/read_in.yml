read_in:
   Name    : 
   sInstFil:               #        --I  "instrument input file"       "Specifies the instrument file of the previous part of the simulation."
   sInpFil1: events.out    #         -A  "trajectory\ninput file 1"    "name of the trajectory input file 1"
   sInpFil2:               #         -B  "trajectory\ninput file 2"    "name of the trajectory input file 2"
   sInpFil3:               #         -D  "trajectory\ninput file 3"    "name of the trajectory input file 3"
   Weight1 :   1.0         # 0<=w<=1 -b  "weight\ninput file 1"        "Weight of the trajectories in input file 1: 1.0 if it is the only input file"
   Weight2 :               # 0<=w<=1 -a  "weight\ninput file 2"        "Weight of the trajectories in input file 2: assuming that all input files are written after a completed simulation, the sum of all weights must be 1 and each weight must be proportional to	the number of trajectories started"
   Weight3 :               # 0<=w<=1 -d  "weight\ninput file 3"        "Weight of the trajectories in input file 3: (see help text for 'Weight input file 2')"
   ePrgFmt : VT_VITESS_FMT #         -f  "data format"                 "format of the trajectory data to read: VT_VITESS_FMT: VITESS ASCII format   VT_MCSTAS_FMT: McStas   VT_MCPL_FMT: MCPL   VT_MCNP_FMT: MCNP   VT_VITESS_BIN: VITESS binary format"   // from 'in_out.h'
   iDetCol :               #         -C  "read in color"               "Only for VITESS format: Read only events with a given color. A negative number means any color."
   nRep    :               #  >=1    -R  "repetition"                  "Number of times the input is read"
   FactInt :               #  >=0    -I  "intensity factor\nfor MCNP"  "Factor to normalize to the source intensity from MCNP data"
   sTrcFile:               #         -T  "raytracing file"             "name of the file containing the trajectories to be traced or started"
   eTrcMode: NO_TRACING    #         -t  "kind of\nraytracing"         "NO_TRACING: no tracing   WRITE_TRC_FILES: write trace files for traj. of interest   ONLY_TRC_TRAJ: simulation only with traj. of interest" (see explanation in 'source.html')      // from 'general.h'
