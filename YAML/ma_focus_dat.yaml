#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

monochr_analyser:
  - category: "monochr_analyser"

  - option:
      type: int
      descr: "Type of crystal simulation"
      tooltip: "1: Crystal_flat, 2: Crystal_focus, 3: Crystal_focus_dat"
      hidden: true
      min: 1
      max: 3
      default: 3
      prefix: "-O"

  - Title_param:
      type: "title"
      default: "Monochromator Analyser"

  - parfile :
      type:    "file"
      descr:   "parameter file"
      default: "crys.par"
      plottable: false
      editable: false
      tooltip: "This files contains parameters describing a crystal element (CE)"
      prefix:  "-P"
      category: "crs"
      required: true

  - reprate:
      type: "int"
      descr: "repetition rate"
      tooltip: "If this integer > 1, the neutron is used multiple times for better statistics."
      default: 1
      column: 0
      prefix: "-A"
      min: 1
      max: 1000000

  - shoriz:
      type: "float"
      descr: "mosaic spread horiz. [deg]"
      tooltip: "Horizontal fwhm component of the 2-dimensional Gaussian mosaic distribution [deg]"
      default: 0.8
      column: 1
      prefix: "-m"
      min: 0

  - svert:
      type: "float"
      descr: "mosaic spread vert. [deg]"
      tooltip: "Vertical fwhm component of the 2-dimensional Gaussian mosaic distribution [deg]"
      default: 0.8
      column: 1
      prefix: "-M"
      min: 0

  - dspread:
      type: "float"
      descr: "d spread"
      tooltip: "Fwhm of the d-spacing distribution function divided by the lattice parameter under consideration. It is zero for a perfect crystal."
      default: 0.00005
      column: 2
      prefix: "-D"
      min: 0

  - refl:
      type: "float"
      descr: "peak reflectivity"
      tooltip: "(Experimentally determined) peak reflectivity of this monochromator."
      default: 1
      column: 0
      prefix: "-R"
      min: 1.0e-6

  - dist:
      type: "int"
      descr: "d-distribution"
      tooltip: "defines the d-spacing distribution function: 1: Lorentzian, 2: Gaussian"
      min: 1
      max: 2
      default: 1
      column: 0
      prefix: "-d"

  - focus_file :
      type:    "file"
      descr:   "focus file"
      default: "lamb_foc.dat"
      plottable: false
      editable: false
      tooltip: "External focus geometry file (must be provided to consider a crystal element-geometry which differs from the arrangement which can be automatically generated by using the module ma_focus)."
      prefix:  "-G"
