mon2_pos:                           
   sName   :                        
   sMonFile: "sample.pos" #     -O  "monitor file"              "Monitor output file containing intensity as a function of y- and z-position"
   
   WidthMin:  -5.0        #     -w  "min. y-value\n[cm]"        "left edge position of the monitored area"
   WidthMax:   5.0        #     -W  "max. y-value\n[cm]"        "right edge position of the monitored area"
   nBinsY  :  50          # >=1 -y  "number\nof y-bins"         "number of monitor channels in horizontal direction"
   HiteMin :  -5.0        #     -h  "min. z-value\n[cm]"        "bottom position of the monitored area"
   HiteMax :   5.0        #     -H  "max. z-value\n[cm]"        "top position of the monitored area"
   nBinsZ  :  50          # >=1 -z  "number\nof z-bins"         "number of monitor channels in vertical direction"
   bProbWt :   YES        #     -p  "probability\nweight"       "Display  : YES: Beam intensity   NO: number of trajectories"
   bExclude:   NO         #     -e  "exclusive\ncounts"         "Exclusion: YES: only neutrons meeting the monitor conditions are written   NO: all are written"
   eFormat :   MATRIX     #     -F  "file format"               "file format for output:  MATRIX: 2D matrix  XYZ: xyz  MATR_CMPT: 2D matrix compact  XYZ_CMPT xyz compact"
   FlmbdMin:              #     -l  "filter lambda\nmin [Ang]"  "minimal wavelength to be taken into account"
   FlmbdMax:              #     -L  "filter lambda\nmin [Ang]"  "maximal wavelength to be taken into account"
