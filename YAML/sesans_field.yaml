sesans_field:
  - category: "magnetic_field"

  - Title_param:
      type: "title"
      default: "Field range and strength"

  - sf_bf:
      type: "file"
      plottable: false
      editable: true
      descr: "field range file"
      tooltip: "Input file giving the range of the magnetic field"
      default: "field.dat"
      column: 0
      prefix: "-P"

  - sf_mx:
      type: "float"
      descr: "magnetic field X [Gs]"
      tooltip: "x component of the magnetic field in Gauss"
      default: 0
      column: 0
      prefix: "-F"

  - sf_my:
      type: "float"
      descr: "magnetic field Y [Gs]"
      tooltip: "y component of the magnetic field in Gauss"
      default: 0
      column: 1
      prefix: "-G"

  - sf_mz:
      type: "float"
      descr: "magnetic field Z [Gs]"
      tooltip: "z component of the magnetic field in Gauss"
      default: 100
      column: 2
      prefix: "-H"

  - Title_param:
      type: "title"
      default: "Output frame"

  - sf_ox:
      type: "float"
      descr: "output X [cm]"
      tooltip: "x position of the output frame (in the input frame)"
      default: 50
      column: 0
      prefix: "-q"

  - sf_oy:
      type: "float"
      descr: "output Y [cm]"
      tooltip: "y position of the output frame (in the input frame)"
      default: 0
      column: 1
      prefix: "-r"

  - sf_oz:
      type: "float"
      descr: "output Z [cm]"
      tooltip: "z position of the output frame (in the input frame)"
      default: 0
      column: 2
      prefix: "-s"
