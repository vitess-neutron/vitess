read_in:
   Name    : 
   sInpFil1: events.out    #         -A  "trajectory\noutput file"     "name of the trajectory output file"
   bActive : YES           #         -a  "Active?"                     "flag: YES: output file is written   NO: output file is not written
   ePrgFmt : VT_VITESS_ASC #         -f  "data format"                 "format of the trajectory data to be written: VT_VITESS_ASC: VITESS ASCII format   VT_MCSTAS_FMT: McStas   VT_MCPL_FMT: MCPL   VT_MCNP_FMT: MCNP   VT_VITESS_BIN: VITESS binary format"   // from 'in_out.h'
   iDetCol :               #         -C  "writeout color"              "Write only events with a given color. A negative number means any color."
   aParOut : "111111111"   #         -c  "Columns"                     "array containing 9 flags to determine which parameters are written: ID, trace, color, TOF, wavelength, intensity, position, direction, spin."  
   eDatFmt : VT_FLOAT      #         -F  "storage format"              "output format: VT_EXPONENTIAL: scientific format (5.12345E+00),   VT_FLOAT floating point (5.12345)  VT_BINARY: binary (needs about 25% less storage) // 'in_out.h'
   eSepFmt : VT_BLANK      #         -S  "separator"                   "separator between columns: VT_BLANK: space   VT_TABULATOR: tab            // in_out.h
   FactInt :               #  >=0    -I  "intensity factor\nfor MCNP"  "Factor to normalize to the source intensity from MCNP data"
   FlmbdMin:               #         -l  "lambda\nmin [Ang]"           "minimal wavelength to be taken into account"
   FlmbdMax:               #         -L  "lambda\nmin [Ang]"           "maximal wavelength to be taken into account"
   FwidtMin:               #         -u  "y-pos\nmin [cm]"             "minimal horizontal position to be taken into account"
   FwidtMax:               #         -U  "y-pos\nmax [cm]"             "maximal horizontal position to be taken into account"
   FhiteMin:               #         -v  "z-pos\nmin [cm]"             "minimal vertical position to be taken into account"
   FhiteMax:               #         -V  "z-pos\nmax [cm]"             "maximal vertical position to be taken into account"
