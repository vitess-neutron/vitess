mon2_div:
   sName   :
   sMonFile: "sample.div" #     -O  "monitor file"              "Monitor output file containing intensity as a function of y- and z-position
   
   DivYmin :  -5.0        #     -w  "min. y-value\n[deg]"       "minimal horizontal divergence to be monitored"
   DivYmax :   5.0        #     -W  "max. y-value\n[deg]"       "maximal horizontal divergence to be monitored"
   nBinsY  :  50          # >=1 -y  "number\nof y-bins"         "number of monitor channels in horizontal direction"
   DivZmin :  -5.0        #     -h  "min. z-value\n[deg]"       "minimal vertical divergence to be monitored"
   DivZmax :   5.0        #     -H  "max. z-value\n[deg]"       "maximal vertical divergence to be monitored"
   nBinsZ  :  50          # >=1 -z  "number\nof z-bins"         "number of monitor channels in vertical direction"
   bProbWt :   YES        #     -p  "probability\nweight"       "Display  : YES: Beam intensity   NO: number of trajectories"
   bExclude:   NO         #     -e  "exclusive\ncounts"         "Exclusion: YES: only neutrons meeting the monitor conditions are written   NO: all are written"
   eFormat :   MATRIX     #     -F  "file format"               "file format for output:  MATRIX: 2D matrix  XYZ: xyz  MATR_CMPT: 2D matrix compact  XYZ_CMPT xyz compact"
   FlmbdMin:              #     -l  "lambda\nmin [Ang]"         "minimal wavelength to be taken into account"
   FlmbdMax:              #     -L  "lambda\nmin [Ang]"         "maximal wavelength to be taken into account"
   FwidtMin:              #     -u  "y-pos\nmin [cm]"           "minimal horizontal position to be taken into account"
   FwidtMax:              #     -U  "y-pos\nmax [cm]"           "maximal horizontal position to be taken into account"
   FhiteMin:              #     -v  "z-pos\nmin [cm]"           "minimal vertical position to be taken into account"
   FhiteMax:              #     -V  "z-pos\nmax [cm]"           "maximal vertical position to be taken into account"
