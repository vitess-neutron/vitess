resonator_drabkin:
   Name    : "Resonator"
   Depth   :   10.0           # -X   10.0   [cm]   x-component of the size of the resonator 
   Width   :   10.0           # -Y   10.0   [cm]   y-component of the size of the resonator 
   Height  :   10.0           # -V   10.0   [cm]   z-component of the size of the resonator 
   PosX    :    5.0           # -k    0.0   [cm]   x-position of the centre of the resonator
   PosY    :    0.0           # -l    0.0   [cm]   y-position of the centre of the resonator
   PosZ    :    0.0           # -m    0.0   [cm]   z-position of the centre of the resonator
   OutX    :   10.0           # -p  200.0   [cm]   position of the new origin  (in the co-ordinate of the old origin)
   OutY    :    0.0           # -r    0.0   [cm]   position of the new origin  (in the co-ordinate of the old origin)
   OutZ    :    0.0           # -s    0.0   [cm]   position of the new origin  (in the co-ordinate of the old origin)
   nDomainX:   20             # -C    2     [-]    Number of domains in X axis direction 
   nDomainY:    2             # -D    2     [-]    Number of domains in Y axis direction 
   nDomainZ:    2             # -E    2     [-]    Number of domains in Z axis direction 

   AmplFldP:  500.0           # -d    0.0   [Oe]   amplitude of the periodic magnetic field
   eAxis   :   Y_AXIS         # -M  X_AXIS  [-]    key: axis to which the periodical magnetic field is parallel: X_AXIS, Y_AXIS, Z_AXIS
   eDisFldP:   GAUSS          # -v  UNIFORM [-]    key: function of the variation of the periodic field amplitude: UNIFORM, SINUS, GAUSS 
   eAmpFldP:   NORMAL         # -e  NORMAL  [-]    key: distribution of the periodic field amplitude: NORMAL, UNIFORM
   ADevFldP :   0.0           # -a    0.0   [%]    deviation of the amplitude of periodic magnetic field in %
   ASigFldP :   1.0           # -x    0.0   [Oe]   deviation in the gauss distribution of the amplitude of the periodic magnetic field

   FieldX  :  100.0           # -I    0.0   [Oe]   x-component of the permanent magnetic field
   FieldY  :    0.0           # -A    0.0   [Oe]   y-component of the permanent magnetic field
   FieldZ  :    0.0           # -K    0.0   [Oe]   z-component of the permanent magnetic field
   AmplFldR:    1.0           # -q    0.0   [Oe]   Amplitude of the additional random magnetic field  

   bPolOut :   NO             # -S  NO      [-]    flag: output polarisation components in the file during flight of domains:  NO  YES
   PolFileO:                  # -O          [-]    output file for the polarization components  
   FldFileO:                  # -N          [-]    output file for the magnetic field 
