#input fields so far:
#type:    title, file, string, float, int, switch (yes, no), combo (for selection list)
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label
#default: Value for title, values for selection list, optional default values
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
#prefix:  prefix for parameter in pipe

moderator_simple:
  - category: "moderator"
  - sModName :
      descr:   "name"
      type:    "string"
      column:  0                #0-2

  - eModShape :                   #   VtModShape ModShape_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "shape"
      tooltip: "moderator shape"
      enum:    "VtModShape"
      options: ["VT_MOD_SQUARE", "VT_MOD_CIRCLE"]
      default:  "VT_MOD_CIRCLE"
      column:  0
      prefix:  "-s"

  - ModDiam:                    #   [cm]   diameter of a cricular moderator
      type:    "float"
      descr:   "diameter [cm]"
      tooltip: "diameter of a cricular moderator"
      default: 2.0
      column:  0
      prefix:  "-r"
  - ModWidth:                   #   [cm]   width of a rectangular moderator
      type:    "float"
      descr:   "width [cm]"
      tooltip: "width of a rectangular moderator"
      column:  1
      prefix:  "-w"
  - ModHeight:                  #   [cm]   height of a rectangular moderator
      type:    "float"
      descr:   "height [cm]"
      tooltip: "height of a rectangular moderator"
      column:  2
      prefix:  "-h"

  - AvrgFlux:                   # [n/cm²/s] Time averaged flux of the moderated neutrons on moderator surface into 2*pi integrated over wavelength
      type:    "float"
      descr:   "total flux mod. [n/cm²/s]"
      tooltip: "Time averaged flux of the moderated neutrons on moderator surface into 2*pi integrated over wavelength"
      min:     0.0
      default: 1.0e+13
      column:  0
      prefix: "-F"
  - ModTemp    :                   #   [K]    temperature of a Maxwellian distribution
      type:    "float"
      descr:   "temperature [K]"
      tooltip: "Temperature of a Maxwellian distribution"
      min:      0.1
      default: 50.0
      column:  1
      prefix: "-T"

  - sLambdaFile:                   #   [-]    file containing the wavelength distribution function
      type:    "file"
      plottable: true
      descr:   "wavelength dist file"
      tooltip: "File containing the wavelength distribution function"
      prefix: "-W"
