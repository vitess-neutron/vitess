#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe

chopper_wnd:
  - WndPos :  
      type:    "float" 
      descr:   "window position [deg]"
      tooltip: "angular position of the window center" 
      default:   0.0
      min:    -360.0
      max:     360.0
      column:    0                     
      prefix:  "-p"     
  - WndHeight :    
      type:    "float" 
      descr:   "window height [cm]"
      tooltip: "window height from the edge of the chopper disk to the bottom of the window " 
      default: 10.0
      min:      0.0001
      column:   1                     
      prefix:  "-h"     
  - WndWidth:       
      type:    "float" 
      descr:   "window width [deg]"
      tooltip: "angular opening of the chopper window"
      default: 90.0
      min:      0.0001
      max:    360.0
      column:   2                     
      prefix:  "-w"     

  - LeftDev :  
      type:    "float" 
      descr:   "left side deviation [deg]"
      tooltip: "Angular deviation of the left window side (see graph in help manual) \na positive value indicates that the window widens" 
      default:   0.0
      min:     -90.0
      max:      90.0
      column:    0                     
      prefix:  "-l"     
  - RightDev:    
      type:    "float" 
      descr:   "right side deviation [deg]"
      tooltip: "Angular deviation of the right window side (see graph in help manual) \na positive value indicates that the window widens" 
      default: 0.0
      min:     -90.0
      max:      90.0
      column:  1                     
      prefix:  "-r"     
