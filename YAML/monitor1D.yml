monitor1D:
   # param.    default      col limit par     label                             help text         
   Name    :               #               "component"                 "name of the component""
   sMonFile:  "sample"     #          -O   "common name"               "common part of the output file names, up to 3 files possible with x-parameter A, B and C"
   eParA   :  NO_PAR       #          -X   "1st x-axis\nparameter"     "x-axis parameter for the first 1D monitor file " (see VtPar)
   eParB   :               #          -Y   "2nd x-axis\nparameter"     "x-axis parameter for the second 1D monitor file" 
   eParC   :               #          -Z   "3rd x-axis\nparameter"     "x-axis parameter for the third 1D monitor file "
   nBinParA:  100          #     >=1  -x   "number of bins\n1st par."  "number of x channels for the first 1D monitor file " 
   nBinParB:               #     >=1  -y   "number of bins\n2nd par."  "number of x channels for the second 1D monitor file" 
   nBinParC:               #     >=1  -z   "number of bins\n3rd par."  "number of x channels for the third 1D monitor file "
   MinParA :    0.0        #          -w   "min. x value\n1st par."    "minimal x value for the first 1D monitor file "
   MinParB :               #          -f   "min. x value\n2nd par."    "minimal x value for the second 1D monitor file"
   MinParC :               #          -g   "min. x value\n3rd par."    "minimal x value for the third 1D monitor file "
   MaxParA :   10.0        #          -W   "max. x value\n1st par."    "maximal x value for the first 1D monitor file "
   MaxParB :               #          -F   "max. x value\n2nd par."    "maximal x value for the second 1D monitor file"
   MaxParC :               #          -G   "max. x value\n3rd par."    "maximal x value for the third 1D monitor file "
   bProbWt :   YES         #          -p   "probability\nweight"       "Display  : YES: Beam intensity   NO: number of trajectories"
   bExclude:   NO          #          -e   "exclusive\ncounts"         "Exclusion: YES: only neutrons meeting the monitor conditions are written   NO: all are written"
                                           
   # filters                  
   LmbdMin :               #  1       -l   "lambda\nmin [Ang]"         "minimal wavelength to be taken into account [Ang]"
   LmbdMax :               #  2       -L   "lambda\nmax [Ang]"         "maximal wavelength to be taken into account [Ang]"
   eFilt1  :   NO_PAR      #  0       -I   "filter\nparameter 1"       "filter parameter 1"
   MinFilt1:               #  1       -u   "filter 1\nmin value"                "minimum value of filter parameter 1 to be taken into account"
   MaxFilt1:               #  2       -U   "filter 1\nmax value"                "minimum value of filter parameter 1 to be taken into account""
   FiltComb:   AND         #  0       -C   "filter\ncombination"       "filter 1 and 2 combined with AND or OR"
   eFilt2  :   NO_PAR      #  0       -J   "filter\nparameter 2"       "filter parameter 2"
   MinFilt2:               #  1       -v   "filter 2\nmin value"       "minimal value of filter parameter 1 to be taken into account"
   Maxfilt2:               #  2       -V   "filter 2\nmax value"       "maximal value of filter parameter 1 to be taken into account"
                                                                       
   # polarisation analysis    
   bPolAna :   NO          #  0       -P   "polarisation\nanalysis"    "YES: polarisation monitored   NO: intensity monitored"
   PolDirX :               #  1       -r   "direction X"               "x-component of the vector defining the quantization direction"
   PolDirY :               #  2       -s   "direction Y"               "y-component of the vector defining the quantization direction"
   PolDirZ :               #  3       -t   "direction Z"               "z-component of the vector defining the quantization direction"
                                               