monitor1D:
   # input parameters
   Name    :  "MonAtSample"   #                  name of the component
   MonFile :  "sample"        # -O "NoFile" [-]  common part of the output file names, up to 3 files possible with x-parameter A, B and C
   IdParA  :   WAVELENGTH     # -X  -1    [-]    parameter A to be shown on the x axis 
   nBinParA:  100             # -x   0    [-]    number of x bins 
   MinParA :    0.0           # -w  -1   [var]   minimum x value 
   MaxParA :   10.0           # -W  -1   [var]   maximum x value 
   IdParB  :   TIME           # -Y  -1    [-]    parameter B to be shown on the x axis 
   nBinParB:   50             # -y   0    [-]    number of x bins 
   MinParB :    0.0           # -f  -1   [var]   minimum x value 
   MaxParB :   50.0           # -F  -1   [var]   maximum x value 
   IdParC  :   -1             # -Z  -1    [-]    parameter C to be shown on the x axis 
   nBinParC:    0             # -z   0    [-]    number of x bins 
   MinParC :   -1             # -g  -1   [var]   minimum x value 
   MaxParC :   -1             # -G  -1   [var]   maximum x value 
   bProbWt :   YES            # -p  YES   [-]    use eigher actual probability of trajectories or 1 for all trajectories
   bExclude:   NO             # -e  NO    [-]    do not forward neutrons to the pipe that do not contribute to the monitor data
  
   # optional input parameters (filters and polarisation analysis)
   LmbdMin :   -1.0           # -l  -1.0 [Ang]   minimum wavelength, filter for the monitor
   LmbdMax :   -1.0           # -L  -1.0 [Ang]   maximum wavelength, filter for the monitor
   IdFilt1 :   COLOR          # -I  -1    [-]    filter parameter 1
   IdFilt2 :   COLOR          # -J  -1    [-]    filter parameter 2
   FiltComb:   OR             # -C  -1    [-]    filter 1 and 2 combined with AND or OR
   MinFilt1:    2             # -u  -1.0 [var]   minimum value of parameter 1, additional filter for the monitor
   MaxFilt1:    2             # -U  -1.0 [var]   minimum value of parameter 1, additional filter for the monitor
   MinFilt2:    4             # -v  -1.0 [var]   maximum value of parameter 2, additional filter for the monitor
   Maxfilt2:    4             # -V  -1.0 [var]   maximum value of parameter 2, additional filter for the monitor
  
   bPolAna :   YES            # -P  NO    [-]    switched on if polarisation analysis desired
   PolDirX :    1.0           # -r   0.0  [-]    x-component of the polarisation analysis vector
   PolDirY :    0.0           # -s   0.0  [-]    y-component polarisation analysis vector
   PolDirZ :    0.0           # -t   0.0  [-]    z-component polarisation analysis vector
