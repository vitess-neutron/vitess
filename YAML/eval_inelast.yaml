# description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
eval_inelast:                    # source module that will be executed 
  - category:  "evaluation"

  - Title_File: 
      type:    "title" 
      default: "Output files"
  - sFileTof:  
      type:    "file"
      plottable: true
      descr:   "TOF spectrum" 
      tooltip: "Filename for the TOF spectrum data file." 
      default: "tof_sp.dat"
      prefix:  "-E"   
  - sFileE:               
      type:    "file"
      plottable: true
      descr:   "energy spectrum" 
      tooltip: "Filename for the energy spectrum data file. " 
      default: "energy_sp.dat"
      prefix:  "-G"   

  - Title_Range: 
      type:    "title" 
      default: "Range and parameters"
  - eInstrGeom:    # VtInstGeom  InstGeom_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "geometry" 
      tooltip: "Defines geometry type of TOF instrument" 
      enum:    "VtInstGeom"
      options: ["direct geometry", "indirect geometry"]
      default: "direct geometry"
      column:  0                     
      prefix:  "-A"   
  - bPathCorrect:  
      type:    "switch" 
      descr:   "correct TOF to distance" 
      tooltip: "yes: correct TOF for the flight path from sample center to the position of the neutron detection\nno : use the sum of given primary and secondary flight path"
      column:   1                     
      default:  yes
      prefix:  "-t"   
 
  - FlightPath1:  
      type:    "float" 
      descr:   "primary flight path [cm]"  
      tooltip: "Length of the neutron flight path from moderator to sample"
      min:     0.0
      column:  0                     
      prefix:  "-a"  
  - FlightPath2:  
      type:    "float" 
      descr:   "secondary flight path [cm]"  
      tooltip: "Length of the neutron flight path from sample to detector"
      min:     0.0
      column:  1                     
      prefix:  "-b"  

  - LambdaRef :  
      type:    "float" 
      descr:   "reference wavelength [Ang]"  
      tooltip: "Initial or final wavelength of the neutrons which is known from the experimental setup."
      min:     0.0
      column:  0                     
      prefix:  "-c"  
  - TimeOffset:  
      type:    "float" 
      descr:   "time offset [ms]"  
      tooltip: "global shift of the neutron time t -> t - TimeOffset [ms]"
      column:  1                     
      prefix:  "-d"  

  - MinE    :   
      type:    "float" 
      descr:   "min. energy transfer [meV]" 
      tooltip: "Minimal energy transfer in which the user is interested to bin intensities" 
      default: -2.0
      column:  0                     
      prefix:  "-m"  
  - MaxE    : 
      type:    "float" 
      descr:   "max. energy transfer [meV]" 
      tooltip: "Maximal energy transfer in which the user is interested to bin intensities" 
      column:  1                     
      default: 2.0
      prefix:  "-M"   
  - nBins:            
      type:    "int" 
      descr:   "number of bins" 
      tooltip: "The number of time and energy channels to be considered. \nOnly one range needs to be given, the other range is calculated."
      default: 100
      min:     1
      column:  2                     
      prefix:  "-C"  

  - MinTime :     
      type:    "float" 
      descr:   "minimal time [ms]" 
      tooltip: "Minimal TOF, in which the user is interested to bin intensities"
      column:  0                     
      prefix:  "-e"  
  - MaxTime : 
      type:    "float" 
      descr:   "maximal time [ms]" 
      tooltip: "Maximal TOF, in which the user is interested to bin intensities"
      column:  1                     
      prefix:  "-g" 
  - TimeGrad:
      type:    "float" 
      descr:   "gradient of time bins" 
      tooltip: "Derivative s of the time channel width in function of TOF (as described in Help|Evaluation, section 'eval_inelast', 'Expressions for TOF binning')"
      column:  2                     
      prefix:  "-h" 

  - Title_Filter: 
      type:    "title" 
      default: "Filter selection"
  - AngleCntr:     
      type:    "float" 
      descr:   "angle center [deg]" 
      tooltip: "Center of the restricted horizontal range (relative to the X-axis) \ncf. Help|Evaluation, section 'eval_inelast'"
      column:  0                     
      prefix:  "-j"  
  - AngleRange: 
      type:    "float" 
      descr:   "angle range [deg]" 
      tooltip: "Restriction to horizontal angles [center - range, center + range] \ncf. Help|Evaluation, section 'eval_inelast'"
      column:  1                     
      prefix:  "-k" 
  - iColor:       
      type:    "int" 
      descr:   "color" 
      tooltip: "Excludes all neutrons with different color from evaluation.\n color=-1 means that all trajectories are regarded  "             
      min:     -1
      column:  2                     
      prefix:  "-f"   
