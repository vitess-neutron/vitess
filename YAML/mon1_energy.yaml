#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe

mon1_energy:
  - category:  "monitor"

  - sMonFile:                 # -O    [-]   monitor output file containing intensity as a function of the chosen parameter
      type:    "file"
      plottable: true
      descr:   "monitor file" 
      tooltip: "monitor output file containing intensity as a function of of the neutron energy [meV]" 
      default: "monitor.dat"
      prefix:  "-O"   
  - sRefFile:                 # -R    [-]   Reference input file containing data to normalize the monitor data
      type:    "file"
      plottable: false
      descr:   "reference file" 
      tooltip: "Reference input file containing data to normalize the monitored energy spectrum"
      prefix:  "-R"   

  - Title_Par: 
      type:    "title" 
      default: "Range"
  - eMonPar:                 # -k    [-]   VtMon1Par  Mon1Par_Txt2ID(const char* sText)
      type:    "combo" 
      hidden:  true
      descr:   "variable parameter" 
      tooltip: "parameter, as a function of which the intensity is shown"
      enum:    "VtMon1Par"
      options: ["lambda","time","div_y","div_z","pos_y","pos_z","energy"]
      default:  "energy"
      prefix:  "-k"   

  - MinE    :                 # -m   [var]  lower bound value of the monitored range
      type:    "float" 
      descr:   "min. energy [meV]" 
      tooltip: "lower bound value of the monitored energy range" 
      default: 0.0
      column:  0                     
      prefix:  "-m"  
  - MaxE    :                 # -M   [var]  upper bound value of the monitored range
      type:    "float" 
      descr:   "max. energy [meV]" 
      tooltip: "upper bound value of the monitored energy range" 
      column:  1                     
      default: 10.0
      prefix:  "-M"   
  - nBins:                    # -n    [-]   number of bins
      type:    "int" 
      descr:   "number of bins" 
      tooltip: "number of monitor channels"
      default: 100
      min:     1
      column:  2                     
      prefix:  "-n"  

  - Title_Opt: 
      type:    "title" 
      default: "Options"
  - iColor:                  # -C    [-]   index: for bAllFile=FALSE excludes all neutrons with diff. color from monitoring, if iColor >= 0 
      type:    "int"          #                    for bAllFile=TRUE  max. color to which additional monitor files are generated             
      tooltip: "bAllFile=FALSE excludes all neutrons with diff. color from monitoring, if iColor >= 0\nbAllFile=TRUE  max. color to which additional monitor files are generated"             
      descr:   "color" 
      min:     -1
      column:  0                     
      prefix:  "-C"   
  - bAllFile:                 # -c    [-]   flag: generates additional files for colour:0, 1, ..., iColor
      type:    "switch" 
      descr:   "all files" 
      tooltip: "yes:  generates additional files for colour:0, 1, ..., iColor"  
      default:  no
      column:   1                     
      prefix:  "-c"   

  - bProbWeight :                 # -p    [-]   flag: YES: Probability weight   NO: number of trajectories
      type:    "switch" 
      descr:   "probability weight" 
      tooltip: "yes: the beam intensity is monitored \nno : the number of trajectories is monitored"
      default:  yes
      column:  0                     
      prefix:  "-p"   
  - bExcl:                 # -e    [-]   flag: YES: only neutrons meeting the monitor conditions are written   NO: all are written
      type:    "switch" 
      descr:   "exclusive counts" 
      tooltip: "yes: only trajectories meeting the monitor conditions are written\nno : all are written"
      default:  no
      column:  1                     
      prefix:  "-e"   
  - eMonNorm:                 #    VtMonNorm MonNorm_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "normalization" 
      tooltip: "none: intensities of the neutron trajctories are distributed unchanged into channels\nbin size: intensities are normalized to the channel width\nreference file: intensities are divided by those in the reference file" 
      enum:    "VtMonNorm"
      options: ["none","bin size","reference file"]   
      default:  "none"
      column:  2                     
      prefix:  "-f"    

  - Title_Filter: 
      type:    "title" 
      default: "Filter selection"
  - FilterMinTime:                 # -t    [ms]  minimal TOF to be taken into account
      type:    "float" 
      descr:   "time interval begin [ms]" 
      tooltip: "minimal TOF to be taken into account"
      column:  0                     
      prefix:  "-t"  
  - FilterMinY:                 # -y    [cm]  minimal horizontal position to be taken into account
      type:    "float" 
      descr:   "filter y pos. min [cm]"  
      tooltip: "minimal horizontal position to be taken into account"
      column:  1                     
      prefix:  "-y"  
  - FilterMinZ:                 # -z    [cm]  minimal vertical position to be taken into account
      type:    "float" 
      descr:   "filter z pos. min [cm]" 
      tooltip: "minimal vertical position to be taken into account" 
      column:  2                     
      prefix:  "-z"   
  - FilterMaxTime :                 # -T    [ms]  maximal TOF to be taken into account
      type:    "float" 
      descr:   "time interval end [ms]" 
      tooltip: "maximal TOF to be taken into account"
      column:  0                     
      prefix:  "-T" 
  - FilterMaxY:                 # -Y    [cm]  maximal horizontal position to be taken into account
      type:    "float" 
      descr:   "filter y pos. max [cm]"  
      tooltip: "maximal horizontal position to be taken into account"
      column:  1                     
      prefix:  "-Y"  
  - FilterMaxZ:                 # -Z    [cm]  maximal vertical position to be taken into account
      type:    "float" 
      descr:   "filter z pos. max [cm]"  
      tooltip: "maximal vertical position to be taken into account"
      column:  3                     
      prefix:  "-Z"  

