# description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
eval_elast2:                    # source module that will be executed 
  - category:  "evaluation"

  - Title_File: 
      type:    "title" 
      default: "Evalation parameter and output file"
  - eEvalCombi:          # VtEvalComb EvalComb_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "evaluation parameter" 
      tooltip: "Parameter combination, as a function of which the intensity is shown" 
      enum:    "VtEvalComb"
      options:["Scattering angle [deg] and wavelength [A]", "Scattering angle [deg] and TOF [ms]"]
      default: "Scattering angle [deg] and wavelength [A]"
      column:   0                     
      prefix:  "-k"   
  - sEvalFile:  
      type:    "file"
      plottable: true
      descr:   "evaluation file" 
      tooltip: "Output file of the evaluation containing the intensity as a function of the chosen parameter" 
      default: "evaluation.dat"
      prefix:  "-o"   

  - Title_Range: 
      type:    "title" 
      default: "Ranges and parameters"
  - nBinsX:            
      type:    "int" 
      descr:   "number of bins in X" 
      tooltip: "number of evaluation channels on the x-axis (scattering angle)"
      default: 100
      min:     1
      column:  0                     
      prefix:  "-n"  
  - MinX    :   
      type:    "float" 
      descr:   "minimum X [deg]" 
      tooltip: "lower bound value of the evaluated x-range" 
      default: 0.0
      column:  1                     
      prefix:  "-x"  
  - MaxX    : 
      type:    "float" 
      descr:   "maximum X [deg]" 
      tooltip: "upper bound value of the evaluated x-range" 
      default: 10.0
      column:  2                     
      prefix:  "-X"   

  - LogPctX:   
      type:    "float" 
      descr:   "increase to next bin X [%]" 
      tooltip: "Percentage p of increase to the next bin of the x-axis\np = 0: linear binning\np > 0: logarithmic binning (number of bins ignored)" 
      default: 0.0
      column:  0                     
      prefix:  "-R"  
  - eSort   :          # VtEvalSort EvalSort_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "Sort by" 
      tooltip: "Sort order in the data file" 
      enum:    "VtEvalSort"
      options:["Nothing" "Scattering angle" "Scattering angle (reverse)" "Wavelength/TOF" "Wavelength/TOF (reverse)" "Intensity" "Intensity (reverse)" "Counts" "Counts (reverse)"]
      default: "Nothing"
      column:   0                     
      prefix:  "-s"   
  - bZero:   
      type:    "switch" 
      descr:   "Zeros" 
      tooltip: "yes: zero entries are written to disk \nno: zero entries are omitted"
      column:   1    
      default:  no
      prefix:  "-f"   

  - nBinsY:            
      type:    "int" 
      descr:   "number of bins in Y" 
      tooltip: "number of evaluation channels"
      default: 100
      min:     1
      column:  0                     
      prefix:  "-m"  
  - MinY    :   
      type:    "float" 
      descr:   "minimum Y [Ang] [ms]" 
      tooltip: "lower bound value of the evaluated y-range" 
      default: 0.0
      column:  1                     
      prefix:  "-y"  
  - MaxY    : 
      type:    "float" 
      descr:   "maximum Y [Ang] [ms]" 
      tooltip: "upper bound value of the evaluated y-range" 
      default: 10.0
      column:  2                     
      prefix:  "-Y"   
  - LogPctY:   
      type:    "float" 
      descr:   "increase to next bin Y [%]" 
      tooltip: "Percentage p of increase to the next bin of the y-axis\np = 0: linear binning\np > 0: logarithmic binning (number of bins ignored)" 
      default: 0.0
      column:  0                     
      prefix:  "-S"  

  - bProbWeight :        
      type:    "switch" 
      descr:   "probability weight" 
      tooltip: "yes: beam intensity is monitored \nno : number of trajectories is monitored" 
      default:  yes
      column:   0                     
      prefix:  "-p"   
  - bExcl:   
      type:    "switch" 
      descr:   "exclusive counts" 
      tooltip: "yes: only neutrons meeting the evaluation conditions are written \nno: all are written"
      default:  no
      column:   1                     
      prefix:  "-c"   
  - eScatAngle:    # VtAngleSel AngleSel_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "Scat. angle selection" 
      tooltip: "Defines the way how the scattering angle is determined" 
      enum:    "VtAngleSel"
      options:["direction", "position"]
      default: "direction"
      column:   2                     
      prefix:  "-D"   

  - Title_TOF: 
      type:    "title" 
      default: "TOF option"
  - bTof :   
      type:    "switch" 
      descr:   "time of flight" 
      tooltip: "yes: time of flight instrument \nno : instrument for continuous measurements" 
      default: no
      column:  0                     
      prefix:  "-w"   
  - bPathCorrect:  
      type:    "switch" 
      descr:   "correct TOF to distance" 
      tooltip: "yes: the distance from sample center to the position of the neutron detection is used to calculate the correct flight path \nno : the given 'filght path' is used"
      default:  yes
      column:   1                     
      prefix:  "-t"   

  - FlightPath:  
      type:    "float" 
      descr:   "flighta path [cm]"  
      tooltip: "Nominal length of the neutron flight path from origin to detector (for TOF option)"
      min:     0.0
      column:  0                     
      prefix:  "-l"  
  - DetDist:  
      type:    "float" 
      descr:   "sample-detector distance [cm]"  
      tooltip: "Nominal distance from sample to detector (for TOF option)"
      min:     0.0
      column:  1                     
      prefix:  "-L"  
  - TimeOffset:  
      type:    "float" 
      descr:   "time offset [ms]"  
      tooltip: "global shift of the neutron time (t - TimeOffset) [ms] (for TOF option)"
      column:  2                     
      prefix:  "-T"  

  - Title_Filter: 
      type:    "title" 
      default: "Filter selection"
  - DeadSpot: 
      type:    "float" 
      descr:   "dead spot [deg]" 
      tooltip: "excludes all neutrons with a scattering angle < DeadSpot" 
      column:  0                     
      prefix:  "-d"   
  - FilterTimeMin : 
      type:    "float" 
      descr:   "time interval begin [ms]" 
      tooltip: "minimal TOF to be taken into account for evaluation (used for TOF and continuous instruments)"
      column:  1                     
      prefix:  "-e"  
  - FilterTimeMax :  
      type:    "float" 
      descr:   "time interval end [ms]" 
      tooltip: "maximal TOF to be taken into account for evaluation (used for TOF and continuous instruments)"
      column:  1                     
      prefix:  "-E" 

  - iColor:       
      type:    "int" 
      descr:   "color" 
      tooltip: "Excludes all neutrons with different color from evaluation.\n color=-1 means that all trajectories are regarded  "             
      min:     -1
      column:  2                     
      prefix:  "-C"   
  - iColorMin:       
      type:    "int" 
      descr:   "color" 
      tooltip: "Excludes all neutrons with wrong wrong from evaluation.\n color=-1 means that all trajectories are regarded, otherwise color >= minColor is required"             
      min:     -1
      column:  2                     
      prefix:  "-a"   
  - iColorMax:       
      type:    "int" 
      descr:   "color" 
      tooltip: "Excludes all neutrons with wrong color from evaluation.\n color=-1 means that all trajectories are regarded, otherwise color <= minColor is required  "             
      min:     -1
      column:  2                     
      prefix:  "-A"   
