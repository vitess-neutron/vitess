#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
detector:
  - Title_bas: 
      type:    "title"
      default: "Basic detector properties" 
  - bArray:   
      type:    "switch" 
      descr:   "array item"  
      tooltip: "'no' (default): only detector or last detector in an array\n'yes'         : first or intermediate item of a detector array" 
      default: false
      column:  1                     
      prefix:  "-B"   

  - eDetGeom:     #   Function  VtDetGeom DetGeom_Txt2ID(const char* sText)  
      type:    "combo" 
      descr:   "geometry"  
      tooltip: "Geometry of the detector" 
      enum:    "VtDetGeom"
      options: ["flat","cylindrical"]   
      default:  "flat"
      column:  0                     
      prefix:  "-G"   
  - eDetType:     #   Function  VtDetType DetType_Txt2ID(const char* sText)  
      type:    "combo" 
      descr:   "Type"  
      tooltip: "Detector type: gas tubes (only when 'flat') or area/volume detector" 
      enum:    "VtDetType"
      options: ["tubes","area/volume"]   
      default:  "area/volume"
      column:  1                     
      prefix:  "-a"   
  - eDetUse:    #   Function  VtDetUse  DetUse_Txt2ID(const char* sText)  
      type:    "combo" 
      descr:   "usage"  
      tooltip: "'monitor only' leaves neutron position and weight unchanged\n'realistic' considers efficiency, cell size and resolution\n'grid off' only the efficiency (see also Help|Detector)" 
      enum:    "VtDetUse"
      options: ["realistic", "monitor only", "grid off"]   
      default:  "realistic"
      column:  2                     
      prefix:  "-U"   

  - Title_flt: 
      type:    "title"
      default: "Filter" 
  - nMinCol :
      type:    "int" 
      descr:   "min color"
      tooltip: "Minimal color necessary for the trajectory to be treated (-1 means all)"  
      min:     -1
      column:  0                     
      prefix:  "-q" 
  - nMaxCol : 
      type:    "int" 
      descr:   "max color"
      tooltip: "Maximal color necessary for the trajectory to be treated (-1 means all)"  
      min:     -1
      column:  1                     
      prefix:  "-Q" 
  - nAddCol :           
      type:    "int" 
      descr:   "add color"
      tooltip: "Add value to color after detection. A negative number means no change (see also Help|Detector)"  
      min:     -1
      column:  2                     
      prefix:  "-S" 

  - bKeepCol:           
      type:    "switch" 
      descr:   "keep wrong color"
      tooltip: "If activated, neutrons outside the colour selection will be passed on to the next module untouched. Otherwise, these neutrons are discarded (default). Only relevant if 'min color' and/or 'max color' is used"  
      default: false
      column:  0                     
      prefix:  "-d" 
  - nRepete:              
      type:    "int" 
      descr:   "repetition"
      min:     1
      default: 1 
      tooltip: "Number of trajectories generated per incoming trajectory"
      column:  1                     
      prefix:  "-A"     

  - Title_pos: 
      type:    "title"
      default: "Detector position and size" 
  - ScatVert:               
      type:    "float" 
      descr:   "phi [deg]"
      tooltip: "Angle between the y-axis and the projection of the vector to the detector center to the yz-plane [0,180] deg.\nFor cylindrical geometry phi must be 0 deg (left) or 180 deg (right)!"
      min:      0.0
      max:    360.0
      default:  0.0
      prefix:  "-P"     
      column:  0                     
  - ScatHor:        
      type:    "float" 
      descr:   "theta [deg]"
      tooltip: "Angle between the vector to the detector center and the +x-axis [0,180] deg."
      min:      0.0
      max:    180.0
      default: 0.0
      prefix:  "-T"     
      column:  1                     
  - Distance:          
      type:    "float"    
      descr:   "distance [cm]"
      tooltip: "Distance of the centre of the detector to the origin (0,0,0), i.e. the sample center\nIn case of a cylindrical detector this is the inner cylinder radius."
      min:     0.0001
      default: 100.0
      column:  2       
      prefix:  "-D"     

  - Height  :         
      type:    "float"    
      descr:   "height [cm]"
      tooltip: "Total height of the detector"
      default: 30.0
      min:      0.0
      column:   0       
      prefix:  "-h"     
  - Width:     
      type:    "float"    
      descr:   "width [cm]"
      tooltip: "Full width of a flat detector\nIn case of a cylindrical detector it is the length of the cylinder arch."
      default: 30.0
      min:      0.0
      column:  1       
      prefix:  "-w"     
  - Thikness:    
      type:    "float"    
      descr:   "thickness [cm]"
      tooltip: "Total thickness of the detecting material"
      default: 1.0
      min:     0.0
      column:  2       
      prefix:  "-t"     

  - Title_res: 
      type:    "title"
      default: "Cell size and resolution" 
  - nRows:  
      type:    "int" 
      descr:   "number of rows"
      tooltip: "Number of rows partitioning the detector height (hor. tubes or digitalization bins)."  
      default: 1
      min:     1
      column:  0                     
      prefix:  "-r" 
  - nCols:  
      type:    "int" 
      descr:   "number of columns"
      tooltip: "Number of columns partitioning the detector width (vert. tubes or digitalization bins)"  
      default: 1
      min:     1
      column:  1                     
      prefix:  "-c" 
  - nLayers:  
      type:    "int" 
      descr:   "number of columns"
      tooltip: "Number of layers partitioning the detector thickness (physical layers or digitalization bins in volume detector) (see also Help file)"  
      default: 1
      min:     1
      column:  2                     
      prefix:  "-n" 

  - HorRes  :         
      type:    "float"    
      descr:   "hor. resolution [cm]"
      tooltip: "Spatial resolution (FWHM) in horizontal direction"
      default: 0.0
      min:     0.0
      column:  0       
      prefix:  "-u"     
  - VertRes:     
      type:    "float"    
      descr:   "vert. resolution [cm]"
      tooltip: "spatial resolution (FWHM) in vertical direction"
      default: 0.0
      min:     0.0
      column:  1       
      prefix:  "-v"     
  - ResX:    
      type:    "float"    
      descr:   "resolution in x [cm]"
      tooltip: "spatial resolution (FWHM) in beam direction"
      default: 0.0
      min:     0.0
      column:  2       
      prefix:  "-l"     

  - Title_eff: 
      type:    "title"
      default: "Detector efficiency" 
  - EffFile :      
      type:    "file"    
      plottable: true
      descr:   "lambda efficiency"
      tooltip: "File containing two columns: wavelength and efficiency.\nIf an efficiency file is given, other efficiency data are ignored."
      prefix:  "-E"     
  - eDetMat:    # Function  VtDetAbs   DetAbs_Txt2ID(const char* sText) 
      type:    "combo" 
      descr:   "absorber material"  
      tooltip: "Material that interacts with neutrons and thus determines the (wavelength-dependent) detection efficiency." 
      enum:    "VtDetAbs"
      options: ["BF3 gas","3He gas","solid B10","solid Li6","other"] 
      default:  "3He gas"
      column:  0                     
      prefix:  "-m"   
  - Par1  :                             
      type:    "float" 
      descr:   "pressure [bar] or layer thickness [cm]" 
      tooltip: "He3, BF3: Pressure used to calculate particle density. If gas mixture is used, give value for absorber component.\nSolid B10 or Li6: layer thickness of converter material."
      default: 0.0
      min:     0.0
      column:  0                     
      prefix:  "-p"   
  - Par2  :                             
      type:    "float" 
      descr:   "gas temperature [K] or atomic density [1e27/m^3]" 
      tooltip: "He3, BF3: Temperature used to calculate particle density.\nSolid B10 or Li6: atomic density of the converter material."
      default: 0.0
      min:     0.0
      column:  1                     
      prefix:  "-k"   
  - EffMod  :                             
      type:    "float" 
      descr:   "efficiency modifyer" 
      tooltip: "The efficiency calculated from the interaction cross-section with the chosen material or taken from the efficiency file is multiplied by this factor. (See also help file.)"
      default: 1.0
      min:     0.0
      column:  2                     
      prefix:  "-e"   

  - Title_tub: 
      type:    "title"
      default: "Geometry details: Tube detector" 
  - eOrient:  # Function  VtOrient Orient_Txt2ID(const char* sText)     
      type:    "combo" 
      descr:   "tube orientation"  
      tooltip: "Orientation of tubes: horizontal means that the cylinder (or tube) axis is parallel to the y axis, vertical means parallel to the z axis. (See also help file.)" 
      enum:    "VtOrient"
      options: ["horizontal", "vertical"]   
      default:  "vertical"
      column:  0                     
      prefix:  "-o"   
  - eDetXsec:    # Function  VtTubeShape TubeShape_Txt2ID(const char* sText) 
      type:    "combo" 
      descr:   "tube cross-section"  
      tooltip: "Choose circular or rectangular cross-section for cylindrical or cubic detectors" 
      enum:    "VtTubeShape"
      options: ["circular", "rectangular"]   
      default:  "circular"
      column:  1                     
      prefix:  "-b"   
  - Thickn:                             
      type:    "float" 
      descr:   "wall thickness [cm]" 
      tooltip: "Thickness of tube walls\nWalls are treated as vacuum, i.e. no detection possible within the walls but also no unwanted scattering"
      default: 0.0
      min:     0.0
      column:  0                     
      prefix:  "-f"   
  - bShift:      
      type:    "switch" 
      descr:   "layers shifted"  
      tooltip: "flag: layers shifted against each other by half the diameter" 
      default: false
      column:  1                     
      prefix:  "-s"   

  - Title_flt: 
      type:    "title"
      default: "Geometry details: Flat detector" 
  - Phi_n:                             
      type:    "float" 
      descr:   "phi_n [deg]" 
      tooltip: "Inclined detector surface: phi_n [0,360] is the angle between the projection of the back surface normal onto (y',z') plane (analog to phi), (see also help file)"
      default: 0.0
      min:     0.0
      max:   360.0
      column:  0                     
      prefix:  "-V"   
  - Theta_n:                             
      type:    "float" 
      descr:   "theta_n [deg]" 
      tooltip: "Inclined detector surface: theta_n [0,180] deg is the angle between (the backside of) the detector surface normal and the position vector (see also help file)."
      default: 0.0
      min:     0.0
      max:    180.0
      column:  1                     
      prefix:  "-W"   

  - Title_cyl: 
      type:    "title"
      default: "Geometry details: Cylindrical detector" 
  - eAxis:             #   Function   VtAxis Axis_Txt2ID(const char* sText)       
      type:    "combo" 
      descr:   "axis orientation"  
      tooltip: "Orientation of the cylinder axis; it must be parallel to x, y or z axis" 
      enum:    "VtAxis"
      options: ["x", "y", "z"]   
      default:  "z"
      column:  0                     
      prefix:  "-x"   
  - bCnstPhi:      
      type:    "switch" 
      descr:   "const phi"  
      tooltip: "flag: Use constant phi pixel, i.e. pixel size in height dimension is determined by constant angular spread instead of constant spatial extension." 
      default: false
      column:  1                     
      prefix:  "-z"   
  - OutFile :   
      type:    "file"    
      plottable: false
      descr:   "output file"
      tooltip: "Detecor output in event mode (3D position, time, weight), written by last detector in array.\nIf left blank or the array box is ticked, no output file will be written." 
      prefix:  "-O"     

