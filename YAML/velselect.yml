velselect:
   # param.    default      col limit par     label                             help text         
   Name    : 
   Length  :    30.0       #  0   >0  -l  "length [cm]"                         "length of the velocity selector"
   Freq    :   500.0       #  1       -s  "rot.\nfrequency [Hz]"                "number of selector rotations per second"
   Twist   :    45.0       #  2       -c  "channel\ntwist [deg]"                "twist of the velocity selector channels"
