   Spacer  :     0.15      #  1  >=0  -d  "blade\nthickness [cm]"               "thickness of the blades dividing the channels"
   Radius  :    20.0       #  0   >0  -r  "radius [cm]"                         "radius of the velocity selector" 
   DistAxle:    15.0       #  1   >0  -o  "vert. distance\naxle - origin [cm]"  "vertical distance from the axle of the velocity selector to the origin, preferably: dist < radius - 0.5*height_beam\ni.e. the selector is supposed to be below the beamline"
