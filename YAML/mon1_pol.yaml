#input fields so far:
#type:    title, file, string, float, int, switch (yes, no), combo(for selection list),
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label 
#default: Value for title, values for selection list, optional default values
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe

mon1_pol: 
  - category:  "monitor"
 
  - sMonFile:             #     -O  "monitor file"              "Monitor output file containing polarisation as a function of the chosen parameter""
      type:    "file"
      plottable: true
      descr:   "monitor file" 
      tooltip: "monitor output file containing polarisation as a function of the chosen parameter"
      default: "pol.dat"
      prefix:  "-O"   
    
  - Title_Par: 
      type:    "title" 
      default: "Parameter and range"
  - eMonPar    :             #     -k     [-]   VtMon1Par  Mon1Par_Txt2ID(const char* sText)     
      type:    "combo" 
      descr:   "variable parameter" 
      tooltip: "ID for the parameter, as a function of which the intensity is shown" 
      enum:    "VtMon1Par"
      options: ["lambda","time","div_y","div_z","pos_y","pos_z"]
      default:  "lambda"
      column:  0
      prefix:  "-k"   
  -  iColor:                  # -C    [-]   index: for bAllFile=FALSE excludes all neutrons with diff. color from monitoring, if iColor >= 0 
      type:    "int" 
      tooltip: "excludes all neutrons with diff. color from monitoring, if iColor >= 0"             
      descr:   "color" 
      min:     -1
      column:  1
      prefix:  "-C"   

  - MinVal:             #     -m  "min. y-value [cm]"        "lower bound value of the monitored range"
      type:    "float" 
      descr:   "min. y-value [cm]" 
      tooltip: "lower bound value of the monitored range" 
      default: 0.0
      column:  0
      prefix:  "-m"  
  - MayValY    :             #     -M  "max. y-value [cm]"        "upper bound value of the monitored range"
      type:    "float" 
      descr:   "max. y-value [cm]" 
      tooltip: "upper bound value of the monitored range" 
      column:  1
      default: 10.0
      prefix:  "-M"   
  - nBins   :             # >=1 -n  "number of bins"           "number of monitor channels"
      type:    "int" 
      descr:   "number of bins" 
      tooltip: "number of monitor channels"
      default: 100
      min:     1
      column:  2
      prefix:  "-n"  

  - Title_Dir : 
      type:    "title" 
      default: "Analysis direction"
  - PolX    :             #     -a  "directon x"               "x-component of the quantization direction"
      type:    "float" 
      descr:   "directon x"
      tooltip: "x-component of the quantization direction" 
      default: 1.0
      column:  0
      prefix:  "-a"
  - PolY    :             #     -b  "directon y"               "y-component of the quantization direction" 
      type:    "float" 
      descr:   "directon y"  
      tooltip: "y-component of the quantization direction"  
      default: 0.0
      column:  1
      prefix:  "-b"
  - PolZ    :             #     -c  "directon z"               "z-component of the quantization direction"
      type:    "float" 
      descr:   "directon z"  
      tooltip: "z-component of the quantization direction" 
      default: 0.0 
      column:  2
      prefix:  "-c"

  - Title_Opt: 
      type:    "title" 
      default: "Options"
  - bProbWeight :             #     -p  "probability weight"       "YES: Probability weight   NO: number of trajectories
      type:    "switch" 
      descr:   "probability weight" 
      tooltip: "yes: the beam intensity is monitored \nno : the number of trajectories is monitored" 
      default:  yes
      column:  0
      prefix:  "-p"   
  - bExcl:             #     -e  "exclusive counts"         "YES: only neutrons meeting the monitor conditions are written   NO: all are written
      type:    "switch" 
      descr:   "exclusive counts" 
      tooltip: "yes: only trajectories meeting the monitor conditions are written\no : all are written"
      default:  no
      column:   1
      prefix:  "-e"
