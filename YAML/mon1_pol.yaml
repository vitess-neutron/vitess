#input fields so far:
#type:    title, file, string, float, int, combo(for selection list),switch (Set: Yes)
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label 
#default: Value for title, values for selection list, optional default values
#index:   indexlist for comboBox, if related values not in default order (0,1,2..)
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe

monitor1_pol:            # source module that will be executed
  - sName   :
      type:    "string"
      descr:   "name" 
 
  - sMonFile:             #     -O  "monitor file"              "Monitor output file containing polarisation as a function of the chosen parameter""
      type:    "file"
      descr:   "monitor file" 
      tooltip: "monitor output file containing polarisation as a function of the chosen parameter"
      default: "pol.dat"
      prefix:  "-O"   
    
  - ePar    :             #     -k     [-]   VtMon1Par  Mon1Par_Txt2ID(const char* sText)     
      type:    "combo" 
      descr:   "variable\nparameter" 
      tooltip: "ID for the parameter, as a function of which the intensity is shown" 
      enum:    "VtMon1Par"
      options: ["lambda","time","div_y","div_z","pos_y","pos_z"]
      default:  "lambda"
      column:  0
      prefix:  "-k"   
  -  iColour:                  # -C    [-]   index: for bAllFile=FALSE excludes all neutrons with diff. color from monitoring, if iColour >= 0 
      type:    "int" 
      tooltip: "excludes all neutrons with diff. color from monitoring, if iColour >= 0"             
      descr:   "color" 
      min:     -1
      column:  1
      prefix:  "-C"   

  - MinY    :             #     -m  "min. y-value\n[cm]"        "lower bound value of the monitored range"
      type:    "float" 
      descr:   "min. y-value\n[cm]" 
      tooltip: "lower bound value of the monitored range" 
      default: 0.0
      column:  0
      prefix:  "-m"  
  - MaxY    :             #     -M  "max. y-value\n[cm]"        "upper bound value of the monitored range"
      type:    "float" 
      descr:   "max. y-value\n[cm]" 
      tooltip: "upper bound value of the monitored range" 
      column:  1
      default: 10.0
      prefix:  "-M"   
  - nBins   :             # >=1 -n  "number\nof bins"           "number of monitor channels"
      type:    "int" 
      descr:   "number\nof bins" 
      tooltip: "number of monitor channels"
      default: 100
      min:     1
      column:  2
      prefix:  "-n"  

  - PolX    :             #     -a  "directon\nx"               "x-component of the quantization direction"
      type:    "float" 
      descr:   "directon\nx"
      tooltip: "x-component of the quantization direction" 
      default: 1.0
      column:  0
      prefix:  "-a"
  - PolY    :             #     -b  "directon\ny"               "y-component of the quantization direction" 
      type:    "float" 
      descr:   "directon\ny"  
      tooltip: "y-component of the quantization direction"  
      default: 0.0
      column:  1
      prefix:  "-b"
  - PolZ    :             #     -c  "directon\nz"               "z-component of the quantization direction"
      type:    "float" 
      descr:   "directon\nz"  
      tooltip: "z-component of the quantization direction" 
      default: 0.0 
      column:  2
      prefix:  "-c"

  - bProbWt :             #     -p  "probability\nweight"       "YES: Probability weight   NO: number of trajectories
      type:    "switch" 
      descr:   "probability\nweight" 
      tooltip: "Set:        Probability weight\nNot set:  number of trajectories" 
      default: "YES"
      column:  0
      prefix:  "-p"   
  - bExclude:             #     -e  "exclusive\ncounts"         "YES: only neutrons meeting the monitor conditions are written   NO: all are written
      type:    "switch" 
      descr:   "exclusive\ncounts" 
      tooltip: "YES: only neutrons meeting the monitor conditions are written\NO:  all are written"
      column:  1
      prefix:  "-e"
