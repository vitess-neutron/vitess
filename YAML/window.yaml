#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

window:
  - category:  "spacewindow"
  - Title_Geom:
      type:    "title"
      default: "Geometry"
  - Distance:                 # -l    0.0  [cm]  Distance from origin to the window (along the x-axis)
      type:    "float"
      descr:   "distance to window [cm]"
      tooltip: "distance from origin to the center of the window (along the x-axis)"
      default: 0.0
      min:     0.0
      column:  0
      prefix:  "-l"
  - eShape:                   # -R               VtShape  Shape_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "window shape"
      tooltip: "shape of the aperture"
      enum:    "VtShape"
      options: ["VT_SQUARE", "VT_CIRCLE"]
      default:  "VT_SQUARE"
      column:  1
      prefix:  "-R"

  - Title_Cir:
      type:    "title"
      default: "Circular window coordinates"
  - Radius  :                 # -r    0.0  [cm]  radius of circular window
      type:    "float"
      descr:   "radius"
      tooltip: "radius of circular window"
      min:     0.0
      column:  0
      prefix:  "-r"
  - CntrY   :                 # -y    0.0  [cm]  y coordinate: center of window
      type:    "float"
      descr:   "center y"
      tooltip: "y coordinate: center of window"
      default: 0.0
      column:  1
      prefix:  "-y"
  - CntrZ   :                 # -z    0.0  [cm]  z coordinate: center of window
      type:    "float"
      descr:   "center z"
      tooltip: "z coordinate: center of window"
      default: 0.0
      column:  2
      prefix:  "-z"

  - Title_Rect :
      type:    "title"
      default: "Rectangular window coordinates"
  - MinY:                     # -w    0.0  [cm]  y-coordinate: lower frame value of rectangular window
      type:    "float"
      descr:   "min. y [cm]"
      tooltip: "y-coordinate: lower bound of a rectangular window (on the right side)"
      column:  0
      prefix:  "-w"
  - MaxY:                     # -W    0.0  [cm]  y-coordinate: higher frame value of rectangular window
      type:    "float"
      descr:   "max. y [cm]"
      tooltip: "y-coordinate: Upper bound of a rectangular window (on the left side)"
      column:  1
      prefix:  "-W"
  - MinZ:                     # -h    0.0  [cm]  z-coordinate: bottom of rectangular window
      type:    "float"
      descr:   "min. z [cm]"
      tooltip: "z-coordinate: bottom of a rectangular window"
      column:  0
      prefix:  "-h"
  - MaxZ:                     # -H    0.0  [cm]  z-coordinate: top of rectangular window
      type:    "float"
      descr:   "max. z [cm]"
      tooltip: "z-coordinate: top of a rectangular window"
      column:  1
      prefix:  "-H"
  - RotAngle:                 # -A    0.0  [deg] Rotation angle
      type:    "float"
      descr:   "rot. angle [deg]"
      tooltip: "Rotation angle of the rectangular window (see Help file for details)"
      column:  2
      prefix:  "-A"

  - Title_Opt :
      type:    "title"
      default: "Options"
  - bBeamstop:                # -S         [-]   Flag: beamstop              yes: beamstop   no: normal window
      type:    "switch"
      descr:   "used as beamstop"
      tooltip: "yes: negative window: absorption inside and transmission outside \nno : normal window:   transmission inside and absorption outside (default)"
      default:  no
      column:   0
      prefix:  "-S"
  - bOldFrame:                # -F         [-]   Flag: use previous frame    yes: frame unchanged   no: shift as usual
      type:    "switch"
      descr:   "used previous frame"
      tooltip: "yes: the co-ordinate system of the previous module is kept\nno : the co-ordinate system is shifted to the window exit as usual (default)"
      default:  no
      column:   1
      prefix:  "-F"

  - Title_Out :
      type:    "title"
      default: "Outer Material"
  - eMatOut:                  # -c IDEAL_ABS     VtWndAbs   WndAbs_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "frame material"
      tooltip: "Material used for the absorbing window frame"
      enum:    "VtWndAbs"
      options: ["VT_WABS_FILE", "VT_WABS_GD", "VT_WABS_CD", "VT_WABS_B10", "VT_WABS_EU", "VT_WABS_SI", "VT_WABS_IDEAL"]
      default:  "VT_WABS_IDEAL"
      column:  1
      prefix:  "-c"
  - ThicknOut:                # -t    0.0  [cm]  thickness of the frame material
      type:    "float"
      descr:   "thickness of frame [cm]"
      tooltip: "Thickness of the material used for the absorbing window frame"
      min:     0.0
      column:  0
      prefix:  "-t"
  - sFileOut :                # -C   NULL   [-]  file describing the transmission of the window frame material
      type: "file"
      plottable: true
      editable: true
      descr:   "transmission file"
      tooltip: "File containing the wavelength dependent attenuation inside the window frame (see Help file for details)"
      prefix:  "-C"

  - Title_In :
      type:    "title"
      default: "Inner Material"
  - ThicknIn:                 # -T    0.0  [cm]  thickness of the pane material
      type:    "float"
      descr:   "thickness of window [cm]"
      tooltip: "Thickness of the material used for the window pane"
      min:     0.0
      column:  0
      prefix:  "-T"
  - sFileIn  :                # -m   NULL   [-]  file describing the transmission of the material in the open part of window
      type: "file"
      plottable: true
      editable: true
      descr:   "transmission  file"
      tooltip: "File containing the wavelength dependent attenuation inside the window pane (see Help file for details)"
      prefix:  "-m"

