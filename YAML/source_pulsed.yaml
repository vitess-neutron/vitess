#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

source:
  - category:  "source"
  - eSrcKind:                          # -K   VtSrcKind SrcKind_Txt2ID(const char* sText)    SRC_SIMPLE  SRC_CWS  SRC_PULSED  SRC_ISIS  SRC_ESS
      type:    combo                   # This shall not be selected, but defined by the chosen module
      hidden:  true
      descr:   "kind of source"
      enum:    "VtSrcKind"
      options: ["SRC_SIMPLE", "SRC_CWS", "SRC_PULSED", "SRC_ISIS", "SRC_ESS"]
      default: "SRC_PULSED"
      prefix:  "-K"

  - Titel_Sim:
      type:    "title"
      default: "Simulation parameters"
  - nBunches :                          # -n   10 [-]   number of bundles
      type:    "int"
      descr :  "number of bundels"
      tooltip: "number of packages into which the whole simulation is separated"
      default: 5
      column:  0
      prefix:  "-l"
  - nTraj   :                          # -n   1.0e6 [-]   number of neutron trajectories (events)
      type:    "float"
      descr :  "number of traj. per bundle"
      tooltip: "number of neutron trajectories (events) created in each bundle"
      default: 1000000
      column:  1
      prefix:  "-n"
  - sSimName :
      type:    "string"
      descr:   "simulation name"
      tooltip: "name or ID of the simulation given by the user (only for indexing)"
      default: ""
      column:  2
      prefix:  "-I"

  - MinLambda    :                          # -m        [Ang]  minimum of the wavelength range
      type:    "float"
      descr:   "min. wavelength [Ang]"
      tooltip: "minimum of the wavelength range"
      min    : 0.0
      default: 1.0
      column:  0
      prefix:  "-m"
  - MinTime    :                          # -t        [ms]   minimum of the time frame to start neutrons
      type:    "float"
      descr:   "min. time [ms]"
      tooltip: "minimum of the time frame to start neutrons"
      min    : 0.0
      default: 0.0
      column:  1
      prefix:  "-t"
  - MaxLambda    :                          # -M        [Ang]  maximum of the wavelength range
      type:    "float"
      descr:   "max. wavelength [Ang]"
      tooltip: "maximum of the wavelength range"
      default: 5.0
      column:  0
      prefix:  "-M"
  - MaxTime    :                          # -T        [ms]   maximum of the time frame to start neutrons
      type:    "float"
      descr:   "max. time [ms]"
      tooltip: "maximum of the time frame to start neutrons"
      default: 2.0
      column:  1
      prefix:  "-T"

  - Titel_Mod :
      type:    "title"
      default: "Source and moderator parameters"
  - eSrcName :                          # -N   VtSrcName SrcName_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "source name"
      tooltip: "name of the source, (needed for analytical calculations of source characteristics)"
      enum:    "VtSrcName"
      options: ["ANYSOURCE", "HBS", "CSNS", "IPNS"]
      default:  "ANYSOURCE"
      column:   0
      prefix:  "-N"
  - eSrcType:                          # -S    VtSrcType SrcType_Txt2ID(const char* sText)      CWS SPSS LPSS
      type:    combo
      descr:   "source type"
      tooltip: "parameter describing the time dependence of the proton beam: continuous (CWS), short pulses (SPSS) or long pulses (LPSS)"
      enum:    "VtSrcType"
      options: ["NO_TYPE", "LPSS", "SPSS"]
      default:  "NO_TYPE"
      column:   1
      prefix:  "-S"
  - ModDecl:                          # -i   0.0  [deg]  declination between moderator surface normal and propagation window
      type:    "float"
      descr:   "declination [deg]"
      tooltip: "declination between moderator surface normal and propagation window"
      default: 0.0
      column:  2
      prefix:  "-i"
  - Freq    :                          # -R        [Hz]   pulse frequency
      type:    "float"
      descr:   "frequency [Hz]"
      tooltip: "pulse repetition rate"
      default: 50
      column:  0
      prefix:  "-R"
  - PulseLen:                          # -p   1.0  [ms]   proton pulse length
      type:    "float"
      descr:   "proton pulse length [ms]"
      tooltip: "proton pulse length"
      default: 1.0
      column:  1
      prefix:  "-p"
  - SrcPower   :                          # -L   2.0  [MW]   average source power
      type:    "float"
      descr:   "source power [MW]"
      tooltip: "time average power if th proton beam (used to scale the flux for some sources)"
      default: 0.1
      column:  2
      prefix:  "-L"

  - wModWnd:
      type:    "window"
      descr:   "moderator window 1"
      tooltip: "parameters describing geometry and characteristics of a moderator are given on a separate window"
      max:    10
      column:  0
      filename: "moderator_pulsed.yaml"
  - sModFile :                          # -r         [-]   name of the file containing the IDs for tracing
      type:    "file"
      plottable: false
      descr:   "moderator file"
      tooltip: "name of the file containing the parameters of all moderators\nThis old way of reading the moderator parameters is kept for compatibility reasons. They are only used if they are not given as direct input parameters.\nThey will be saved in the instrument file (in yaml format)"
      prefix:  "-a"

  - Titel_Prop :
      type:    "title"
      default: "Flight direction and propagation"
  - eDirMode :                          # -d  VtDirect Direct_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "direction defined"
      tooltip: "mode to determine neutron directions\n'by virtual window' means that the window is the target, but the neutrons stay at the source position, otherwise neutrons are propageted to the window"
      enum:    "VtDirect"
      options: ["VT_DIVERGENCE", "VT_REAL_WND", "VT_VIRT_WND"]
      default: "VT_REAL_WND"
      column:   0
      prefix:  "-d"

  - MinDivY:                          # -b        [deg]  minimum horizontal divergence (absolute value)
      type:    "float"
      descr:   "min. divergence x <-> y [deg]"
      tooltip: "minimum horizontal divergence (absolute value)"
      column:  0
      prefix:  "-b"
  - MinDivZ:                          # -c        [deg]  minimum vertical divergence (absolute value)
      type:    "float"
      descr:   "min. divergence x <-> z [deg]"
      tooltip: "minimum vertical divergence (absolute value)"
      column:  1
      prefix:  "-c"
  - MaxDivY:                          # -y        [deg]  maximum horizontal divergence (half of angular spread x-z-plane, if min. value is zero)
      type:    "float"
      descr:   "max. divergence x <-> y [deg]"
      tooltip: "maximum horizontal divergence (absolute value)"
      column:  0
      prefix:  "-y"
  - MaxDivZ:                          # -z        [deg]  maximum vertical divergence (half of angular spread x-z-plane, if min. value is zero)
      type:    "float"
      descr:   "max. divergence x <-> z [deg]"
      tooltip: "maximum vertical divergence (absolute value)"
      column:  1
      prefix:  "-z"

  - TargetDist   :                          # -D 100.0  [cm]   distance moderator - target window
      type:    "float"
      descr:   "distance to window [cm]"
      tooltip: "distance moderator - target window"
      min    :   0.0
      default: 100.0
      column:  0
      prefix:  "-D"
  - TargetWidth  :                          # -w   3.0  [cm]   width of the target window
      type:    "float"
      descr:   "window width [cm]"
      tooltip: "width of the target window"
      min    : 0.0
      default: 3.0
      column:  1
      prefix:  "-w"
  - TargetHeight :                          # -h   3.0  [cm]   height of the target window
      type:    "float"
      descr:   "window height [cm]"
      tooltip: "height of the target window"
      min    : 0.0
      default: 3.0
      column:  2
      prefix:  "-h"

  - Titel_Time:
      type:    "title"
      default: "Time window"
  - TofDist :                          # -s        [cm]   distance moderator - position of time window
      type:    "float"
      descr:   "distance to time window [cm]"
      tooltip: "distance moderator - position of time window"
      column:  0
      prefix:  "-s"
  - TofMin  :                          # -f        [cm]   min TOF allowed in time window
      type:    "float"
      descr:   "min. TOF to time window [ms]"
      tooltip: "min TOF allowed in time window"
      column:  1
      prefix:  "-f"
  - TofMax  :                          # -F        [cm]   max TOF allowed in time window
      type:    "float"
      descr:   "max. TOF to time window [ms]"
      tooltip: "max TOF allowed in time window"
      column:  2
      prefix:  "-F"

  - Titel_Pol:
      type:    "title"
      default: "Polarization"
  - PolDirX :                          # -X        [cm]   x-component of the polarisation
      type:    "float"
      descr:   "polarisation direction X"
      tooltip: "x-component of the polarisation"
      column:  0
      prefix:  "-X"
  - PolDirY :                          # -Y        [cm]   y-component of the polarisation
      descr:   "Y"
      type:    "float"
      tooltip: "y-component of the polarisation"
      column:  1
      prefix:  "-Y"
  - PolDirZ :                          # -V        [cm]   z-component of the polarisation
      type:    "float"
      descr:   "Z"
      tooltip: "z-component of the polarisation"
      column:  2
      prefix:  "-V"
  - PolDeg  :                          # -P        [cm]   degree of polarization [%]
      type:    "float"
      descr:   "degree of polarization [%]"
      tooltip: "degree of polarization [%]"
      column:  0
      prefix:  "-P"

  - Titel_Special:
      type:    "title"
      default: "Special simulation parameters"
  - TimeMeas:                          # -A         [s]   time of measurement in second
      type:    "float"
      descr:   "time of measurement [s]"
      tooltip: "time of measurement in second (used for detector counts)"
      column:  0
      prefix:  "-A"
  - LambdaWant:                          # -W        [Ang]  desired wavelength
      type:    "float"
      descr:   "desired wavelength [Ang]"
      tooltip: "desired wavelength (can be used for chopper phasing)"
      column:  1
      prefix:  "-W"
  - eTraceMode:                          # -k   VtTrace Trace_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "kind of raytracing"
      tooltip: "write trace files: writes a file for each trajectries of interest\nonly trace trajectories: simulation only started for trajectories of interest"
      enum:    "VtTrace"
      options: ["NO_TRACING", "WRITE_TRC_FILES", "ONLY_TRC_TRAJ"]
      default:  "NO_TRACING"
      column:  0
      prefix:  "-k"
  - sTraceFile :                          # -r         [-]   name of the file containing the IDs for tracing
      type:    "file"
      plottable: false
      descr:   "raytracing file"
      tooltip: "name of the file containing the IDs for tracing"
      prefix:  "-r"

