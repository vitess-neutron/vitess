#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
mon_brilliance:           # source module that will be executed
  - sName:
      type:    "string" 
      descr:   "name"

  - sMonFile:              #     -O  "monitor file"
      type:    "file" 
      descr:   "monitor file"
      tooltip: "Monitor output file containing brilliance or brilliance transfer as a function of the chosen parameter"
      default: "Sample.brl" 
      prefix:  "-O"  

  - sRefFile:              #     -S  "reference file"
      type:    "file" 
      descr:   "reference file" 
      tooltip: "Brilliance file used as reference (it is used to calculate the brilliance transfer)"
      prefix:  "-S"  

  - sFlxFile:              #     -F  "flux file"
      type:    "file" 
      descr:   "flux file"  
      tooltip: "This file is used to monitor the average and max. brilliance as a function of the given parameter set.\n1 line is written in each simulation"
      prefix:  "-F"  
 
  - eBrlPar:                  #     -k  "variable\nparameter"      VtBrlPar  BrlPar_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "variable\nparameter"
      tooltip: "ID for the parameter, as a function of which the brilliance is shown"
      default: ["time","lambda","energy","pos_y","pos_z","pos_rad","div_y","div_z","div_rad"]
      column:  0            
      prefix:  "-k"

  - eBrlNorm:                  #     -N  "norm. type"     VtBrlNorm BrlNorm_Txt2ID(const char* sText)            
      type:    "combo" 
      descr:   "norm. type"
      tooltip: "absolute   absolute brilliance [n/(cm²s sr Ang)]\n
                transfer   relative brilliance (= brilliance transfer)\n
                1% lambda  brilliance within 1% DelLamdba/Lambda [n/(cm²s sr)]"
      default: ["absolute","transfer","1% lambda"]
      column:  1            
      prefix:  "-N"

  - bLogBin:                #     -B  "logarithmic\nbinning"
      type:    "switch" 
      descr:   "logarithmic\nbinning" 
      tooltip: "YES: bin size increases exponentially   NO: linear binning"
      default: [NO,YES]
      column:  0            
      prefix:  "-B" 
  - bExclude:              #     -e  "exclusive\ncounts"
      type:    "switch" 
      descr:   "exclusive\ncounts" 
      tooltip: "YES: only neutrons meeting the monitor conditions are written\nNO : all are written"
      default: [NO,YES]
      column:  1                     
      prefix:  "-e"   
 
  - nBins:                 # >=1 -n  "number\nof bins"           "number of monitor channels"
      type:    "int" 
      descr:   "number\nof bins" 
      tooltip: "number of monitor channels"
      default: 100
      min:     1
      column:  0            
      prefix:  "-n"
  - iColour:               #     -C  "color"                     
      type:    "int" 
      descr:   "color" 
      tooltip: "color of the trajectories condidered by the monitor   (default  ALL)"
      min:     -1
      column:  1            
      prefix:  "-C"
   
  - TimeMin:               #     -t  "min. time [ms]"
      type:    "float" 
      descr:   "min. time [ms]" 
      tooltip: "minimal time-of-flight to be taken into account"
      column:  0               
      prefix:  "-t"

  - TimeMax:               #     -T  "min. time [ms]"
      type:    "float" 
      descr:   "max. time [ms]"
      tooltip: "maximal time-of-flight to be taken into account"
      column:  1             
      prefix:  "-T"

  - LmbdMin:               #     -l  "min. lambda [Ang]"
      type:    "float" 
      descr:   "min. lambda [Ang]"
      tootip:  "minimal wavelength to be taken into account"
      min:     0.0
      column:  0            
      prefix:  "-l"
  - LmbdMax:               #     -L  "max. lambda [Ang]"
      type:    "float" 
      descr:   "max. lambda [Ang]" 
      tooltip: "maximal wavelength to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-L"
  - EMin:                  #     -m  "min. energy [meV]"
      type:    "float" 
      descr:   "min. energy [meV]"
      tooltip: "minimal energy to be taken into account"
      min:     0.0
      column:  0            
      prefix:  "-m"
  - EMax:                  #     -M  "max. energy [meV]"
      type:    "float" 
      descr:   "max. energy [meV]"
      tooltip: "maximal energy to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-M"

  - yMin:                  #     -y  "min. width  [cm]"
      type:    "float" 
      descr:   "min. hor.\npos. [cm]"
      tooltip: "minimal horizontal position to be taken into account"
      column:  0            
      prefix:  "-y"
  - yMax:                  #     -Y  "max. width  [cm]"
      type:    "float" 
      descr:   "max. hor.\npos. [cm]"
      tooltip: "maximal horizontal position to be taken into account"
      column:  1           
      prefix:  "-Y"
  - zMin:                  #     -z  "min. height [cm]"
      type:    "float" 
      descr:   "min. vert.\npos. [cm]" 
      tooltip: "minimal vertical position to be taken into account"
      column:  0            
      prefix:  "-z"
  - zMax:                  #     -Z  "max. height [cm]"
      type:    "float" 
      descr:   "max. vert.\npos. [cm]"
      tooltip: "maximal vertical position to be taken into account"
      column:  1            
      prefix:  "-Z"
  - RadMin:       
      type:    "float" 
      descr:   "min. radius [cm]" 
      tooltip: "minimal radial position to be taken into account"
      min:     0.0
      column:  0            
      prefix:  "-d"
  - RadMax:    
      type:    "float" 
      descr:   "max. radius [cm]"
      tooltip: "maximal radial position to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-D"

  - DivYMin:               #     -h  "min. hor. \ndiv. [deg]"
      type:    "float" 
      descr:   "min. hor.\ndiv. [deg]" 
      tooltip: "minimal hor. div. to be taken into account"
      column:  0              
      prefix:  "-h"
  - DivYMax:               #     -H  "max. hor. \ndiv. [deg]"
      type:    "float" 
      descr:   "max. hor.\ndiv. [deg]"
      tooltip: "maximal hor. div. to be taken into account"
      column:  1             
      prefix:  "-H"
  - DivZMin:               #     -v  "min. vert. \ndiv. [deg]"
      type:    "float" 
      descr:   "min. vert.\ndiv. [deg]"
      tooltip: "minimal vert. div. to be taken into account"
      column:  0            
      prefix:  "-v"
  - DivZMax:               #     -V  "max. vert. \ndiv. [deg]"
      type:    "float" 
      descr:   "max. vert.\ndiv. [deg]"
      tooltip: "minimal vert. div. to be taken into account"
      column:  1            
      prefix:  "-V"
  - DivRMin:               #     -r  "min. radial \ndiv. [deg]"
      type:    "float" 
      descr:   "min. radial\ndiv. [deg]" 
      tooltip: "minimal radial div. to be taken into account"
      min:     0.0
      column:  0             
      prefix:  "-r"  
  - DivRMax:               #     -R  "max. radial \ndiv. [deg]"
      type:    "float" 
      descr:   "max. radial \ndiv. [deg]"
      tooltip: "maximal radial div. to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-R"

  - Freq:                  #     -f  "frequency [Hz]"
      type:    "float" 
      descr:   "frequency [Hz]"
      tooltip: "source frequency"
      column:  0            
      prefix:  "-f"
                               
