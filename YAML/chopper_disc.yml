chopper_disc:
   Name    : ""
   Rpm     : 6000.0              # -s       [1/min] rotation speed 
   Offset  :  -72.0              # -o        [deg]  orientation of the chopper at t=0 
   Dist    :    0.0              # -l        [cm]   distance of the chopper from the end of the previous component 
   eAbs    :  IDEAL              # -g  IDEAL  [-]   enum: absorption in chopper: IDEAL  GADOLINIUM  BOR 
   bRndT   :  NO                 # -r   NO    [-]   flag: time of arrival is set by a random choice within the period of the chopper disc 
   bZeroT  :  NO                 # -z   NO    [-]   flag: chopper sets neutron time close to zero after the chopper
   bPass   :  YES                # -p   YES   [-]   flag: neutrons can pass outside the chopper 
   bColor  :  NO                 # -c   NO    [-]   flag: chopper sets colour to window number 
   Radius  :   35.0              # -R  35.0  [cm]   radius of the chopper 
   HorPos  :    0.0              # -Y   0.0  [cm]   y-component of the centre of the chopper 
   VertPos :  -25.0              # -Z -27.5  [cm]   z-component of the centre of the chopper 
   ChopFile:                     # -C         [-]    name of the file describing the chopper disc
   Window  :
      - WndPos  :    0.0         # -1A       [deg]  angular position of the window center 
        WndWidth:   10.0         # -1O       [deg]  angular opening of the chopper window 
        WndHite :   15.0         # -1H 15.0  [cm]   window height from edge of chopper disk to bottom of window 
        DevL    :    0.0         # -1L  0.0  [deg]  Angular deviation of left window side, positive value indicates that window widens (cf. help file) 
        DevR    :    0.0         # -1R  0.0  [deg]  Angular deviation of right window side, positive value indicates that window widens (cf. help file) 
      - WndPos  :   90.0         # -2A       [deg]  angular position of the window center 
        WndWidth:   20.0         # -2O       [deg]  angular opening of the chopper window 
