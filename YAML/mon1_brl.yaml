#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe

mon1_brl:
  - category:  "monitor"

  - sMonFile:              #     -O  "monitor file"
      type:    "file" 
      plottable: true
      descr:   "monitor file"
      tooltip: "Monitor output file containing brilliance or brilliance transfer as a function of the chosen parameter"
      default: "Sample.brl" 
      prefix:  "-O"  
  - sRefFile:              #     -S  "reference file"
      type:    "file" 
      plottable: false
      descr:   "reference file" 
      tooltip: "Brilliance file used as reference (it is used to calculate the brilliance transfer)"
      prefix:  "-S"  
  - sFluxFile:              #     -F  "flux file"
      type:    "file" 
      plottable: false
      descr:   "flux file"  
      tooltip: "This file is used to monitor the average and max. brilliance as a function of the given parameter set.\n1 line is written in each simulation"
      prefix:  "-F"  
 
  - eBrlPar:                  #     -k  "variable parameter"      VtBrlPar  BrlPar_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "variable parameter"
      tooltip: "ID for the parameter, as a function of which the brilliance is shown"
      enum:    "VtBrlPar"
      options: ["time","lambda","energy","pos_y","pos_z","pos_rad","div_y","div_z","div_rad"]
      default:  "time"
      column:  0            
      prefix:  "-k"
  - eBrlNorm:                  #     -N  "norm. type"     VtBrlNorm BrlNorm_Txt2ID(const char* sText)            
      type:    "combo" 
      descr:   "norm. type"
      tooltip: "absolute:  absolute brilliance [n/(cm²s sr Ang)]\ntransfer:  relative brilliance (= brilliance transfer)\n1% lambda  brilliance within 1% DelLamdba/Lambda [n/(cm²s sr)]"
      enum:    "VtBrlNorm"
      options:["absolute","transfer","1% lambda"]
      default: "absolute"
      column:   1            
      prefix:  "-N"

  - bLogBin:                #     -B  "logarithmic binning"
      type:    "switch" 
      descr:   "logarithmic binning" 
      tooltip: "yes: bin size increases exponentially\nno : bin size is constant"
      default:  no
      column:   0            
      prefix:  "-B" 
  - bExcl:              #     -e  "exclusive counts"
      type:    "switch" 
      descr:   "exclusive counts" 
      tooltip: "yes: only neutrons meeting the monitor conditions are written\nno : all are written"
      default:  no
      column:   1                     
      prefix:  "-e"   
 
  - nBins:                 # >=1 -n  "number of bins"           "number of monitor channels"
      type:    "int" 
      descr:   "number of bins" 
      tooltip: "number of monitor channels"
      default: 100
      min:     1
      column:  0            
      prefix:  "-n"
  - iColor:               #     -C  "color"                     
      type:    "int" 
      descr:   "color" 
      tooltip: "color of the trajectories condidered by the monitor   (default  ALL)"
      min:     -1
      column:  1            
      prefix:  "-C"
   
  - MinTime:               #     -t  "min. time [ms]"
      type:    "float" 
      descr:   "min. time [ms]" 
      tooltip: "minimal time-of-flight to be taken into account"
      column:  0               
      prefix:  "-t"

  - MaxTime:               #     -T  "min. time [ms]"
      type:    "float" 
      descr:   "max. time [ms]"
      tooltip: "maximal time-of-flight to be taken into account"
      column:  1             
      prefix:  "-T"

  - MinLambda:               #     -l  "min. lambda [Ang]"
      type:    "float" 
      descr:   "min. lambda [Ang]"
      tootip:  "minimal wavelength to be taken into account"
      min:     0.0
      column:  0            
      prefix:  "-l"
  - MaxLambda:               #     -L  "max. lambda [Ang]"
      type:    "float" 
      descr:   "max. lambda [Ang]" 
      tooltip: "maximal wavelength to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-L"
  - MinE:                  #     -m  "min. energy [meV]"
      type:    "float" 
      descr:   "min. energy [meV]"
      tooltip: "minimal energy to be taken into account"
      min:     0.0
      column:  0            
      prefix:  "-m"
  - MaxE:                  #     -M  "max. energy [meV]"
      type:    "float" 
      descr:   "max. energy [meV]"
      tooltip: "maximal energy to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-M"

  - MinY:                  #     -y  "min. width  [cm]"
      type:    "float" 
      descr:   "min. hor. pos. [cm]"
      tooltip: "minimal horizontal position to be taken into account"
      column:  0            
      prefix:  "-y"
  - MaxY:                  #     -Y  "max. width  [cm]"
      type:    "float" 
      descr:   "max. hor. pos. [cm]"
      tooltip: "maximal horizontal position to be taken into account"
      column:  1           
      prefix:  "-Y"
  - MinZ:                  #     -z  "min. height [cm]"
      type:    "float" 
      descr:   "min. vert. pos. [cm]" 
      tooltip: "minimal vertical position to be taken into account"
      column:  0            
      prefix:  "-z"
  - MaxZ:                  #     -Z  "max. height [cm]"
      type:    "float" 
      descr:   "max. vert. pos. [cm]"
      tooltip: "maximal vertical position to be taken into account"
      column:  1            
      prefix:  "-Z"
  - MinRadius:       
      type:    "float" 
      descr:   "min. radius [cm]" 
      tooltip: "minimal radial position to be taken into account"
      min:     0.0
      column:  0            
      prefix:  "-d"
  - MaxRadius:    
      type:    "float" 
      descr:   "max. radius [cm]"
      tooltip: "maximal radial position to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-D"

  - MinDivY:               #     -h  "min. hor.  div. [deg]"
      type:    "float" 
      descr:   "min. hor. div. [deg]" 
      tooltip: "minimal hor. div. to be taken into account"
      column:  0              
      prefix:  "-h"
  - MaxDivY:               #     -H  "max. hor.  div. [deg]"
      type:    "float" 
      descr:   "max. hor. div. [deg]"
      tooltip: "maximal hor. div. to be taken into account"
      column:  1             
      prefix:  "-H"
  - MinDivZ:               #     -v  "min. vert.  div. [deg]"
      type:    "float" 
      descr:   "min. vert. div. [deg]"
      tooltip: "minimal vert. div. to be taken into account"
      column:  0            
      prefix:  "-v"
  - MaxDivZ:               #     -V  "max. vert.  div. [deg]"
      type:    "float" 
      descr:   "max. vert. div. [deg]"
      tooltip: "minimal vert. div. to be taken into account"
      column:  1            
      prefix:  "-V"
  - MinDivR:               #     -r  "min. radial  div. [deg]"
      type:    "float" 
      descr:   "min. radial div. [deg]" 
      tooltip: "minimal radial div. to be taken into account"
      min:     0.0
      column:  0             
      prefix:  "-r"  
  - MaxDivR:               #     -R  "max. radial  div. [deg]"
      type:    "float" 
      descr:   "max. radial  div. [deg]"
      tooltip: "maximal radial div. to be taken into account"
      min:     0.0
      column:  1            
      prefix:  "-R"

  - Freq:                  #     -f  "frequency [Hz]"
      type:    "float" 
      descr:   "frequency [Hz]"
      tooltip: "source frequency"
      column:  0            
      prefix:  "-f"
                               
