#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
source:				       # source module that will be executed
  - SimName : 
      descr:   "simulation\nname"
      type:    "string"
      default: "First Simulation" 
      column:  0                       
  - eKind   :                          # -K       VtSrcKind SrcKind_Txt2ID(const char* sText)   SRC_SIMPLE  SRC_CWS  SRC_PULSED  SRC_ISIS  SRC_ESS
      type:    "combo"                 # This shall not be selected, but defined by the chosen module   
      default: "simple source" 
      index:   1
      prefix:  "-K"     

  - Moderator_simple:
      type:    "window"
      descr:   "moderator"
      tooltip: "moderator description parameter"   
#     default: "moderator_simple.yaml"

  - titel_1 :                       
      type:    "title" 
      default: "Simulation parameters"
  - nBundle:                            # -n   10 [-]   number of bundles  
      type:    "int" 
      descr :  "number of\nbundels"  
      tooltip: "number of packages into which the whole simulation is separated"
      default: 10
      column:  0                     
      prefix:  "-l"     
  - nTraj   :                          # -n   1.0e6 [-]   number of neutron trajectories (events)  
      type:    "float" 
      descr :  "number of traj.\nper bundle"
      tooltip: "number of neutron trajectories (events) created in each bundle"
      default: 1000000 
      column:  1                     
      prefix:  "-n"     

  - Lmin    :                          # -m        [Ang]  minimum of the wavelength range 
      type:    "float" 
      descr:   "min. wave-\nlength [Ang]"
      tooltip: "minimum of the wavelength range"
      min    : 0.0
      default: 1.0
      column:  0                     
      prefix:  "-m"     
  - Lmax    :                          # -M        [Ang]  maximum of the wavelength range 
      type:    "float" 
      descr:   "max. wave-\nlength [Ang]"
      tooltip: "maximum of the wavelength range" 
      default: 5.0
      column:  1                     
      prefix:  "-M"     

  - eDirect :                          # -d  VtDirect Direct_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "direction\ndefined"
      tooltip: "mode to determine neutron directions\n'by virtual window' means that the window is the target, but the neutrons stay at the source position, otherwise neutrons are propageted to the window" 
      default: ["by real window", "by virtual window", "by divergence"] 
      column:  0                     
      prefix:  "-d"     

  - DivHmax :                          # -z        [deg]  maximum horizontal divergence (half of angular spread x-z-plane, if min. value is zero) 
      type:    "float" 
      descr:   "max. divergence\nx <-> y [deg]"
      tooltip: "maximum horizontal divergence (half of angular spread x-z-plane, if min. value is zero)" 
      column:  0                     
      prefix:  "-y"     
  - DivVmax :                          # -z        [deg]  maximum vertical divergence (half of angular spread x-z-plane, if min. value is zero) 
      type:    "float" 
      descr:   "max. divergence\nx <-> z [deg]"
      tooltip: "maximum vertical divergence (half of angular spread x-z-plane, if min. value is zero)"
      column:  1                     
      prefix:  "-z"     

  - titel_2 :                       
      type:    "title" 
      default: "Propagation"
  - TDist   :                          # -D 100.0  [cm]   distance moderator - target window 
      type:    "float" 
      descr:   "distance to\nwindow [cm]"
      tooltip: "distance moderator - target window" 
      min    :   0.0
      default: 100.0
      column:  0                     
      prefix:  "-D"     
  - TWidth  :                          # -w   3.0  [cm]   width of the target window 
      type:    "float" 
      descr:   "window\nwidth [cm]"
      tooltip: "width of the target window" 
      min    : 0.0
      default: 3.0
      column:  1                     
      prefix:  "-w"     
  - THeight :                          # -h   3.0  [cm]   height of the target window 
      type:    "float" 
      descr:   "window\nheight [cm]"
      tooltip: "height of the target window"
      min    : 0.0
      default: 3.0
      column:  2                     
      prefix:  "-h"     
