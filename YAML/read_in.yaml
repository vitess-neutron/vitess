#description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

read_in:       # source module that will be executed
  - category:  "event_handling"

  - Title_Format:
      type:    "title"
      default: "Format"
  - ePrgFormat:               # -f   VtPrgFormat PrgFormat_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "data format"
      tooltip: "data format of the program"
      enum:     "VtPrgFormat"
      options: ["VT_VITESS_FMT", "VT_MCSTAS_FMT", "VT_MCPL_FMT", "VT_MCNP6_FMT", "VT_SSW_FMT"]
      default:  "VT_VITESS_FMT"
      column:  0
      prefix:  "-f"
  - eDataFormat:              # -F   VtDataFormat DataFormat_Txt2ID(const char* sText)
      type:    "combo"
      descr:   "storage format"
      tooltip: "format of the data to read: 'exp': scientific format,  'float': floating point  or binary \n(MCPL is always binary)"
      enum:     "VtDataFormat"
      options: ["VT_EXPONENTIAL", "VT_FLOAT", "VT_BINARY"]
      default:  "VT_FLOAT"
      column:  1
      prefix:  "-F"

  - Title_Input:
      type:    "title"
      default: "Input files"
  - sFile1:                   # -A   NULL   [-]  ASCII 1st input file containing trajectories
      type:    "file"
      plottable: false
      descr:   "ASCII input file 1"
      tooltip: "ASCII 1st input file containing trajectories"
      prefix:  "-A"
  - sFile2:                   # -B   NULL   [-]  ASCII 2nd input file containing trajectories
      type:    "file"
      plottable: false
      descr:   "ASCII input file 2"
      tooltip: "ASCII 2nd input file containing trajectories"
      prefix:  "-B"
  - sFile3:                   # -D   NULL   [-]  ASCII 3nd input file containing trajectories
      type:    "file"
      plottable: false
      descr:   "ASCII input file 3"
      tooltip: "ASCII 3nd input file containing trajectories"
      prefix:  "-D"
  - FracSim1:                 # -a    1.0  [-]
      type:    "float"
      descr:   "weight of traj. in file 1"
      tooltip: "assuming that all input files are written after a completed simulation,\nthe sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
      default: 1.0
      column:  0
      prefix:  "-a"
  - FracSim2:                 # -b    0.0  [-]
      type:    "float"
      descr:   "weight of traj. in file 2"
      tooltip: "assuming that all input files are written after a completed simulation,\nthe sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
      default: 0.0
      column:  1
      prefix:  "-b"
  - FracSim3:                 # -d    0.0  [-]
      type:    "float"
      descr:   "weight of traj. in file 3"
      tooltip: "assuming that all input files are written after a completed simulation,\nthe sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
      default: 0.0
      column:  2
      prefix:  "-d"

  - Title_Opt:
      type:    "title"
      default: "Special options"
  - nInRep:                   # -R     1  Number of times that the events are read
      type:    "int"
      descr:   "repetition"
      tooltip: "Number of times that the trajectories are read"
      default: 1
      min:     1
      column:  0
      prefix:  "-R"
  - nMaxTraj:
      type:    "int"
      descr:   "max. trajectories"
      tooltip: "Maximum number of trajectories that are read."
      column:  1
      prefix:  "-M"
  - WeightFact:               # -I    1.0  [-]
      type:    "float"
      descr:   "intensity factor"
      tooltip: "The weight of each neutron trajectory (from an MCNP simulation) is multiplied by this factor\nto yield correct absolute source flux values: F = I_src/N_mcnp-events"
      default: 1.0
      column:  2
      prefix:  "-I"

  - nSurfaceID:
      type:    "int"
      descr:   "surface ID"
      tooltip: "Only for MCNP6: If a surface ID greater -1 is given, only neutrons passing this ID are read from file."
      default: -1
      column:  2
      prefix:  "-s"
  - iColor:                   # -C    -1  Read only events with a given color. A negative number means any color
      type:    "int"
      descr:   "read in color"
      tooltip: "Read only events with a given color. A negative number means any color"
      default: -1
      column:  0
      prefix:  "-C"

  - sInstrFile:               #
      type:    "file"
      plottable: false
      descr:   "instrument input file"
      tooltip: "Specifies the instrument file (generated as instrument.inf) of the previous part of the simulation."
      prefix:  "--I"
  - sTraceFile:               #
      type:    "file"
      plottable: false
      descr:   "raytracing file"
      tooltip: "Name of the file that contains the IDs of the trajectories for tracing."
      prefix:  "-T"
  - eTraceMode:               # -t   VtTrace   Trace_Txt2ID(const char* sText);
      type:    "combo"
      descr:   "raytracing mode"
      tooltip: "no tracing\nwrite a files for each traj. of interest\nsimulation only with traj. of interest"
      enum:    "VtTrace"
      options: ["NO_TRACING", "WRITE_TRC_FILES", "ONLY_TRC_TRAJ"]
      default:  "NO_TRACING"
      column:  0
      prefix:  "-t"

