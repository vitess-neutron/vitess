#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES ), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
read_in:   		     # source module that will be executed
  - Name    : 
      type:    "string"
      descr:   "name" 
  - eInPrgf:                 # -f   VITESS   [-]   see 'VtPrgFormat' in 'in_out.h'   
      type:    "combo" 
      descr:   "data format" 
      tooltip: "data format of the program"
      default: ["VITESS", "McStas", "MCPL", "MCNP", "MCNPX"]   
      column:  0                     
      prefix:  "-f"   
  - eInForm:                 # -F   FLOAT   [-]    see 'VtDataFormat' in 'in_out.h'
      type:    "combo" 
      descr:   "storage format" 
      tooltip: "format of the data to read: 'exp': scientific format,  'float': floating point  or binary \n(MCPL is always binary)"
      default: ["float", "exponential", "binary"]   
      column:  1                     
      prefix:  "-F"   
  - File1:                 # -A   NULL   [-]  ASCII 1st input file containing trajectories
      type:    "file" 
      descr:   "ASCII input\nfile 1"
      tooltip: "ASCII 1st input file containing trajectories"
      prefix:  "-A"
  - File2:                 # -B   NULL   [-]  ASCII 2nd input file containing trajectories
      type:    "file" 
      descr:   "ASCII input\nfile 2" 
      tooltip: "ASCII 2nd input file containing trajectories"
      prefix:  "-B"
  - File3:                 # -D   NULL   [-]  ASCII 3nd input file containing trajectories
      type:    "file" 
      descr:   "ASCII input\nfile 3"  
      tooltip: "ASCII 3nd input file containing trajectories"
      prefix:  "-D"
  - RiFrc1:                 # -a    1.0  [-]  
      type:    "float" 
      descr:   "weight of traj.\nin file 1"
      tooltip: "assuming that all input files are written after a completed simulation,\nthe sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
      default: 1.0
      column:  0                     
      prefix:  "-a"   
  - RiFrc2:                 # -b    0.0  [-]   
      type:    "float" 
      descr:   "weight of traj.\nin file 2"
      tooltip: "assuming that all input files are written after a completed simulation,\nthe sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
      default: 0.0
      column:  1                     
      prefix:  "-b"   
  - RiFrc3:                 # -d    0.0  [-] 
      type:    "float" 
      descr:   "weight of traj.\nin file 3"
      tooltip: "assuming that all input files are written after a completed simulation,\nthe sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
      default: 0.0
      column:  2                     
      prefix:  "-d"   
  - Title_1:
      type:    "title"
      default: " " 
  - nInRep:                   # -R     1  Number of times that the events are read 
      type:    "int" 
      descr:   "repetition" 
      tooltip: "Number of times that the events are read"
      default: 1
      min:     1
      column:  1                     
      prefix:  "-R" 
  
  - RiFact:                 # -I    1.0  [-] 
      type:    "float" 
      descr:   "intensity factor\nfor MCNPX"
      tooltip: "The weight of each neutron trajectory from the MCNPX simulation is multiplied by this factor\nto yield correct absolute source flux values: F = I_src/N_mcnpx-events"
      default: 1.0
      column:  0                     
      prefix:  "-I"   
  - nInCol:                   # -C    -1  Read only events with a given color. A negative number means any color 
      type:    "int" 
      descr:   "read in color" 
      tooltip: "Read only events with a given color. A negative number means any color" 
      default: -1
      column:  0                     
      prefix:  "-C"   
  - InstFile:                 # 
      type:    "file" 
      descr:   "instrument\ninput file"
      tooltip: "Specifies the instrument file of the previous part of the simulation."
      prefix:  "--I"
  - TrcFile:                  # 
      type:    "file" 
      descr:   "raytracing\nfile"
      tooltip: "Name of the file that contains the IDs of the trajectories for tracing."
      prefix:  "-T"
  - eTrcMode:                 #  see defines in general.h
      type:    "combo" 
      descr:   "raytracing mode" 
      tooltip: "no tracing\nwrite a files for each traj. of interest\nsimulation only with traj. of interest"
      default: ["no tracing", "write trace files", "only trace trajectories"]   
      column:  1                     
      prefix:  "-t"   

