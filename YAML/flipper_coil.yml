flipper_coil:
   Name    : "90 deg flipper"
   PosX    :   10.0           # -k    0.0  [cm]   x-position of the centre of the coil
   PosY    :    0.0           # -l    0.0  [cm]   y-position of the centre of the coil
   PosZ    :    0.0           # -m    0.0  [cm]   z-position of the centre of the coil
   CoilDir :    Z             # -y    Y    [-]    orientation of the coil axis
   AnglHor :    0.0           # -i    0.0 [deg]   horizontal (first) rotation angle of the coil axis
   AnglVert:    0.0           # -j    0.0 [deg]   vertical (second) rotation angle of the coil axis
   Depth   :   10.0           # -X    0.0  [cm]   x-component of the size of the coil 
   Width   :    6.0           # -Y    0.0  [cm]   y-component of the size of the coil 
   Height  :   10.0           # -V    0.0  [cm]   z-component of the size of the coil 
   FldGuide:    1.0           # -G    0.0  [Oe]   strength of the guide magnetic field which is considered parallel to the beam axis
   FldCoil :   10.0           # -H    0.0  [Oe]   strength of the coil magnetic field which is considered parallel to the coil axis
   Thicknes:    0.2           # -t    0.0  [cm]   thickness of the coil wire (wall)
   nDomainX:   10             # -N   98    [-]    number of 'boxes' along the beam in which the field is devided (max:100)
   OutX    :   20.0           # -p    0.0  [cm]   position of the new origin  (in the co-ordinate of the old origin)
   OutY    :    0.0           # -r    0.0  [cm]   position of the new origin  (in the co-ordinate of the old origin)
   OutZ    :    0.0           # -s    0.0  [cm]   position of the new origin  (in the co-ordinate of the old origin)
