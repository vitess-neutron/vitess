      tooltip: "minimal value of filter parameter 2" 
      column:   1                     
      prefix:  "-v"   
  - MaxPar2 :  
      type:    "float" 
      descr:   "filter 2 max. value" 
      tooltip: "maximal value of filter parameter 2"
      column:   2                     
      prefix:  "-V" 

  - eFilterPar3:      # MonPar_Txt2ID     
      type:    "combo" 
      descr:   "filter parameter 3"  
      tooltip: "3rd parameter that is filtered " 
      enum:    "VtMonPar"      
      options:["none","pos_x","pos_y","pos_z","div_y","div_z","lambda","energy","time","k_y","k_z","r","phi","dir_phi","dir_theta","col_vert","col_hor","color"]   
      default: "none"
      column:   0                     
      prefix:  "-K"   
  - MinPar3 :   
