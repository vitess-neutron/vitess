#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
filter:
  - category:  "filter"
  - eFilterPar1:      # MonPar_Txt2ID     
      type:    "combo" 
      descr:   "filter parameter 1"  
      tooltip: "1st parameter that is filtered"
      enum:    "VtMonPar"      
      options:["none","pos_x","pos_y","pos_z","div_y","div_z","lambda","energy","time","k_y","k_z","r","phi","dir_phi","dir_theta","col_vert","col_hor","color"]   
      default: "none"
      column:   0                     
      prefix:  "-I"   
  - MinPar1 :   
      type:    "float" 
      descr:   "filter 1 min. value"  
      tooltip: "minimal value of filter parameter 1" 
      column:   1                     
      prefix:  "-u"   
  - MaxPar1 :  
      type:    "float" 
      descr:   "filter 1 max. value" 
      tooltip: "maximal value of filter parameter 1"
      column:   2                     
      prefix:  "-U" 

  - eFilterPar2:      # MonPar_Txt2ID     
      type:    "combo" 
