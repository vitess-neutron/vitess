#input fields so far
#type: title, file, string, float, int, switch (yes, no), combo (for selection list)
#descr: description of the parameter lable
#default: Value for title, values for selection list, optional default values
#min: minimum value optional
#max: maximum value optional
#column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
#prefix: prefix for parameter in pipe

collimator:
  - category:  "collimator"

  - EntrWidth:
      type: "float"
      descr:  "entrance width [cm]"
      tooltip: "Width of the entrance of the collimator\n(center at y=0)"
      default: 4.0
      min:      0.0001
      column:  0
      prefix: "-w"
  - EntrHeight:
      type: "float"
      descr:  "entrance height [cm]"
      tooltip: "Height of the entrance of the collimator\n(center at z=0)"
      default:  5.0
      min:      0.0001
      column:  0
      prefix: "-h"

  - ExitWidth:
      type: "float"
      descr:  "exit width [cm]"
      tooltip: "Width of the exit of the collimator\n(center at y=0)"
      default: 4.0
      min:      0.0001
      column:  1
      prefix: "-W"
  - ExitHeight:
      type: "float"
      descr:  "exit height [cm]"
      tooltip: "Height of the exit of the collimator\n(center at z=0)"
      default: 5.0
      min:      0.0001
      column:   1
      prefix: "-H"

  - Length:
      type: "float"
      descr:  "length [cm]"
      tooltip: "Length of the collimator channels"
      default: 40.0
      min:      0.0
      column:   0
      prefix: "-l"
  - nChannels:
      type:    "int"
      descr:   "number of channels"
      tooltip: "Number of the collimator channels"
      default:  20
      min:       1
      column:    1
      prefix:  "-n"
  - BladeThickn:
      type:    "float"
      descr:   "wall thickness [cm]"
      tooltip: "Thickness of the blades separating two channels of the collimator"
      default: 0.01
      min:     0.0
      column:  2
      prefix: "-s"


