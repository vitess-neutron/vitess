monitor1_pol:
   sName   :
   sMonFile: "Pol.dat"   #     -O  "monitor file"              "Monitor output file containing polarisation as a function of the chosen parameter""

   ePar    :  NO_PAR     #     -k  "variable\nparameter"       "ID for parameter, as a function of which the intensity is shown"
   MinY    :    0.0      #     -m  "min. y-value\n[cm]"        "lower bound value of the monitored range"
   MaxY    :   10.0      #     -M  "max. y-value\n[cm]"        "upper bound value of the monitored range"
   nBins   :  100        # >=1 -n  "number\nof bins"           "number of monitor channels"
   PolX    :    1.0      #     -a  "directon\nx"               "x-component of the quantization direction"
   PolY    :    0.0      #     -b  "directon\ny"               "y-component of the quantization direction" 
   PolZ    :    0.0      #     -c  "directon\nz"               "z-component of the quantization direction"
   bProbWt :  YES        #     -p  "probability\nweight"       "YES: Probability weight   NO: number of trajectories
   bExclude:  NO         #     -e  "exclusive\ncounts"         "YES: only neutrons meeting the monitor conditions are written   NO: all are written
                               
                               