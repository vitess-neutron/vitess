#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe

Reflectivity_Par:
  - ReflName :
      descr:   "name"
      type:    "string"
      column:  0                

  - PosX:                   	#   [cm]   center x position of the sample
      type:    "float" 
      descr:   "pos x [cm]"
      tooltip: "center x position of the sample"
      default: 0.0
      column:  0                     
  - PosY:                   	#   [cm]   center y position of the sample
      type:    "float" 
      descr:   "pos y [cm]"
      tooltip: "center y position of the sample"
      default: 0.0
      column:  1                     
  - PosZ:                  	#   [cm]   center z position of the sample
      type:    "float" 
      descr:   "pos z [cm]"
      tooltip: "center z position of the sample"
      default: 0.0
      column:  2                     

  - Width   :                   #   [cm]   width  of the sample 
      type:    "float" 
      descr:   "width [cm]"
      tooltip: "width of the sample"
      column:  0                     
  - Length  :                   #   [cm]   length of the sample 
      type:    "float" 
      descr:   "length [cm]"
      tooltip: "length of the sample"
      column:  1                     
   
  - OutX   :                   #   [cm]   x coordinate in output frame 
      type:    "float" 
      descr:   "out x [cm]"
      tooltip: "x coordinate in output frame"
      default: 0.0
      column:  0                     
  - OutY   :                   #   [cm]   y coordinate in output frame 
      type:    "float" 
      descr:   "out y [cm]"
      tooltip: "y coordinate in output frame"
      default: 0.0
      column:  1                     
  - OutZ   :                   #   [cm]   z coordinate in output frame 
      type:    "float" 
      descr:   "out z [cm]"
      tooltip: "z coordinate in output frame"
      default: 0.0
      column:  2                     

  - OutHor   :                   #   [deg]   horizontal angular coordinate in output frame 
      type:    "float" 
      descr:   "horizontal\nangle [deg]"
      tooltip: "horizontal angular coordinate in output frame"
      default: 0.0
      column:  0                     
  - OutVert   :                   #   [deg]   vertical angular coordinate in output frame 
      type:    "float" 
      descr:   "vertical\nangle [deg]"
      tooltip: "vertical angular coordinate in output frame"
      default: 0.0
      column:  1                     

