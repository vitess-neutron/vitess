#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
Chopper_Window:
  - ChoppWinName :
      descr:   "name"
      type:    "string"
      column:  0                

  - WndPos:                   	#           [deg]  angular position of the window center
      type:    "float" 
      descr:   "window\nposition [deg]"
      tooltip: "angular position of the window center"
      default: 0.0
      column:  0                     
  - WndWidth:                   #           [deg]  angular opening of the chopper window
      type:    "float" 
      descr:   "window\nwidth [deg]"
      tooltip: "angular opening of the chopper window"
      default: 0.0
      column:  1                     
  - WndHite:                  	#     15.0  [cm]   window height from edge of chopper disk to bottom of window
      type:    "float" 
      descr:   "window\nheight [cm]"
      tooltip: "window height from edge of chopper disk to bottom of window"
      default: 15.0
      column:  2                     

  - DevL   :                   #      0.0  [deg]  Angular deviation of left window side, positive value indicates that window widens (cf. help fil 
      type:    "float" 
      descr:   "left side\ndeviation [deg]"
      tooltip: "Angular deviation of left window side,\npositive value indicates that window widens (cf. help file)"
      default: 0.0
      column:  0                     
  - DevR  :                   #      0.0  [deg]  Angular deviation of right window side, positive value indicates that window widens (cf. help file) 
      type:    "float" 
      descr:   "right side\ndeviation [deg]"
      tooltip: "Angular deviation of right window side,\npositive value indicates that window widens (cf. help file)"
      default: 0.0
      column:  1                     

