# description of input fields
# type: title, file, string, float, int, switch (yes, no), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns
# prefix: prefix for parameter in pipe

capture_flux:
  - category:  "evaluation"
  - RefLambda:
      type: "float"
      descr: "reference wavelength [Ang]"
      tooltip: "reference wavelength in the capture flux definition, usually 1.798 Ang. If 0.0 is given, no reference wavelength is used"
      min: 0.0
      default: 1.798
      prefix: "-R"
  - WndType: # TODO: needs an enum definition
      type: int
      descr: "shape of the illuminated gold foil area"
      tooltip: "0: No restrictions, 1: circular, 2: rectangular"
      min: 0
      max: 2
      default: 2
      prefix: "-t"
  - WndCntrY:
      type: "float"
      descr: "center y [cm]"
      tooltip: "y coordinate: center of circular window [cm]"
      column: 0
      prefix: "-y"
  - WndCntrZ:
      type: "float"
      descr: "center z [cm]"
      tooltip: "z coordinate: center of circular window [cm]"
      column: 1
      prefix: "-z"
  - WndRadius:
      type: "float"
      descr: "radius [cm]"
      tooltip: "radius of circular gold foil [cm]"
      column: 2
      min: 0.0
      prefix: "-r"
  - WidthMin:
      type: "float"
      descr: "min. y [cm]"
      tooltip: "lower frame value of rectangular window [cm]"
      column: 0
      default: -1.0
      prefix: "-w"
  - WidthMax:
      type: "float"
      descr: "max. y [cm]"
      tooltip: "higher frame value of rectangular window [cm]"
      column: 1
      default: 1.0
      prefix: "-W"
  - HeightMin:
      type: "float"
      descr: "min. z [cm]"
      tooltip: "bottom of rectangular window [cm]"
      column: 0
      default: -1.0
      prefix: "-h"
  - HeightMax:
      type: "float"
      descr: "max. z [cm]"
      tooltip: "top of rectangular window [cm]"
      column: 1
      default: 1.0
      prefix: "-H"
  - LambdaMin:
      type: "float"
      descr: "min. lambda [Ang]"
      tooltip: "Minimum lambda for flux count [Ang]"
      column: 0
      prefix: "-l"
  - LambdaMax:
      type: "float"
      descr: "max. lambda [Ang]"
      tooltip: "Maximum lambda for flux count [Ang]"
      column: 1
      prefix: "-L"
