#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
sample_reflectom:
  - Name    :
      type:    "string"
      descr:   "name" 

  - Title_OffSpect: 
      type:    "title" 
      default: "Sample parameter"
  - PosX:                   	#   [cm]   center x position of the sample
      type:    "float" 
      descr:   "pos x [cm]"
      tooltip: "center x position of the sample"
      default: 0.0
      prefix:  "-x"
      column:  0                     
  - PosY:                   	#   [cm]   center y position of the sample
      type:    "float" 
      descr:   "pos y [cm]"
      tooltip: "center y position of the sample"
      default: 0.0
      prefix:  "-y"
      column:  1                     
  - PosZ:                  	#   [cm]   center z position of the sample
      type:    "float" 
      descr:   "pos z [cm]"
      tooltip: "center z position of the sample"
      default: 0.0
      prefix:  "-z"
      column:  2                     

  - Width   :                   #   [cm]   width  of the sample 
      type:    "float" 
      descr:   "width [cm]"
      tooltip: "width of the sample"
      prefix:  "-W"
      column:  0                     
  - Length  :                   #   [cm]   length of the sample 
      type:    "float" 
      descr:   "length [cm]"
      tooltip: "length of the sample"
      prefix:  "-L"
      column:  1                     
   
  - OutX   :                   #   [cm]   x coordinate in output frame 
      type:    "float" 
      descr:   "out x [cm]"
      tooltip: "x coordinate in output frame"
      default: 0.0
      prefix:  "-u"
      column:  0                     
  - OutY   :                   #   [cm]   y coordinate in output frame 
      type:    "float" 
      descr:   "out y [cm]"
      tooltip: "y coordinate in output frame"
      default: 0.0
      prefix:  "-U"
      column:  1                     
  - OutZ   :                   #   [cm]   z coordinate in output frame 
      type:    "float" 
      descr:   "out z [cm]"
      tooltip: "z coordinate in output frame"
      default: 0.0
      prefix:  "-w"
      column:  2                     

  - OutHor   :                   #   [deg]   horizontal angular coordinate in output frame 
      type:    "float" 
      descr:   "horizontal\nangle [deg]"
      tooltip: "horizontal angular coordinate in output frame"
      default: 0.0
      prefix:  "-k"
      column:  0                     
  - OutVert   :                   #   [deg]   vertical angular coordinate in output frame 
      type:    "float" 
      descr:   "vertical\nangle [deg]"
      tooltip: "vertical angular coordinate in output frame"
      default: 0.0
      prefix:  "-K"
      column:  1                     

  - SmplFile:                 # -I         [-]    name of the file containing the sample reflectometry
      type:    "file" 
      descr:   "parameter\nfile"  
      tooltip: "name of the file containing the sample parameters"
      prefix:  "-P"

  - ReflFile:                 # -I         [-]    name of the file containing the sample reflectometry
      type:    "file" 
      descr:   "reflectivity\nfile"  
      tooltip: "name of the file containing the sample reflectometry"
      prefix:  "-I"
  - Mode    :                 # -O  SAMPLE [-]    enum mode  1 reflection of SAMPLE   2 reflection of REFERENCE  
      type:    "combo" 
      descr:   "mode" 
      tooltip: "cylindrical: reflection of SAMPLE\nflat: reflection of REFERENCE" 
      default: ["cylindrical", "flat"]   
      column:  0                     
      prefix:  "-O"   
  - RotAxis :                 # -R   "Y"   [-]    rotation axis of sample "Y" or"Z"  
      type:    "combo" 
      descr:   "axis of\nrotation"
      tooltip: "rotation axis of sample Y or Z"
      default: ["Y", "Z"]   
      column:  1                     
      prefix:  "-R"   
  - RotAngle:                 # -a    0.0 [deg]   min. value of angle or reflection 
      type:    "float" 
      descr:   "reflection\nangle [deg]"
      tooltip: "min. value of angle or reflection" 
      default: 0.0
      column:  0                     
      prefix:  "-a"   
  - Title_OffSpect: 
      type:    "title" 
      default: "Offspecular scattering"
  - bOffSpec:                 # -o   NO    [-]    flag: offspecular scattering (NO YES)  
      type:    "switch" 
      descr:   "offspecular\nscattering" 
      tooltip: "flag: offspecular scattering (NO YES)"
      column:  0                     
      prefix:  "-o"   
  - Title_IncScat: 
      type:    "title" 
      default: "Incoherent scattering"
  - bIncScat:                # -B   NO    [-]    flag: incoherent scattering  (NO YES)  
      type:    "switch" 
      descr:   "incoherent\nscattering" 
      tooltip: "flag: incoherent scattering  (NO YES)"  
      column:  0                     
      prefix:  "-B"   
  - MuIncSca:                 # -X    0.0 [1/cm]  macroscopic incoherent scattering cross section of the sample 
      type:    "float" 
      descr:   "incoherent\npathlength"
      tooltip: "macroscopic incoherent scattering cross section of the sample"
      default: 0.0
      column:  1                     
      prefix:  "-X"   
  - StoNArea:                 # -S    1.0  [cm]   Relates the area on the detector with signal counts to total detector area
      type:    "float" 
      descr:   "norm factor"
      tooltip: "relates the area on the detector with signal counts to total detector area"
      default: 1.0
      column:  2                     
      prefix:  "-S"   
  - DetDist :                 # -d    1.0  [cm]   Distance to the detector for solid angle for incoherent scattering 
      type:    "float" 
      descr:   "detector\ndistance"
      tooltip: "distance to the detector for solid angle for incoherent scattering" 
      default: 1.0
      column:  0                     
      prefix:  "-d"   
  - DetWidth:                 # -p    0.0  [cm]   Width of the detector for solid angle for incoherent scattering 
      type:    "float" 
      descr:   "detector\nwidth"
      tooltip: "width of the detector for solid angle for incoherent scattering"
      default: 0.0
      column:  1                     
      prefix:  "-p"   
  - DetHite :                  # -t    0.0  [cm]   Height of the detector for solid angle for incoherent scattering 
      type:    "float" 
      descr:   "detector\nheight"
      tooltip: "height of the detector for solid angle for incoherent scattering" 
      default: 0.0
      column:  2                     
      prefix:  "-t"   

