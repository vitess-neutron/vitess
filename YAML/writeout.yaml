#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
writeout: 		     # source module that will be executed
  - Name    : 
      type:    "string" 
      descr:   "name"

  - Title_Output:
      type:    "title"
      default: "Output file choices" 
  - sOutFile:                #         -A  "trajectory\noutput file"     "name of the trajectory output file"
      type:    "file" 
      descr:   "trajectory\noutput file"
      tooltip: "name of the trajectory output file"
      default: "events.out" 
      prefix:  "-A"
  - bActive :               #         -a  "Active?"                     "flag: YES: output file is written   NO: output file is not written
      type:    "switch" 
      descr:   "Active?" 
      tooltip: "YES: output file is written   NO: output file is not written"
      default: true
      column:  0                     
      prefix:  "-a"  
  - bHeader :               
      type:    "switch" 
      descr:   "Header" 
      tooltip: "YES: write header to ASCII file beginning each line with '#'    NO: write only data, no header"
      default: true
      column:  1                     
      prefix:  "-h"  

  - Title_Format:
      type:    "title"
      default: "File formats" 
  - ePrgFmt :                #         -f  VtPrgFormat PrgFormat_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "data format" 
      tooltip: "data format of the program"
      enum:     "VtPrgFormat"
      options: ["VITESS", "McStas", "MCPL", "MCNP6", "SSW"]
      default:  "VITESS"
      column:  0                     
      prefix:  "-f"
  - eDatFmt :                #         -F  VtDataFormat DataFormat_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "storage format" 
      tooltip: "format of the data to read: 'exponential': scientific format,  'float': floating point  or binary \n(MCPL is always binary)"
      enum:     "VtDataFormat"
      default: ["exp", "float", "binary"]   
      default:  "float"
      column:  1                     
      prefix:  "-F"   
  - eSepFmt :                #         -S  VtSeparator Separator_Txt2ID(const char* sText)
      type:    "combo" 
      descr:   "separator"
      tooltip: "separator between columns in the ASCII output file"
      enum:     "VtSeparator"
      default: ["space", "tabulator"]   
      column:  2                     
      prefix:  "-S" 
  
  - Title_Opt:
      type:    "title"
      default: "MCNP and SSW options" 
  - FactInt :              
      type:    "float" 
      descr:   "intensity\nfactor"
      tooltip: "The weight of each neutron trajectory is divided by this factor to yield the weight for an MCNP simulation:.\nShould equal the value in 'read_in'."
      min:     0.0
      column:  0                     
      prefix:  "-I"
  - nSurface:               
      type:    "int" 
      descr:   "surface\nID" 
      tooltip: "Only for MCNP6: Number written as surface ID to the output file" 
      default: 0
      column:  1                     
      prefix:  "-s"
  - sSimName:   
      type:    "string" 
      descr:   "Simulation\nname"
      tooltip: "Only for MCNP6: name of the simulation" 
      column:  2                     
      prefix:  "-T"     

  - sSswFile:                #         -r   [-]   SSW reference file name
      type:    "file" 
      descr:   "SSW\nref. file"
      tooltip: "Specifies the name of the SSW reference file to determine the file format"
      prefix:  "-r"

#  - aParOut :               #         -c  "Columns"  
#      type:    "string" 
#      descr:   "Columns" 
#      tooltip: "array containing 9 flags to determine which parameters are written: ID, trace, color, TOF, wavelength, intensity, position, direction, spin."  "Format in which the input was written"
#      default: "111111111"   
#      column:  0                     
#      prefix:  "-c"   
   
  - Title_Filter: 
      type:    "title" 
      default: "Filter selection"
  - iDetCol :               #         -C  "writeout color"              "Write only events with a given color. A negative number means any color."
      type:    "int" 
      descr:   "writeout color" 
      tooltip: "Write only events with a given color. A negative number means any color."
      column:  0                     
      prefix:  "-C"   
   
  - FlmbdMin:               #         -l  "lambda\nmin [Ang]"           "minimal wavelength to be taken into account"
      type:    "float" 
      descr:   "lambda\nmin [Ang]"
      tooltip: "minimal wavelength to be taken into account"
      column:  0                     
      prefix:  "-l"   

  - FlmbdMax:               #         -L  "lambda\nmax [Ang]"           "maximal wavelength to be taken into account"
      type:    "float" 
      descr:   "lambda\nmax [Ang]"
      tooltip: "maximal wavelength to be taken into account"
      column:  1                     
      prefix:  "-L"
   
  - FwidtMin:               #         -u  "y-pos\nmin [cm]"             "minimal horizontal position to be taken into account"
      type:    "float" 
      descr:   "y-pos\nmin [cm]"
      tooltip: "minimal horizontal position to be taken into account"
      column:  0                     
      prefix:  "-u"   

  - FwidtMax:               #         -U  "y-pos\nmax [cm]"             "maximal horizontal position to be taken into account"
      type:    "float" 
      descr:   "y-pos\nmax [cm]"
      tooltip: "maximal horizontal position to be taken into account"
      column:  1                     
      prefix:  "-U"   

  - FhiteMin:               #         -v  "z-pos\nmin [cm]"             "minimal vertical position to be taken into account"
      type:    "float" 
      descr:   "z-pos\nmin [cm]"
      tooltip: "minimal vertical position to be taken into account"
      column:  0                     
      prefix:  "-v"   

  - FhiteMax:               #         -V  "z-pos\nmax [cm]"             "maximal vertical position to be taken into account"
      type:    "float" 
      descr:   "z-pos\nmax [cm]"
      tooltip: "maximal vertical position to be taken into account"
      column:  1                     
      prefix:  "-V"   

