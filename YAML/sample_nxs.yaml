#description of input fields
# type: title, file, string, float, int, switch (NO (default),YES), combo (for selection list)
# descr: description of the parameter lable
# tooltip: detailed description shown when mouse cursor remains over label
# default: optional default value for parameter
# min: optional minimum value
# max: optional maximum value
# column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
# prefix: prefix for parameter in pipe
sample_nxs:
  - Name    : 
      type:    "string" 
      descr:   "name" 

  - ParFile :                  # -S         [-]    parameter file name 
      type:    "file"    
      descr:   "nxs parameter file"
      tooltip: "File containing parameters of the powder sample\nSee HelpFile 'sample.html'"
      prefix:  "-S"     
  - StrFile :                  # -s           nxs structure factor file name (of the sample material)
      type:    "file"     
      descr:   "structure factor\nfile"
      tooltip: "nxs structure factor file name (of the sample material)"
      prefix:  "-s"     

  - nRepete  :                 # -A    1    [-]    repetitions (number of trajectories generated per incoming trajectory for each structure factor)
      type:    "int" 
      descr:   "repetitions" 
      min:     1
      default: 1
      tooltip: "repetitions (number of trajectories generated per incoming trajectory\nfor each structure factor)"
      column:  0                     
      prefix:  "-A"     
  - nColor  :                 # -c          colour of the neutrons scattered from the environment
      type:    "int" 
      descr:   "colour" 
      min:     -1
      tooltip: "colour of the neutrons scattered from the sample"
      column:  1                     
      prefix:  "-c"     

  - bIncScat:                # -I   NO      flag: incoherent scattering (YES  NO)  
      type:    "switch" 
      descr:   "incoherent scattering"
      tooltip: "flag incoherent scattering (YES  NO)"
      prefix:  "-I"     
      default: [NO, YES]
      column:  0                     
  - bTrtAll :                # -a   NO      flag: neutrons not hitting the sample are treated  (YES  NO) 
      type:    "switch" 
      descr:   "treat all neutrons"
      tooltip: "flag neutrons not hitting the sample are treated"
      prefix:  "-a"     
      default: [NO, YES]
      column:  1                     
  - bOnlyT  :                # -T   NO      flag: shall only transmission (imaging) be treated (YES) or scattering also (NO)
      type:    "switch" 
      descr:   "transmission only"
      tooltip: "flag shall only transmission (imaging) be treated (YES)\nor scattering also (NO)"
      prefix:  "-T"     
      default: [NO, YES]
      column:  2                     

  - Theta   :                 # -D  90.0 [deg]   these angles determine orientation and range in which neutrons are scattered
      type:    "float" 
      descr:   "theta [deg]"
      tooltip: "these angles determine orientation and range in which neutrons are scattered"
      default: 90.0
      min:     0.0
      column:  0                     
      prefix:  "-D"     
  - DelTheta:                 # -d   90.0 [deg]     Theta has to be in the range of [0°,180°]         
      type:    "float" 
      descr:   "dtheta (deg]"
      tooltip: "theta has to be in the range of [0°,180°]"
      min:     0.0
      max:     180.0
      default: 90.0
      column:  1                     
      prefix:  "-d"     
  - Phi     :                # -P  180.0 [deg]     Phi has to be in the range of   [0°,360°] 
      type:    "float" 
      descr:   "phi [deg]"
      min:     0.0
      max:     360.0
      default: 180.0
      tooltip: "phi has to be in the range of   [0°,360°]"
      column:  2                     
      prefix:  "-P"  
  - DelPhi  :                # -p  180.0 [deg]     Example: 30°- 170° scattering angle to the right, +/- 15° in height 
      type:    "float" 
      descr:   "dphi [deg]"
      min:     0.0
      max:     360.0 
      default: 180.0 
      tooltip: "Example  30°- 170° scattering angle to the right,\n+/- 15° in height"
      column:  0                     
      prefix:  "-p"     
                    
  - Title: 
      type:    "title"    
      default: "Sample"
  - PosX:                    # -X 0.0  [cm]   center x position of the sample
      type:    "float" 
      descr:   "x [cm]"
      tooltip: "center x position of the sample"
      default: 0.0
      prefix:  "-x"     
      column:  0                     
  - PosY:                    # -Y 0.0  [cm]   center y position of the sample 
      type:    "float" 
      descr:   "y [cm]"
      tooltip: "center y position of the sample"
      default: 0.0
      prefix:  "-y"     
      column:  1                     
  - PosZ:                    # -Z 0.0  [cm]   center z position of the sample 
      type:    "float" 
      descr:   "z [cm]"
      tooltip: "center z position of the sample"
      default: 0.0
      prefix:  "-z"     
      column:  2  

  -  SmplGeom:               # enum sample geometry: CYLINDER  SPHERE  CUBOID  HOLLOW_CYLINDER
      type:    "combo" 
      descr:   "sample\ngeometry"
      tooltip: "sample geometry  CYLINDER  SPHERE  CUBOID  HOLLOW_CYLINDER RECTANGULAR"
      default: [cylinder, sphere, cuboid, hollow-cylinder, rectangular]
      prefix:  "-G"     
      column:  0 
                   
  - SizePar1:                # -e 0.0  [cm]   thickness of cuboid or (outer) diameter of sphere or cylinder
      type:    "float" 
      descr:   "thickness or\ndiameter [cm]"
      tooltip: "thickness of cuboid or (outer) diameter of sphere or cylinder"
      min:     0.0001
      default: 0.5
      prefix:  "-t"     
      column:  0                     
  - Height:                  # -H 0.0  [cm]   height of cuboid or cylinder
      type:    "float" 
      descr:   "height [cm]"
      tooltip: "height of cuboid or cylinder"
      min:     0.0
      default: 2.0
      prefix:  "-h"     
      column:  1                      
  -  Width:                  # -W 0.0  [cm]   width of cuboid or inner diameter of a hollow cylinder 
      type:    "float" 
      descr:   "inner diameter\nor width [cm]"
      tooltip: "width of cuboid or inner diameter of a hollow cylinder"
      min:     0.0
      default: 0.0
      prefix:  "-w"     
      column:  2                     

  - DirX:                    # -x 0.0  [cm]   x-component of the sample orientation 
      type:    "float" 
      descr:   "x direction [cm]"
      tooltip: "x-component of the sample orientation"
      default: 0.0
      prefix:  "-X"     
      column:  0                     
  - DirY:                    # -y 0.0  [cm]   y-component of the sample orientation 
      type:    "float" 
      descr:   "y direction [cm]"
      tooltip: "y-component of the sample orientation"
      default: 0.0
      prefix:  "-Y"     
      column:  1                     
  - DirZ:                     # -z 0.0  [cm]   z-component of the sample orientation
      type:    "float" 
      descr:   "z direction [cm]"
      tooltip: "z-component of the sample orientation"
      default: 0.0
      prefix:  "-Z"     
      column:  2                     


