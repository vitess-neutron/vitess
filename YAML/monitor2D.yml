monitor2D:
   # input parameters
   Name    :  "PSDAtSample"   #                  name of the component
   MonFile :  "sample.pos"    # -O "NoFile" [-]  common part of the output file names, up to 3 files possible with x-parameter A, B and C
   IdParA  :   POS_Y          # -X  -1    [-]    parameter A to be shown on the x axis 
   nBinParA:  100             # -x   0    [-]    number of x bins 
   MinParA :   -2.5           # -w  -1   [var]   minimum x value 
   MaxParA :    2.5           # -W  -1   [var]   maximum x value 
   IdParB  :   POS_Z          # -Y  -1    [-]    parameter B to be shown on the x axis 
   nBinParB:  100             # -y   0    [-]    number of x bins 
   MinParB :   -2.5           # -f  -1   [var]   minimum x value 
   MaxParB :    2.5           # -F  -1   [var]   maximum x value 
   bProbWt :   YES            # -p  YES   [-]    use eigher actual probability of trajectories or 1 for all trajectories
   bExclude:   NO             # -e  NO    [-]    do not forward neutrons to the pipe that do not contribute to the monitor data
   eFormat :   XYZ            # -F MATRIX [-]    format for output file: MATRIX (2 dim.), XYZ (3 columns)
  
   # optional input parameters (filters and polarisation analysis)
   LmbdMin :    1.0           # -l  -1.0 [Ang]   minimum wavelength, filter for the monitor
   LmbdMax :    4.0           # -L  -1.0 [Ang]   maximum wavelength, filter for the monitor
   IdFilt1 :   -1             # -I  -1    [-]    filter parameter 1
   IdFilt2 :   -1             # -J  -1    [-]    filter parameter 2
   FiltComb:   -1             # -C  -1    [-]    filter 1 and 2 combined with AND or OR
   MinFilt1:   -1.0           # -u  -1.0 [var]   minimum value of parameter 1, additional filter for the monitor
   MaxFilt1:   -1.0           # -U  -1.0 [var]   minimum value of parameter 1, additional filter for the monitor
   MinFilt2:   -1.0           # -v  -1.0 [var]   maximum value of parameter 2, additional filter for the monitor
   Maxfilt2:   -1.0           # -V  -1.0 [var]   maximum value of parameter 2, additional filter for the monitor
  
   bPolAna :   NO             # -P  NO    [-]    switched on if polarisation analysis desired
   PolDirX :    0.0           # -r   0.0  [-]    x-component of the polarisation analysis vector
   PolDirY :    0.0           # -s   0.0  [-]    y-component polarisation analysis vector
   PolDirZ :    0.0           # -t   0.0  [-]    z-component polarisation analysis vector
