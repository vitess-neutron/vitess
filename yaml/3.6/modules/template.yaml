template:
  executable: "template"
  label: "template"
  category: "new_module"

  parameters:
  - name: "tmpt_fname"
    type: "file"
    plottable: false
    editable: false
    label: "file"
    tooltip: "name of the .... file"
    default: "file.dat"
    column: 0
    prefix: "-F"

  - name: "tmpt_nitem"
    type: "int"
    label: "number of items"
    tooltip: "Description of the number of items"
    default: 1
    column: 0
    prefix: "-n"
    min: 1
    max: 100

  - name: "tmpt_nvals"
    type: "int"
    label: "number of values"
    tooltip: "Description of the number of values"
    default: 1
    column: 1
    prefix: "-N"
    min: 1

  - name: "tmpt_flag1"
    type: "bool"
    label: "Boolean Switch"
    tooltip: "Flag 1: Description of Switch 1"
    default: false
    column: 0
    prefix: "-a"

  - name: "Title_param"
    type: "title"
    label: "Dimension"

  - name: "tmpt_par_a"
    type: "float"
    label: "par A [unit]"
    tooltip: "Description of parameter A"
    default: 1.0
    column: 0
    prefix: "-A"

  - name: "tmpt_par_b"
    type: "float"
    label: "par B [unit]"
    tooltip: "Description of parameter B"
    column: 1
    prefix: "-B"

  - name: "tmpt_dist"
    type: "float"
    label: "distance to device [cm]"
    tooltip: "Distance from the origin to the device (along the x-axis)"
    default: 1.0
    column: 2
    prefix: "-D"

  - name: "tmpt_dir"
    label: "axis"
    tooltip: "axis of .... direction"
    <<: *VtAxis
    options: ["NO_AXIS", "X_AXIS", "Y_AXIS", "Z_AXIS"]
    default: "NO_AXIS"
    column: 0
    prefix: "-Q"
