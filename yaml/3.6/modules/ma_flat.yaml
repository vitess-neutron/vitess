ma_flat:
  executable: "monochr_analyser"
  label: "ma_flat"
  category: "monochr_analyser"

  parameters:
  - name: "option"
    type: int
    label: "Type of crystal simulation"
    tooltip: "1: Crystal_flat, 2: Crystal_focus, 3: Crystal_focus_dat"
    hidden: true
    min: 1
    max: 3
    default: 1
    prefix: "-O"

  - name: "Title_param"
    type: "title"
    label: "Monochromator Analyser"

  - name: "parfile"
    type: "file"
    label: "parameter file"
    default: "crys.par"
    plottable: false
    editable: true
    tooltip: "This files contains parameters describing a crystal element (CE)"
    prefix: "-P"
    access: "r"
    category: "crs"
    required: true

  - name: "reprate"
    type: "int"
    label: "repetition rate"
    tooltip: "If this integer > 1, the neutron is used multiple times for better statistics."
    default: 1
    column: 0
    prefix: "-A"
    min: 1
    max: 1000000

  - name: "shoriz"
    type: "float"
    label: "mosaic spread horiz. [deg]"
    tooltip: "Horizontal fwhm component of the 2-dimensional Gaussian mosaic distribution [deg]"
    default: 0.8
    column: 1
    prefix: "-m"
    min: 0

  - name: "svert"
    type: "float"
    label: "mosaic spread vert. [deg]"
    tooltip: "Vertical fwhm component of the 2-dimensional Gaussian mosaic distribution [deg]"
    default: 0.8
    column: 1
    prefix: "-M"
    min: 0

  - name: "dspread"
    type: "float"
    label: "d spread"
    tooltip: "Fwhm of the d-spacing distribution function divided by the lattice parameter under consideration. It is zero for a perfect crystal."
    default: 0.00005
    column: 2
    prefix: "-D"
    min: 0

  - name: "refl"
    type: "float"
    label: "peak reflectivity"
    tooltip: "(Experimentally determined) peak reflectivity of this monochromator."
    default: 1
    column: 0
    prefix: "-R"
    min: 1.0e-6

  - name: "dist"
    type: "int"
    label: "d-distribution"
    tooltip: "defines the d-spacing distribution function: 1: Lorentzian, 2: Gaussian"
    min: 1
    max: 2
    default: 1
    column: 0
    prefix: "-d"
