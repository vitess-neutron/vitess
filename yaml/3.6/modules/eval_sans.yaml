eval_sans:
  executable: "eval_sans"
  label: "eval_sans"
  category: "evaluation"

  parameters:
  - name: "Title_File"
    type: "title"
    label: "Output files and reference file"
  - name: "sIntensFile"
    type: "file"
    plottable: true
    editable: false
    label: "Intensity file"
    tooltip: "The output file containing the intensity distribution I(Q) at the detector (of this simulation)"
    default: "eval_sans.dat"
    prefix: "-i"
  - name: "sEvalFile"
    type: "file"
    plottable: true
    editable: false
    label: "S(Q) file"
    tooltip: "The output file containing the result S(Q) calculated from this intensity distribution and that of the reference file as S(Q) = F_norm * I_smpl(Q) / I_ref(Q)"
    default: "eval_sans.dat"
    prefix: "-S"
  - name: "sRefFile"
    type: "file"
    plottable: false
    editable: false
    label: "reference file"
    tooltip: "The input file containing the intensity distribution I(Q) at the detector for isotropic scattering  only needed for S(Q)"
    prefix: "-I"

  - name: "Title_Par"
    type: "title"
    label: "Range and parameters"
  - name: "nBins"
    type: "int"
    label: "number of bins"
    tooltip: "number of evaluation channels"
    default: 100
    min: 1
    column: 0
    prefix: "-n"
  - name: "MinX"
    type: "float"
    label: "min. value [1/Ang]"
    tooltip: "Lower bound of the evaluated Q-value interval"
    default: 0.0
    column: 1
    prefix: "-m"
  - name: "MaxX"
    type: "float"
    label: "max. value [1/Ang]"
    tooltip: "Upper bound of the evaluated Q-value interval"
    default: 10.0
    column: 2
    prefix: "-M"

  - name: "LogPct"
    type: "float"
    label: "increase to next bin [%]"
    tooltip: "Percentage p of increase to next bin p = 0: linear binning p > 0: logarithmic binning (number of bins ignored)"
    default: 0.0
    min: 0.0
    column: 0
    prefix: "-R"
  - name: "DeadSpot"
    type: "float"
    label: "dead spot [deg]"
    tooltip: "Excludes all neutrons with a scattering angle < DeadSpot"
    column: 1
    prefix: "-d"
  - name: "LambdaRef"
    type: "float"
    label: "reference wavelength [Ang]"
    tooltip: "The (average) wavelength set by velocity selector, monchromator or chopper system (NOT used for TOF option)"
    min: 0.0
    column: 2
    prefix: "-r"

  - name: "NormFact"
    type: "float"
    label: "normalization factor"
    tooltip: "The ratio of intensity of the isotropic scatterer to the SANS sample in forward direction (Q=0)"
    default: 0.1
    min: 0.0
    column: 0
    prefix: "-p"

  - name: "Title_TOF"
    type: "title"
    label: "TOF option"
  - name: "bTof"
    type: "bool"
    label: "time of flight"
    tooltip: "yes: time of flight instrument  no: instrument for continuous measurement"
    column: 0
    default: no
    prefix: "-w"
  - name: "bPathCorrect"
    type: "bool"
    label: "correct TOF to distance"
    tooltip: "yes: the distance from sample center to the position of the neutron detection is used to calculate the correct flight path  no: the given 'filght path' is used"
    column: 1
    default: yes
    prefix: "-t"

  - name: "FlyPath"
    type: "float"
    label: "flight path [cm]"
    tooltip: "Nominal length of the neutron flight path from origin to detector (for TOF option)"
    min: 0.0
    column: 0
    prefix: "-l"
  - name: "DetDist"
    type: "float"
    label: "sample-detector distance [cm]"
    tooltip: "Nominal distance from sample to detector (for TOF option)"
    min: 0.0
    column: 1
    prefix: "-L"
  - name: "TimeOffset"
    type: "float"
    label: "time offset [ms]"
    tooltip: "Global shift of the neutron time t -> (t - TimeOffset) [ms] (for TOF option)"
    column: 2
    prefix: "-T"

  - name: "Title_Filter"
    type: "title"
    label: "Filter selection"
  - name: "FilterTimeMin"
    type: "float"
    label: "time interval begin [ms]"
    tooltip: "minimal TOF to be taken into account for evaluation (used for TOF and continuous instruments)"
    column: 0
    prefix: "-e"
  - name: "FilterTimeMax"
    type: "float"
    label: "time interval end [ms]"
    tooltip: "maximal TOF to be taken into account for evaluation (used for TOF and continuous instruments)"
    column: 1
    prefix: "-E"
  - name: "iColor"
    type: "int"
    tooltip: "Excludes all neutrons with different color from evaluation.  color=-1 means that all trajectories are regarded"
    label: "color"
    min: -1
    column: 2
    prefix: "-C"
