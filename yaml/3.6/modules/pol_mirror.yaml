pol_mirror:
  executable: "pol_mirror"
  label: "pol_mirror"
  category: "mirror"

  parameters:
  - name: "pm_ufile"
    type: "file"
    plottable: false
    editable: true
    label: "Up-reflectivity file"
    tooltip: "reflectivity data file for Up neutrons"
    default: "mirr3+.dat"
    column: 0
    prefix: "-U"

  - name: "pm_dfile"
    type: "file"
    plottable: false
    editable: true
    label: "Down-reflectivity file"
    tooltip: "reflectivity data file for Down neutrons"
    default: "mirr1.dat"
    column: 0
    prefix: "-D"

  - name: "pm_obs"
    type: "int"
    label: "mode"
    tooltip: "mode: 1: transmitted beam treated   0: reflected beam treated"
    min: 0
    max: 1
    default: 1
    column: 0
    prefix: "-T"

  - name: "Title_param"
    type: "title"
    label: "Mirror size"

  - name: "pm_dx"
    type: "float"
    label: "length [cm]"
    tooltip: "length of the polarising mirror (along beam axis)"
    default: 60
    column: 0
    prefix: "-L"
    min: 1.0e-6

  - name: "pm_dy"
    type: "float"
    label: "width or height [cm]"
    tooltip: "width or height of the polarising mirror"
    default: 10
    column: 1
    prefix: "-W"
    min: 1.0e-6

  - name: "Title_param"
    type: "title"
    label: "Mirror position and orientation"

  - name: "pm_x"
    type: "float"
    label: "position X [cm]"
    tooltip: "x center position of the polarizing mirror"
    default: 100
    column: 0
    prefix: "-X"

  - name: "pm_y"
    type: "float"
    label: "position Y [cm]"
    tooltip: "y center position of the polarizing mirror"
    default: 0
    column: 1
    prefix: "-Y"

  - name: "pm_z"
    type: "float"
    label: "position Z [cm]"
    tooltip: "z center position of the polarizing mirror"
    default: 0
    column: 2
    prefix: "-Z"

  - name: "pm_voff"
    type: "float"
    label: "inclination [deg]"
    tooltip: "rotation angle of the polarizing mirror"
    default: 1
    column: 0
    prefix: "-V"

  - name: "pm_ori"
    type: "bool"
    label: "rotated about"
    tooltip: "0: mirror is rotated about y-axis (vert. incl.), 1: z-axis (hor. decl.)"
    min: 0
    max: 1
    default: 0
    column: 0
    prefix: "-O"

  - name: "Title_param"
    type: "title"
    label: "Analysis direction"

  - name: "pm_ax"
    type: "float"
    label: "analysis dir. X [-]"
    tooltip: "x direction vector component of the quantization direction"
    default: 1
    column: 0
    prefix: "-a"

  - name: "pm_ay"
    type: "float"
    label: "analysis dir. Y [-]"
    tooltip: "y direction vector component of the quantization direction"
    default: 0
    column: 1
    prefix: "-b"

  - name: "pm_az"
    type: "float"
    label: "analysis dir. Z [-]"
    tooltip: "z direction vector component of the quantization direction"
    default: 0
    column: 2
    prefix: "-c"

  - name: "Title_param"
    type: "title"
    label: "Output frame"

  - name: "pm_ox"
    type: "float"
    label: "output X [cm]"
    tooltip: "x position of the output frame (in the input frame)"
    default: 200
    column: 0
    prefix: "-x"

  - name: "pm_oy"
    type: "float"
    label: "output Y [cm]"
    tooltip: "y position of the output frame (in the input frame)"
    default: 0
    column: 1
    prefix: "-y"

  - name: "pm_oz"
    type: "float"
    label: "output Z [cm]"
    tooltip: "z position of the output frame (in the input frame)"
    default: 0
    column: 2
    prefix: "-z"

  - name: "pm_r1"
    type: "float"
    label: "hor. rotation angle [deg]"
    tooltip: "rotation angle of the output frame in horizontal direction (first rotation)"
    default: 0
    column: 0
    prefix: "-h"

  - name: "pm_r2"
    type: "float"
    label: "vert. rotation angle [deg]"
    tooltip: "rotation angle of the output frame in vertical direction (second rotation)"
    default: 0
    column: 1
    prefix: "-v"
