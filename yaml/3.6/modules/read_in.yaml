read_in:
  executable: "read_in"
  label: "read_in"
  category: "event_handling"

  parameters:
  - name: "Title_Format"
    type: "title"
    label: "Format"
  - name: "ePrgFormat"
    label: "data format"
    tooltip: "data format of the program"
    <<: *VtPrgFormat
    options: ["VT_VITESS_FMT", "VT_MCSTAS_FMT", "VT_MCPL_FMT", "VT_MCNP6_FMT", "VT_SSW_FMT"]
    default: "VT_VITESS_FMT"
    column: 0
    prefix: "-f"
  - name: "eDataFormat"
    label: "storage format"
    tooltip: "format of the data to read: 'exp': scientific format,  'float': floating point  or binary  (MCPL is always binary)"
    <<: *VtDataFormat
    options: ["VT_EXPONENTIAL", "VT_FLOAT", "VT_BINARY"]
    default: "VT_FLOAT"
    column: 1
    prefix: "-F"

  - name: "Title_Input"
    type: "title"
    label: "Input files"
  - name: "sFile1"
    type: "file"
    plottable: false
    editable: true
    label: "ASCII input file 1"
    tooltip: "ASCII 1st input file containing trajectories"
    prefix: "-A"
  - name: "sFile2"
    type: "file"
    plottable: false
    editable: true
    label: "ASCII input file 2"
    tooltip: "ASCII 2nd input file containing trajectories"
    prefix: "-B"
  - name: "sFile3"
    type: "file"
    plottable: false
    editable: true
    label: "ASCII input file 3"
    tooltip: "ASCII 3nd input file containing trajectories"
    prefix: "-D"
  - name: "FracSim1"
    type: "float"
    label: "weight of traj. in file 1"
    tooltip: "assuming that all input files are written after a completed simulation, the sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
    default: 1.0
    column: 0
    prefix: "-a"
  - name: "FracSim2"
    type: "float"
    label: "weight of traj. in file 2"
    tooltip: "assuming that all input files are written after a completed simulation, the sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
    default: 0.0
    column: 1
    prefix: "-b"
  - name: "FracSim3"
    type: "float"
    label: "weight of traj. in file 3"
    tooltip: "assuming that all input files are written after a completed simulation, the sum of all weights must be 1 and each weight must be proportional to the number of trajectories started"
    default: 0.0
    column: 2
    prefix: "-d"

  - name: "Title_Opt"
    type: "title"
    label: "Special options"
  - name: "nInRep"
    type: "int"
    label: "repetition"
    tooltip: "Number of times that the trajectories are read"
    default: 1
    min: 1
    column: 0
    prefix: "-R"
  - name: "nMaxTraj"
    type: "int"
    label: "max. trajectories"
    tooltip: "Maximum number of trajectories that are read."
    column: 1
    prefix: "-M"
  - name: "bRandSamp"
    label: "Sample randomly"
    tooltip: "Sub-samples a VITESS file by choosing 'max events' neutrons randomly from the input file. The random sample will be saved to ./sampleout.dat. This option requires 'max. trajectories' to be larger than 0."
    <<: *VtSampling
    options: ["NO_SAMPLING", "SAMPLING"]
    default: "NO_SAMPLING"
    column: 0
    prefix: "-J"
  - name: "WeightFact"
    type: "float"
    label: "intensity factor"
    tooltip: "The weight of each neutron trajectory (from an MCNP simulation) is multiplied by this factor to yield correct absolute source flux values: F = I_src/N_mcnp-events"
    default: 1.0
    column: 2
    prefix: "-I"

  - name: "nSurfaceID"
    type: "int"
    label: "surface ID"
    tooltip: "Only for MCNP6: If a surface ID greater -1 is given, only neutrons passing this ID are read from file."
    default: -1
    column: 2
    prefix: "-s"
  - name: "iColor"
    type: "int"
    label: "read in color"
    tooltip: "Read only events with a given color. A negative number means any color"
    default: -1
    column: 0
    prefix: "-C"

  - name: "sInstrFile"
    type: "file"
    plottable: false
    editable: true
    label: "instrument input file"
    tooltip: "Specifies the instrument file (generated as instrument.inf) of the previous part of the simulation."
    prefix: "--I"
  - name: "sTraceFile"
    type: "file"
    plottable: false
    editable: true
    label: "raytracing file"
    tooltip: "Name of the file that contains the IDs of the trajectories for tracing."
    prefix: "-T"
  - name: "eTraceMode"
    label: "raytracing mode"
    tooltip: "no tracing write a files for each traj. of interest simulation only with traj. of interest"
    <<: *VtTrace
    options: ["NO_TRACING", "WRITE_TRC_FILES", "ONLY_TRC_TRAJ"]
    default: "NO_TRACING"
    column: 0
    prefix: "-t"
