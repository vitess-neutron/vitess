monitorpol_pos:
  executable: "monitorpol_pos"
  label: "monitorpol_pos"
  category: "monitor"

  parameters:
  - name: "sMonFile"
    type: "file"
    plottable: true
    editable: false
    label: "monitor file"
    tooltip: "monitor output file containing intensity as a function of y- and z-position"
    default: "p_pos.dat"
    prefix: "-O"

  - name: "min_y"
    type: "float"
    label: "minimal y-value [cm]"
    tooltip: ""
    default: -6
    column: 0
    prefix: "-w"

  - name: "min_z"
    type: "float"
    label: "minimal z-value [cm]"
    tooltip: ""
    default: -6
    column: 1
    prefix: "-h"

  - name: "max_y"
    type: "float"
    label: "maximal y-value [cm]"
    tooltip: ""
    default: 6
    column: 0
    prefix: "-W"

  - name: "max_z"
    type: "float"
    label: "maximal z-value [cm]"
    tooltip: ""
    default: 6
    column: 1
    prefix: "-H"

  - name: "number_ybins"
    type: "int"
    label: "number of y-bins"
    tooltip: "number of bins within the horizontal range, max. 1000"
    default: 100
    column: 0
    prefix: "-y"
    min: 1
    max: 1000

  - name: "number_zbins"
    type: "int"
    label: "number of z-bins"
    tooltip: "number of bins within the vertical range, max. 1000"
    default: 100
    column: 1
    prefix: "-z"
    min: 1
    max: 1000

  - name: "Title_Opt"
    type: "title"
    label: "Options"
  - name: "bProbWeight"
    type: "bool"
    label: "probability weight"
    tooltip: "yes: the beam intensity is monitored  no: the number of trajectories is monitored"
    default: yes
    column: 0
    prefix: "-p"
  - name: "bExcl"
    type: "bool"
    label: "exclusive counts"
    tooltip: "yes: only trajctories meeting the monitor conditions are written  no: all trajctories are written"
    default: no
    column: 1
    prefix: "-e"
  - name: "eFormat"
    label: "file format"
    tooltip: "file format for output: matrix: 2D matrix   xyz: 3 columns x, y, f(x,y);  compact: only 1 line of header, minimal number of digits.  integer: integer numbers rounded from calculated intensity"
    <<: *VtFormat2D
    options: ["MATRIX","XYZ","MATR_CMPT","XYZ_CMPT","MATR_INT"]
    default: "MATRIX"
    column: 2
    prefix: "-F"

  - name: "Title_Filter"
    type: "title"
    label: "Filter selection"
  - name: "FilterMinLambda"
    type: "float"
    label: "filter lambda min [Ang]"
    tooltip: "minimal wavelength to be taken into account"
    column: 0
    prefix: "-l"
  - name: "FilterMaxLambda"
    type: "float"
    label: "filter lambda max [Ang]"
    tooltip: "maximal wavelength to be taken into account"
    column: 1
    prefix: "-L"

  - name: "Title_param"
    type: "title"
    label: "Analysis direction"

  - name: "dirx"
    type: "float"
    label: "direction X"
    tooltip: "x component of the direction vector representing the quantization direction"
    default: 1
    column: 0
    prefix: "-r"

  - name: "diry"
    type: "float"
    label: "direction Y"
    tooltip: "y component of the direction vector representing the quantization direction"
    default: 0
    column: 1
    prefix: "-s"

  - name: "dirz"
    type: "float"
    label: "direction Z"
    tooltip: "z component of the direction vector representing the quantization direction"
    default: 0
    column: 2
    prefix: "-t"
