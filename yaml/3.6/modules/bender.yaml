bender:
  executable: "bender"
  label: "bender"
  category: "guide"

  parameters:
  - name: "Title_param"
    type: "title"
    label: "Bender geometry characteristic"

  - name: "enter_height"
    type: "float"
    label: "entrance height [cm]"
    tooltip: "entrance of guide: height in cm (center of entrance window = origin)"
    default: 10
    column: 0
    prefix: "-h"
    min: 1.0e-6

  - name: "exit_height"
    type: "float"
    label: "exit height [cm]"
    tooltip: "exit of guide: height in cm (center of exit window = new origin)"
    default: 10
    column: 1
    prefix: "-H"
    min: 1.0e-6

  - name: "swidth"
    type: "float"
    label: "blade width [cm]"
    tooltip: "thickness of material dividing the guide/bender into channels"
    default: 0
    column: 2
    prefix: "-s"
    min: 0

  - name: "len_guide"
    type: "float"
    label: "length [cm]"
    tooltip: "length of a guide [cm]. Specify either length or filename."
    default: 100
    column: 0
    prefix: "-l"
    min: 1.0e-6

  - name: "curvrad"
    type: "float"
    label: "radius of curvature [cm]"
    tooltip: " radius of curvature of base circle-axis of bender(if zero - straight line)"
    default: 0
    column: 1
    prefix: "-R"
    min: 0

  - name: "Title_param"
    type: "title"
    label: "Reflectivity values for spin up"

  - name: "mLeftUp"
    type: "float"
    label: "left plane"
    tooltip: "Reflectivity of the left plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    column: 0
    prefix: "-b"

  - name: "mRightUp"
    type: "float"
    label: "right plane"
    tooltip: "Reflectivity of the right plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    column: 1
    prefix: "-B"

  - name: "mTopUp"
    type: "float"
    label: "top/bottom plane"
    tooltip: "Reflectivity of the top plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    column: 2
    prefix: "-d"

  - name: "Title_param"
    type: "title"
    label: "Reflectivity values for spin down"

  - name: "mLeftDo"
    type: "float"
    label: "left plane"
    tooltip: "Reflectivity of the left plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    column: 0
    prefix: "-e"

  - name: "mRightDo"
    type: "float"
    label: "right plane"
    tooltip: "Reflectivity of the right plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    column: 1
    prefix: "-E"

  - name: "mTopDo"
    type: "float"
    label: "top/bottom plane"
    tooltip: "Reflectivity of the top plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    column: 2
    prefix: "-f"

  - name: "Title_param"
    type: "title"
    label: "Reflectivity files for spin up"

  - name: "lrefl_filename"
    type: "file"
    plottable: false
    editable: true
    label: "left plane"
    tooltip: "Reflectivity file for left plane (where y>0) and spin is up"
    default: "mirr0.dat"
    column: 0
    prefix: "-i"

  - name: "rrefl_filename"
    type: "file"
    plottable: false
    editable: true
    label: "right plane"
    tooltip: "Reflectivity file for right plane (where y<0) and spin is up"
    default: "mirr2linear.dat"
    column: 0
    prefix: "-m"

  - name: "tbrefl_filename"
    type: "file"
    plottable: false
    editable: true
    label: "top/bot. plane"
    tooltip: "Reflectivity file for top and bottom plane and spin is up"
    default: "mirr0.dat"
    column: 0
    prefix: "-k"

  - name: "Title_param"
    type: "title"
    label: "Reflectivity files for spin down"

  - name: "dlrefl_filename"
    type: "file"
    plottable: false
    editable: true
    label: "left plane"
    tooltip: "Reflectivity file for left plane (where y>0) and spin is down"
    default: "mirr0.dat"
    column: 0
    prefix: "-I"

  - name: "drrefl_filename"
    type: "file"
    plottable: false
    editable: true
    label: "right plane"
    tooltip: "Reflectivity file for right plane (where y<0) and spin is down"
    default: "mirr0.dat"
    column: 0
    prefix: "-M"

  - name: "dtbrefl_filename"
    type: "file"
    plottable: false
    editable: true
    label: "top/bot. plane"
    tooltip: "Reflectivity file for top and bottom plane and spin is down"
    default: "mirr0.dat"
    column: 0
    prefix: "-K"

  - name: "Title_param"
    type: "title"
    label: "Geometrical description of bender"

  - name: "sfile"
    type: "file"
    plottable: false
    editable: true
    label: "surface file"
    tooltip: " file which describes the bender geometry"
    default: ""
    column: 0
    prefix: "-u"

  - name: "ifile"
    type: "file"
    plottable: false
    editable: true
    label: "information file"
    tooltip: " file which contains some information about the bender geometry"
    default: ""
    column: 0
    prefix: "-A"

  - name: "Title_param"
    type: "title"
    label: "Special option"

  - name: "uref"
    type: "bool"
    label: "transmitted neutrons"
    tooltip: "no: ideal absorption between bender channels, yes: unreflected neutrons pass in the next bender channel"
    default: 1
    column: 0
    prefix: "-g"

  - name: "amat"
    type: "int"
    label: "Absorption material"
    tooltip: "Attenuation of neutrons flux in the given material inside channels of bender. \"from file\" means data are read from a file specified as \"transmission file\" "
    min: 0
    max: 6
    default: 6
    column: 1
    prefix: "-c"

  - name: "amatl"
    type: "int"
    label: "left side material"
    tooltip: "Absorption material in the left side of channel. Unreflected neutrons pass in the next channel via absorbtion material in the inner(left) side of channel. \"from file\" means data are read from a file specified as \"left side file\""
    min: 0
    max: 6
    default: 1
    column: 0
    prefix: "-z"

  - name: "amatr"
    type: "int"
    label: "right side material"
    tooltip: "Absorption material in the right side of channel. Unreflected neutrons pass in the next channel via absorbtion material in the outer(right) side of channel. \"from file\" means data are read from that file specified as \"right side file\""
    min: 0
    max: 6
    default: 1
    column: 1
    prefix: "-w"

  - name: "mfile"
    type: "file"
    plottable: false
    editable: true
    label: "transmission file"
    tooltip: "File which characterizes the transmission of bender channel material. Input this file name, if \"Absorption material\" has been set to \"from file\""
    default: ""
    column: 0
    prefix: "-C"

  - name: "mfilel"
    type: "file"
    plottable: false
    editable: true
    label: "left side file"
    tooltip: "File which characterizes the transmission of material in the left side of the bender. Input this file name, if \"left side material\" has been set to \"from file\""
    default: ""
    column: 0
    prefix: "-T"

  - name: "mfiler"
    type: "file"
    plottable: false
    editable: true
    label: "right side file"
    tooltip: "File which characterizes the transmission of material in the right side of the bender. Input this file name, if \"left side material\" has been set to \"from file\""
    default: ""
    column: 0
    prefix: "-O"

  - name: "surwav"
    type: "float"
    label: "surface waviness [deg]"
    tooltip: "This parameter controls the simulation of surface waviness. This value is the maximal angle of deviation of the surface normal from the ideal normal."
    default: 0
    column: 0
    prefix: "-r"
    min: 0

  - name: "abut"
    type: "float"
    label: "abutment loss length"
    tooltip: "Neutrons that hit the surface close to one of the ends of the guide/bender (or a guide segment) are rejected."
    default: 0
    column: 1
    prefix: "-a"
    min: 0

  - name: "visu"
    type: "bool"
    label: "visualisation"
    tooltip: ""
    default: false
    column: 0
    prefix: "-y"

  - name: "visdev"
    type: "int"
    label: "visualisation device"
    tooltip: "1: display, 2: file, 3: display+file"
    default: 2
    column: 1
    prefix: "-o"

  - name: "pola"
    type: "bool"
    label: "polarisation"
    tooltip: "yes: split into spin-down and spin-up reflectivity no: spin-up reflectivity for all neutrons"
    default: false
    column: 0
    prefix: "-p"

  - name: "spiqua"
    type: "bool"
    label: "neutron spin axis"
    tooltip: "magnetic field direction: 0: axis X, 1: axis Y, 2: axis Z"
    min: 0
    max: 2
    default: 0
    column: 1
    prefix: "-V"

  - name: "geotest"
    type: "bool"
    label: "geometry test"
    tooltip: "activate/deactivates geometry test"
    default: false
    column: 0
    prefix: "-t"
