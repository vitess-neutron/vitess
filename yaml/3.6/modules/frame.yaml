frame:
  executable: "frame"
  label: "frame"
  parameters:
  - name: "Title_1"
    type: "title"
    label: "Transformation"
  - name: "eSequence"
    label: "sequence"
    tooltip: "sequence of Rotation, Translation, and Mirroring"
    <<: *VtTfmnSeq
    options: ["VT_RTM","VT_RMT","VT_TRM","VT_TMR","VT_MTR","VT_MRT"]
    default: "VT_RTM"
    column: 0
    prefix: "-S"

  - name: "Title_2"
    type: "title"
    label: "Rotation"
  - name: "RotX"
    type: "float"
    label: "rot. angle [deg] about x axis"
    tooltip: "rotation angle about Z FIRST rotation [deg] NOTE: 90deg means X+  rotated on Y+"
    default: 0.0
    column: 0
    prefix: "-A"
  - name: "RotY"
    type: "float"
    label: "rot. angle [deg] about y axis"
    tooltip: "rotation angle about Y SECOND rotation [deg] NOTE: 90deg means X+ rotated on Z+"
    default: 0.0
    column: 1
    prefix: "-V"
  - name: "RotZ"
    type: "float"
    label: "rot. angle [deg] about z axis"
    tooltip: "rotation angle about X (beam axis) THIRD rotation [deg] NOTE: 90deg means Y+  rotated on Z+"
    default: 0.0
    column: 2
    prefix: "-H"

  - name: "Title_3"
    type: "title"
    label: "Translation"
  - name: "TranslX"
    type: "float"
    label: "x [cm]"
    tooltip: "x component of translation vector [cm]"
    default: 0.0
    column: 0
    prefix: "-x"
  - name: "TranslY"
    type: "float"
    label: "y [cm]"
    tooltip: "y component of translation vector [cm]"
    default: 0.0
    column: 1
    prefix: "-y"
  - name: "TranslZ"
    type: "float"
    label: "z [cm]"
    tooltip: "z component of translation vector [cm]"
    default: 0.0
    column: 2
    prefix: "-z"

  - name: "Title_4"
    type: "title"
    label: "Mirror"
  - name: "bMirrX"
    type: "bool"
    label: "mirror at yz plane"
    tooltip: "mirror x axis (plane yz)"
    default: no
    column: 0
    prefix: "-i"
  - name: "bMirrY"
    type: "bool"
    label: "mirror at xz plane"
    default: "NO"
    tooltip: "mirror y axis (plane xz)"
    default: no
    column: 1
    prefix: "-j"
  - name: "bMirrZ"
    type: "bool"
    label: "mirror at xy plane"
    tooltip: "mirror z axis (plane xy)"
    default: no
    column: 2
    prefix: "-k"
