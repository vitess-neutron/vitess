eval_inelast:
  executable: "eval_inelast"
  label: "eval_inelast"
  category: "evaluation"

  parameters:
  - name: "Title_File"
    type: "title"
    label: "Output Files"
  - name: "sFileTof"
    # TODO name: "sFileTofUp"
    type: "file"
    label: "TOF spectrum file up"
    tooltip: "Filename for the TOF spectrum datafile of neutrons with spin up"
    default: "tofsp_up.eva"
    prefix: "-E"
    required: true
  - name: "sFileE"
    # TODO name: "sFileEUp"
    type: "file"
    label: "energy spectrum file up"
    tooltip: "Filename for the energy spectrum datafile of neutrons with spin up"
    default: "energysp_up.eva"
    prefix: "-G"
    required: true
  - name: "sFileTofDown"
    type: "file"
    label: "TOF spectrum file down"
    tooltip: "Filename for the TOF spectrum datafile of neutrons with spin down"
    default: "tofsp_down.eva"
    prefix: "-H"
    required: true
  - name: "sFileEDown"
    type: "file"
    label: "energy spectrum file down"
    tooltip: "Filename for the energy spectrum datafile of neutrons with spin down"
    default: "energysp_down.eva"
    prefix: "-T"
    required: true

  - name: "Title_Range"
    type: "title"
    label: "Range and parameters"
  - name: "eInstrGeom"
    label: "geometry"
    tooltip: "Defines geometry type of TOF instrument"
    <<: *VtInstGeom
    options: ["VT_DIRECT_GEOM", "VT_INVERT_GEOM"]
    default: "VT_DIRECT_GEOM"
    column: 0
    prefix: "-A"
    required: true
  - name: "bPathCorrect"
    type: "bool"
    label: "correct TOF to distance"
    tooltip: "yes: correct TOF for the flight path from sample center to the position of the neutron detection no: use the sum of given primary and secondary flight path"
    column: 1
    default: yes
    prefix: "-t"
    required: true

  - name: "FlightPath1"
    type: "float"
    label: "primary flight path"
    unit: "cm"
    tooltip: "Length of the neutron flight path from moderator to sample"
    min: 0.0
    column: 0
    prefix: "-a"
    required: true
  - name: "FlightPath2"
    type: "float"
    label: "secondary flight path"
    unit: "cm"
    tooltip: "Length of the neutron flight path from sample to detector"
    min: 0.0
    column: 1
    prefix: "-b"
    required: true

  - name: "LambdaRef"
    type: "float"
    label: "reference wavelength"
    unit: "Ang"
    tooltip: "Initial or final wavelength of the neutrons which is known from the experimental setup."
    min: 0.0
    column: 0
    prefix: "-c"
    required: true
  - name: "TimeOffset"
    type: "float"
    label: "time offset"
    unit: "ms"
    tooltip: "global shift of the neutron time t -> t - TimeOffset"
    column: 1
    prefix: "-d"
    required: true

  - name: "MinE"
    type: "float"
    label: "min. energy transfer"
    unit: "meV"
    tooltip: "Minimal energy transfer in which the user is interested to bin intensities"
    default: -2.0
    column: 0
    prefix: "-m"
    required: true
  - name: "MaxE"
    type: "float"
    label: "max. energy transfer"
    unit: "meV"
    tooltip: "Maximal energy transfer in which the user is interested to bin intensities"
    column: 1
    default: 2.0
    prefix: "-M"
    required: true
  - name: "nBins"
    type: "int"
    label: "number of bins"
    tooltip: "The number of time and energy channels to be considered.  Only one range needs to be given, the other range is calculated."
    default: 100
    min: 1
    column: 2
    prefix: "-C"
    required: true

  - name: "MinTime"
    type: "float"
    label: "minimal time"
    unit: "ms"
    tooltip: "Minimal TOF, in which the user is interested to bin intensities"
    column: 0
    prefix: "-e"
    required: false
  - name: "MaxTime"
    type: "float"
    label: "maximal time"
    unit: "ms"
    tooltip: "Maximal TOF, in which the user is interested to bin intensities"
    column: 1
    prefix: "-g"
    required: false
  - name: "TimeGrad"
    type: "float"
    label: "gradient of time bins"
    tooltip: "Derivative s of the time channel width in function of TOF (as described in Help|Evaluation, section 'eval_inelast', 'Expressions for TOF binning')"
    column: 2
    prefix: "-h"
    required: false

  - name: "Title_Filter"
    type: "title"
    label: "Filter selection"
  - name: "AngleCntr"
    type: "float"
    label: "angle center"
    unit: "deg"
    tooltip: "Center of the restricted horizontal range (relative to the X-axis)  cf. Help|Evaluation, section 'eval_inelast'"
    column: 0
    prefix: "-j"
    required: false
  - name: "AngleRange"
    type: "float"
    label: "angle range"
    unit: "deg"
    tooltip: "Restriction to horizontal angles [center - range, center + range]  cf. Help|Evaluation, section 'eval_inelast'"
    column: 1
    prefix: "-k"
    required: false
  - name: "iColor"
    type: "int"
    label: "color"
    tooltip: "Excludes all neutrons with different color from evaluation.  color=-1 means that all trajectories are regarded  "
    column: 2
    min: -1
    default: -1
    prefix: "-f"
    required: false
