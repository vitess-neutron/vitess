mon1_z:
  executable: "monitor1"
  label: "mon1_z"
  category: "monitor"

  parameters:
  - <<: *monitor_eMonPar
    default: "MON_Z"
  - <<: *monitor_sMonFile
    tooltip: "monitor output file containing intensity as a function of the vertical neutron position"
  - <<: *monitor_sRefFile
    tooltip: "Reference input file containing data to normalize the monitored position spectrum"

  - *monitor_Title_Range
  - name: "MinZ"
    type: "float"
    label: "min. vert. positon"
    unit: "cm"
    tooltip: "lower bound value of the monitored vertical position negative values: below the beamline, positive values: above the beamline"
    default: 0.0
    column: 0
    prefix: "-m"
    required: true
  - name: "MaxZ"
    type: "float"
    label: "max. vert. positon"
    unit: "cm"
    tooltip: "upper bound value of the monitored vertical position negative values: below the beamline, positive values: above the beamline"
    column: 1
    default: 10.0
    prefix: "-M"
    required: true
  - *monitor_nBins

  - *monitor_Title_Opt
  - *monitor_iColor
  - *monitor_bAllFile

  - *monitor_bProbWeight
  - *monitor_bExcl
  - *monitor_eMonNorm

  - *monitor_Title_Filter
  - *monitor_FilterMinLambda
  - *monitor_FilterMaxLambda
  - *monitor_FilterMinTime
  - *monitor_FilterMaxTime
  - *monitor_FilterMinY
  - *monitor_FilterMaxY
