mirror_elliptical:
  executable: "mirror_elliptical"
  label: "mirror_elliptical"
  category: "mirror"

  parameters:
    # TODO parameter names (pmy for X_MAX???)
  - name: "Title_Geometry"
    type: "title"
    label: "Geometry description of the elliptic mirror"
  - name: "fx"
    type: "float"
    label: "Semi axis X"
    unit: "cm"
    tooltip: "Semi axis X for elliptic mirror"
    column: 0
    min: 0
    default: 250
    prefix: "-a"
  - name: "fy"
    type: "float"
    label: "Semi axis Y"
    unit: "cm"
    tooltip: "Semi axis Y for elliptic mirror"
    column: 1
    min: 1.0e-6
    default: 50
    prefix: "-b"
  - name: "fz"
    type: "float"
    label: "Semi axis Z"
    unit: "cm"
    tooltip: "Semi axis Z for elliptic mirror"
    column: 2
    min: 1.0e-6
    default: 50
    prefix: "-c"
  - name: "px"
    type: "float"
    label: "Center position main X"
    unit: "cm"
    tooltip: "Center position of the elliptic mirror"
    column: 0
    default: 250
    prefix: "-d"
  - name: "py"
    type: "float"
    label: "Center position main Y"
    unit: "cm"
    tooltip: "Center position of the elliptic mirror"
    column: 1
    default: 0
    prefix: "-e"
  - name: "pz"
    type: "float"
    label: "Center position main Z"
    unit: "cm"
    tooltip: "Center position of the elliptic mirror"
    column: 2
    default: 0
    prefix: "-k"
  - name: "ang"
    type: "float"
    label: "Rotation angle"
    unit: "deg"
    tooltip: "Rotate mirror (ONLY) around the center of the ellipsoide"
    column: 0
    default: 0
    prefix: "-Q"
  - name: "ake"
    # TODO mapping
    type: "int"
    label: "Rotate around the axis"
    tooltip: "axis of rotation of the mirror  (0: X  1: Y  2: Z)"
    column: 1
    min: 0
    max: 2
    default: 0
    prefix: "-g"

  - name: "Title_Limits"
    type: "title"
    label: "X, Y and Z Limits for the elliptic mirror"
  - name: "pmx"
    type: "float"
    label: "X_MIN"
    unit: "cm"
    tooltip: "X minimum limitation for the elliptic mirror"
    column: 0
    default: 100
    prefix: "-A"
  - name: "pmz"
    type: "float"
    label: "Y_MIN"
    unit: "cm"
    tooltip: "Y minimum limitation for the elliptic mirror"
    column: 1
    default: 20
    prefix: "-D"
  - name: "pmt"
    type: "float"
    label: "Z_MIN"
    unit: "cm"
    tooltip: "Z minimum limitation for the elliptic mirror"
    column: 2
    default: -30
    prefix: "-H"
  - name: "pmy"
    type: "float"
    label: "X_MAX"
    unit: "cm"
    tooltip: "X maximum limitation for the elliptic mirror"
    column: 0
    default: 400
    prefix: "-C"
  - name: "pmw"
    type: "float"
    label: "Y_MAX"
    unit: "cm"
    tooltip: "Y maximum limitation for the elliptic mirror"
    column: 1
    default: 50
    prefix: "-E"
  - name: "pmk"
    type: "float"
    label: "Z_MAX"
    unit: "cm"
    tooltip: "Z maximum limitation for the elliptic mirror"
    column: 2
    default: 30
    prefix: "-K"

  - name: "Title_Output"
    type: "title"
    label: "Output Plane"
  - name: "ox"
    type: "float"
    label: "output X"
    unit: "cm"
    tooltip: "position of the output frame (in the input frame)"
    column: 0
    default: 500
    prefix: "-s"
  - name: "oy"
    type: "float"
    label: "output Y"
    unit: "cm"
    tooltip: "position of the output frame (in the input frame)"
    column: 1
    default: 0
    prefix: "-t"
  - name: "oz"
    type: "float"
    label: "output Z"
    unit: "cm"
    tooltip: "position of the output frame (in the input frame)"
    column: 2
    default: 0
    prefix: "-w"

  - name: "Title_Visualisation"
    type: "title"
    label: "Visualisation"
  - name: "visu"
    type: "bool"
    label: "Activate visualisation"
    tooltip: "activate visualisation"
    column: 0
    default: true
    prefix: "-y"
  - name: "visuty"
    # TODO mapping
    type: "int"
    label: "Type of visualisation"
    tooltip: "visualisation plane (0: XZ  1: XY  2: YZ)"
    column: 1
    min: 0
    max: 2
    default: 0
    prefix: "-Y"
  - name: "visual"
    type: "bool"
    label: "Full visualisation"
    tooltip: "Visualisation all neutrons paths or only refleted neutrons from mirror"
    column: 2
    default: false
    prefix: "-v"
  - name: "visualty"
  # TODO mapping
    type: "int"
    label: "Output device (for Unix only)"
    tooltip: "for Unix/Linux: device for output (0: xwin  1: ps file)"
    column: 0
    min: 0
    max: 1
    default: 0
    prefix: "-l"

  - name: "Title_Refectivity"
    type: "title"
    label: "Reflectivity for the elliptic mirror"
  - name: "bfp"
    type: "file"
    plottable: false
    editable: true
    label: "Spin_up reflectivity file"
    tooltip: "Spin_up file reflectivity"
    default: "mirr3+.dat"
    prefix: "-i"
  - name: "bff"
    type: "file"
    plottable: false
    editable: true
    label: "Spin_down reflectivity file"
    tooltip: "Spin_down file reflectivity"
    default: "mirr3+.dat"
    prefix: "-I"

  - name: "surwav"
    type: "float"
    label: "surface waviness"
    unit: "deg"
    tooltip: "This parameter controls the simulation of surface waviness. This value is the maximal angle of deviation of the surface normal from the ideal normal."
    column: 0
    min: 0
    default: 0
    prefix: "-q"
  - name: "reflne"
    type: "bool"
    label: "Reflected neutrons"
    tooltip: "If yes is chosen, only reflected neutrons are going later, if no all neutrons are going later"
    column: 0
    default: false
    prefix: "-u"
  - name: "outkey"
    type: "bool"
    label: "Ideal reflection"
    tooltip: "Choose ideal reflection or from reflectivities files"
    column: 1
    default: true
    prefix: "-R"
  - name: "pola"
    type: "bool"
    label: "polarisation"
    tooltip: "yes: split into spin-down and spin-up reflectivity no: spin-up reflectivity for all neutrons"
    column: 2
    default: true
    prefix: "-p"

  - name: "spiqua"
    # TODO mapping
    type: "int"
    label: "neutron spin axis"
    tooltip: "spin quantisation direction: 0: axis X, 1: axis Y, 2: axis Z"
    column: 0
    min: 0
    max: 2
    default: 0
    prefix: "-V"

  - name: "Title_Air"
    type: "title"
    label: "Air Attenuation Tair=293K"
  - name: "himidi"
    type: "float"
    label: "Air Humidity"
    unit: "%"
    tooltip: "Choose himidity of air"
    column: 0
    min: 1.0e-6
    default: 55.0
    prefix: "-r"
  - name: "airact"
    type: "bool"
    label: "Air Attenuation"
    tooltip: "Activate or not the air attenuation of neutron beam, T=293K"
    column: 1
    default: false
    prefix: "-z"
