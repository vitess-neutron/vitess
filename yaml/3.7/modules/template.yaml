template:
  executable: "template"
  label: "template"
  category: "new_module"

  parameters:
    # TODO rename parameters: they should not have the tmpt_ prefix
  - name: "tmpt_fname"
    type: "file"
    plottable: false
    editable: false
    label: "file"
    tooltip: "name of the .... file"
    column: 0
    default: "file.dat"
    prefix: "-F"
    required: true
  - name: "tmpt_nitem"
    type: "int"
    label: "number of items"
    tooltip: "Description of the number of items"
    column: 0
    default: 1
    min: 1
    max: 100
    prefix: "-n"
    required: true
  - name: "tmpt_nvals"
    type: "int"
    label: "number of values"
    tooltip: "Description of the number of values"
    column: 1
    min: 1
    default: 1
    prefix: "-N"
    required: true
  - name: "tmpt_flag1"
    type: "bool"
    label: "Boolean Switch"
    tooltip: "Flag 1: Description of Switch 1"
    column: 0
    default: false
    prefix: "-a"
    required: true

  - name: "Title_Dimension"
    type: "title"
    label: "Dimension"
  - name: "tmpt_par_a"
    type: "float"
    label: "par A"
    unit: "unit"
    tooltip: "Description of parameter A"
    column: 0
    default: 1.0
    prefix: "-A"
    required: false
  - name: "tmpt_par_b"
    type: "float"
    label: "par B"
    unit: "unit"
    tooltip: "Description of parameter B"
    column: 1
    prefix: "-B"
    required: false
  - name: "tmpt_dist"
    type: "float"
    label: "distance to device"
    unit: "cm"
    tooltip: "Distance from the origin to the device (along the x-axis)"
    column: 2
    default: 1.0
    prefix: "-D"
    required: false
  - name: "tmpt_dir"
    <<: *VtAxis
    label: "axis"
    tooltip: "axis of .... direction"
    column: 0
    options: ["NO_AXIS", "X_AXIS", "Y_AXIS", "Z_AXIS"]
    default: "NO_AXIS"
    prefix: "-Q"
    required: true
