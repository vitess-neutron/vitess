mon2_rdiv:
  executable: "mon2_rdiv"
  label: "mon2_rdiv"
  category: "monitor"

  parameters:
  - <<: *monitor_sMonFile
    tooltip: "The monitor output file contains intensity, its variation and the number of trajectories as a function of the chosen parameter"
    default: "wl_div.dat"

  - name: "min_y"
    # TODO name mismatch
    # name: "MinY"
    type: "float"
    label: "minimal radius"
    unit: "cm"
    tooltip: ""
    default: 0.0
    column: 0
    prefix: "-w"
    min: 0
    required: true
  - name: "max_y"
    # TODO name mismatch
    # name: "MaxY"
    type: "float"
    label: "maximal radius"
    unit: "cm"
    tooltip: ""
    default: 2.0
    column: 1
    prefix: "-W"
    min: 0
    required: true
  - <<: *monitor_nBinsY
    # TODO name mismatch
    name: "number_ybins"
    default: 100
    max: 1000

  - name: "min_z"
    # TODO name mismatch
    # name: "MinZ"
    type: "float"
    label: "minimal rdiv-value"
    unit: "deg"
    tooltip: ""
    default: 0.0
    column: 0
    prefix: "-h"
    required: true
  - name: "max_z"
    # TODO name mismatch
    # name: "MaxZ"
    type: "float"
    label: "maximal rdiv-value"
    unit: "deg"
    tooltip: ""
    default: 1.0
    column: 1
    prefix: "-H"
    required: true
  - <<: *monitor_nBinsZ
    # TODO name mismatch
    name: "number_zbins"
    default: 100
    max: 1000

  - *monitor_bProbWeight
  - *monitor_bExcl
  - *monitor_eFormat

  - *monitor_Title_Filter
  - *monitor_FilterMinLambda
  - *monitor_FilterMaxLambda
  - *monitor_FilterMinY_2D
  - *monitor_FilterMaxY_2D
  - *monitor_FilterMinZ_2D
  - *monitor_FilterMaxZ_2D
