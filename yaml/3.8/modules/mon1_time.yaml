mon1_time:
  executable: "monitor1"
  label: "mon1_time"
  category: "monitor"

  parameters:
  - <<: *monitor_eMonPar
    default: "MON_TIME"
  - <<: *monitor_sMonFile
    tooltip: "monitor output file containing intensity as a function of the time-of flight of the neutron"
  - <<: *monitor_sRefFile
    tooltip: "Reference input file containing data to normalize the monitored TOF spectrum"

  - *monitor_Title_Range
  - name: "MinTime"
    type: "float"
    label: "min. time"
    unit: "ms"
    tooltip: "lower bound value of the monitored time-of-flight"
    default: 0.0
    column: 0
    prefix: "-m"
    required: true
  - name: "MaxTime"
    type: "float"
    label: "max. time"
    unit: "ms"
    tooltip: "upper bound value of the monitored time-of-flight"
    column: 1
    default: 10.0
    prefix: "-M"
    required: true
  - *monitor_nBins

  - *monitor_Title_Opt
  - *monitor_iColor
  - *monitor_bAllFile

  - *monitor_bProbWeight
  - *monitor_bExcl
  - *monitor_eMonNorm

  - *monitor_Title_Filter
  - *monitor_FilterMinLambda
  - *monitor_FilterMaxLambda
  - *monitor_FilterMinY
  - *monitor_FilterMaxY
  - *monitor_FilterMinZ
  - *monitor_FilterMaxZ
