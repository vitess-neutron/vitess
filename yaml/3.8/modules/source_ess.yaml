source_ess:
  executable: "source"
  label: "source_ess"
  category: "source"
  parameters:
  - <<: *source_eSrcKind
    default: "SRC_ESS"
  - <<: *source_eSrcType
    hidden: true
    default: "LPSS"
  - <<: *source_eSrcName
    hidden: true
    default: "ESS"

  - *source_Title_Sim
  - *source_nBunches
  - *source_nTraj
  - *source_sSimName
  - *source_MinLambda
  - *source_MaxLambda
  - *source_MinTime
  - *source_MaxTime

  - name: "Title_Mod"
    type: "title"
    label: "Source and moderator parameters"
  - name: "eDataVsn"
    label: "data base"
    tooltip: "version of the data base"
    <<: *EssModVsn
    options: ["MEZEI_2001", "ZANINI_2012", "SCHOENFELDT_2013", "VARHEIGHT_2013", "BUTTERFLY2_2015", "BUTTERFLY1_2016"]
    default: "BUTTERFLY1_2016"
    column: 2
    prefix: "-v"
    required: true
  - <<: *source_Freq
    default: 14
  - *source_PulseLen
  - *source_SrcPower

  - name: "sBeamline"
    type: "string"
    label: "beamline"
    tooltip: "name of the beamline"
    column: 0
    prefix: "-B"
    required: false
  - *source_ModDecl

  - name: "wModWnd"
    label: "moderator window 1"
    tooltip: "parameters describing geometry and characteristics of a moderator are given on a separate window"
    max: 10
    column: 0
    required: false
    <<: *moderator_ess
  - *source_sModFile

  - *source_Title_Prop
  - *source_eDirMode

  - *source_MinDivY
  - *source_MaxDivY
  - *source_MinDivZ
  - *source_MaxDivZ

  - *source_TargetDist
  - *source_TargetWidth
  - *source_TargetHeight

  - *source_Title_Time
  - *source_TofDist
  - *source_TofMin
  - *source_TofMax

  - *source_Title_Pol
  - *source_PolDirX
  - *source_PolDirY
  - *source_PolDirZ
  - *source_PolDeg

  - *source_Title_Special
  - *source_TimeMeas
  - *source_LambdaWant
  - *source_eTraceMode
  - *source_sTraceFile
