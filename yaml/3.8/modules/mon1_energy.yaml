mon1_energy:
  executable: "monitor1"
  label: "mon1_energy"
  category: "monitor"

  parameters:
  - <<: *monitor_eMonPar
    default: "MON_ENERGY"
  - <<: *monitor_sMonFile
    tooltip: "monitor output file containing intensity as a function of of the neutron energy [meV]"
  - <<: *monitor_sRefFile
    tooltip: "Reference input file containing data to normalize the monitored energy spectrum"

  - *monitor_Title_Range
  - name: "MinE"
    type: "float"
    label: "min. energy"
    unit: "meV"
    tooltip: "lower bound value of the monitored energy range"
    default: 0.0
    column: 0
    prefix: "-m"
    required: true
  - name: "MaxE"
    type: "float"
    label: "max. energy"
    unit: "meV"
    tooltip: "upper bound value of the monitored energy range"
    column: 1
    default: 10.0
    prefix: "-M"
    required: true
  - *monitor_nBins

  - *monitor_Title_Opt
  - *monitor_iColor
  - *monitor_bAllFile

  - *monitor_bProbWeight
  - *monitor_bExcl
  - *monitor_eMonNorm

  - *monitor_Title_Filter
  - *monitor_FilterMinTime
  - *monitor_FilterMaxTime
  - *monitor_FilterMinY
  - *monitor_FilterMaxY
  - *monitor_FilterMinZ
  - *monitor_FilterMaxZ
