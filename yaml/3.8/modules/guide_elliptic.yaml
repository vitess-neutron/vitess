guide_elliptic:
  executable: "guide_elliptic"
  label: "guide_elliptic"
  category: "guide"
  parameters:
  - name: "Title_Shape"
    type: "title"
    label: "Shape and size of the guide"

  - name: "keyshape_y"
    type: "int"
    label: "horizontal shape"
    tooltip: "Shape of the guide in x-y-plane. Note that in constant case entrance and exit width must be the same! 0: constant, 1: linear, 2: elliptic"
    min: 0
    max: 2
    default: 0
    column: 0
    prefix: "-H"

  - name: "keyshape_z"
    type: "int"
    label: "vertical shape"
    tooltip: "Shape of the guide in x-z-plane. Note that in constant case entrance and exit width must be the same! 0: constant, 1: linear, 2: elliptic"
    min: 0
    max: 2
    default: 0
    column: 1
    prefix: "-V"

  - name: "shape_file"
    type: "file"
    default: "guide_shape.dat"
    label: "guide shape"
    plottable: true
    editable: true
    column: 0
    prefix: "-O"
    tooltip: "File containing ellipse parameters"

  - name: "axis_long_hor"
    type: "float"
    label: "Major ellipse axis in x-y plane"
    unit: "m"
    tooltip: "Size of major ellipse axis in horizontal plane in m"
    column: 0
    prefix: "-a"
    default: 13
    min: 0

  - name: "axis_short_hor"
    type: "float"
    label: "Minor ellipse axis in x-y plane"
    unit: "m"
    tooltip: "Size of minor ellipse axis in horizontal plane in m"
    column: 1
    prefix: "-b"
    default: 0.04
    min: 0

  - name: "axis_long_ver"
    type: "float"
    default: 13
    label: "Major ellipse axis in x-z plane"
    unit: "m"
    tooltip: "Size of major ellipse axis in vertical plane in m"
    column: 0
    prefix: "-A"
    min: 0

  - name: "axis_short_ver"
    type: "float"
    default: 0.04
    label: "Minor ellipse axis in x-z plane"
    unit: "m"
    tooltip: "Size of minor ellipse axis in vertical plane in m"
    column: 1
    prefix: "-B"
    min: 0

  - name: "enter_width"
    type: "float"
    default: 6
    label: "entrance width"
    unit: "cm"
    tooltip: "Entrance of guide: width in cm (center of entrance window = origin)"
    column: 0
    prefix: "-w"
    min: 0

  - name: "enter_height"
    type: "float"
    default: 10
    label: "entrance height"
    unit: "cm"
    tooltip: "Entrance of guide: height in cm (center of entrance window = origin)"
    column: 1
    prefix: "-u"
    min: 0

  - name: "exit_width"
    type: "float"
    default: 6
    label: "exit width"
    unit: "cm"
    tooltip: "Exit of guide: width in cm (center of exit window = new origin)"
    column: 0
    prefix: "-W"
    min: 0

  - name: "exit_height"
    type: "float"
    default: 10
    label: "exit height"
    unit: "cm"
    tooltip: "Exit of guide: height in cm (center of exit window = new origin)"
    column: 1
    prefix: "-U"
    min: 0

  - name: "length_guide"
    type: "float"
    default: 25
    label: "Guide length"
    unit: "m"
    tooltip: "Length of guide in meters"
    column: 0
    prefix: "-l"
    min: 0

  - name: "dist_focus_hor"
    type: "float"
    label: "Distance from exit to focus in hor. plane"
    unit: "m"
    tooltip: "Distance from guide exit to focal point of the ellipse in horizontal plane."
    column: 1
    prefix: "-d"
    min: 0

  - name: "dist_focus_ver"
    type: "float"
    label: "Distance from exit to focus in ver. plane"
    unit: "m"
    tooltip: "Distance from guide exit to focal point of the ellipse in vertical plane."
    column: 2
    prefix: "-D"
    min: 0

  - name: "addColor"
    type: "float"
    # TODO: in code: bool changeColor
    default: 0
    label: "Add to color"
    tooltip: "Modify the color of a trajectory every time a reflection with guide walls occurs."
    column: 0
    prefix: "-C"

  - name: "Title_Shape"
    type: "title"
    label: "Guide_characteristics"

  - name: "Title_Shape"
    type: "title"
    label: "Reflectivity numbers"

  - name: "mLeft"
    type: "float"
    label: "left plane"
    unit: ""
    tooltip: "Reflectivity of the left plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    min: 0.0
    column: 0
    prefix: "-e"

  - name: "mRight"
    type: "float"
    label: "right plane"
    unit: ""
    tooltip: "Reflectivity of the right plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    min: 0.0
    column: 1
    prefix: "-E"

  - name: "mTop"
    type: "float"
    label: "top plane"
    unit: ""
    tooltip: "Reflectivity of the top plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    min: 0.0
    column: 0
    prefix: "-f"

  - name: "mBottom"
    type: "float"
    label: "bottom plane"
    unit: ""
    tooltip: "Reflectivity of the bottom plane is calculated based on the m-number given using fits to Swiss Neutronics mirror characteristics. It is not used if a reflectivity file is given for the same plane."
    default: 0
    min: 0.0
    column: 1
    prefix: "-F"

  - name: "Title_Shape"
    type: "title"
    label: "Reflectivity files"

  - name: "lrefl_filename"
    type: "file"
    label: "left plane"
    tooltip: "Reflectivity file for left plane (where y > 0)"
    plottable: false
    editable: true
    default: "mirr1a.dat"
    format: "dat"
    column: 0
    prefix: "-i"

  - name: "rrefl_filename"
    type: "file"
    label: "right plane"
    tooltip: "Reflectivity file for right plane (where y < 0)"
    plottable: false
    editable: true
    default: "mirr1a.dat"
    column: 0
    prefix: "-I"
    format: "dat"

  - name: "tbrefl_filename"
    type: "file"
    label: "top plane"
    tooltip: "Reflectivity file for top plane"
    plottable: false
    editable: true
    default: "mirr1a.dat"
    column: 0
    prefix: "-j"
    format: "dat"

  - name: "brefl_filename"
    type: "file"
    label: "bottom plane"
    tooltip: "Reflectivity file for bottom plane"
    plottable: false
    editable: true
    default: "mirr1a.dat"
    column: 0
    prefix: "-J"
    format: "dat"
