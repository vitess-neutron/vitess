prism:
  executable: "prism"
  label: "prism"
  category: "optical_elements"

  parameters:
  - name: "Title_param"
    type: "title"
    label: "Geometry description of each prism in the matrix"

  - name: "prw"
    type: "float"
    label: "Prism base width"
    unit: "cm"
    tooltip: "Dimension of each prism along the neutron beam direction x"
    default: 0.035
    column: 0
    prefix: "-b"
    min: 1.0e-6

  - name: "prh"
    type: "float"
    label: "Prism base height"
    unit: "cm"
    tooltip: "Dimension of each prism along the vertical direction z"
    default: 0.025
    column: 1
    prefix: "-h"
    min: 1.0e-6

  - name: "eaw"
    type: "float"
    label: "Prism height"
    unit: "cm"
    tooltip: "Width of each prism along the horizontal direction y"
    default: 3
    column: 2
    prefix: "-z"
    min: 1.0e-6

  - name: "Title_param"
    type: "title"
    label: "Description of the prisms matrix"

  - name: "noc"
    type: "int"
    label: "Number of columns"
    tooltip: "Number of prisms columns along the neutron beam direction x"
    default: 16
    column: 0
    prefix: "-P"
    min: 1

  - name: "nor"
    type: "int"
    label: "Number of rows"
    tooltip: "Number of vertical layers of prisms"
    default: 40
    column: 1
    prefix: "-k"
    min: 1

  - name: "Title_param"
    type: "title"
    label: "Special option"

  - name: "abs"
    type: "bool"
    label: "Layer can absorb"
    tooltip: "no: Layer absorption is neglected, yes: Non refracted neutrons pass to the next layer"
    default: true
    column: 0
    prefix: "-y"

  - name: "Title_param"
    type: "title"
    label: "Material description"

  - name: "scden"
    type: "float"
    label: "Scattering Length Density"
    unit: "10^-6 Ang^-2"
    tooltip: "Scattering length density of the material. Typical values in the range 10^-6 Å^-2"
    default: 2
    column: 0
    prefix: "-N"
    min: 1.0e-6

  - name: "sci"
    type: "float"
    label: "Incoherent c. section"
    unit: "barn"
    tooltip: "Incoherent cross section"
    default: 10
    column: 1
    prefix: "-S"
    min: 0

  - name: "sca"
    type: "float"
    label: "Absorption c. section"
    unit: "barn"
    tooltip: "Absorption cross section"
    default: 10
    column: 2
    prefix: "-s"
    min: 0

  - name: "den"
    type: "float"
    label: "Density"
    unit: "g/cm^3"
    tooltip: "Material density in"
    default: 1
    column: 0
    prefix: "-D"
    min: 1.0e-6
