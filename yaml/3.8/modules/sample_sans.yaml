sample_sans:
  executable: "sample_sans"
  label: "sample_sans"
  category: "sample"

  parameters:
  - name: "sParFile"
    type: "file"
    plottable: false
    editable: true
    label: "sample file"
    tooltip: "File containing parameters of the SANS sample These parameters are only used if they are not given as direct input parameters."
    prefix: "-S"

  - name: "MaxTheta"
    type: "float"
    label: "max. theta"
    unit: "deg"
    tooltip: "maximal deviation from the x-axis (beamline direction) into which neutrons are scattered"
    default: 10.0
    prefix: "-M"
    column: 0

  - name: "bIncohScat"
    type: "bool"
    label: "incoherent scattering"
    tooltip: "yes: activates calculation of incoherent scattering no: no incoherent scattering"
    default: no
    column: 0
    prefix: "-I"
  - name: "nRep"
    type: "int"
    label: "repetition"
    tooltip: "repetitions (number of trajectories generated per incoming trajectory)"
    min: 1
    default: 1
    column: 1
    prefix: "-A"
  - name: "iColor"
    type: "int"
    label: "colour"
    tooltip: "Colour of the neutrons scattered by the SANS sample"
    min: 0
    column: 000001
    prefix: "-c"
  - name: "bTreatAll"
    type: "bool"
    label: "treat all neutrons"
    tooltip: "no: only neutrons hitting the sample are treated yes: neutrons passing by are also treated"
    default: no
    column: 1
    prefix: "-a"

  - name: "Title"
    type: "title"
    label: "Sample position and geometry"
  - name: "PosSmplX"
    type: "float"
    label: "x"
    unit: "cm"
    tooltip: "Center position X of the SANS sample"
    default: 30.0
    column: 0
    prefix: "-x"
  - name: "PosSmplY"
    type: "float"
    label: "y"
    unit: "cm"
    tooltip: "Center position Y of the SANS sample"
    column: 1
    prefix: "-y"
  - name: "PosSmplZ"
    type: "float"
    label: "z"
    unit: "cm"
    tooltip: "center position Z of the SANS sample"
    default: 0.0
    column: 2
    prefix: "-z"

  - name: "eSmplGeom"
    <<: *VtSmplGeom
    label: "sample geometry"
    tooltip: "Shape of the sample: cylinder, sphere or cuboid (=rectangular)"
    options: ["VT_CYL", "VT_SPHERE", "VT_CUBE"]
    default: "VT_CYL"
    prefix: "-G"
    column: 0

  - name: "SmplDiam"
    type: "float"
    label: "thickness or diameter"
    unit: "cm"
    tooltip: "Thickness of a cubic sample, or diameter of spherical of cylindrical sample."
    min: 0.0001
    default: 0.2
    column: 0
    prefix: "-t"
  - name: "SmplHeight"
    type: "float"
    label: "height"
    unit: "cm"
    tooltip: Height of the SANS sample (not needed for spherical shape)"
    default: 0.5
    min: 0.0
    column: 1
    prefix: "-h"
  - name: "SmplWidth"
    type: "float"
    label: "width"
    unit: "cm"
    tooltip: "Width of a cubic SANS sample"
    default: 0.5
    min: 0.0
    column: 2
    prefix: "-w"

  - name: "SmplOrientX"
    type: "float"
    label: "x direction"
    unit: "cm"
    tooltip: "x-component of the sample orientation"
    default: 0.0
    prefix: "-X"
    column: 0
  - name: "SmplOrientY"
    type: "float"
    label: "y direction"
    unit: "cm"
    tooltip: "y-component of the sample orientation"
    default: 0.0
    prefix: "-Y"
    column: 1
  - name: "SmplOrientZ"
    type: "float"
    label: "z direction"
    unit: "cm"
    tooltip: "z-component of the sample orientation"
    default: 0.0
    prefix: "-Z"
    column: 2

  - name: "Title"
    type: "title"
    label: "Scattering"
  - name: "ePtclGeom"
    <<: *VtPtclGeom
    label: "shape of particles"
    tooltip: "Shape of the scattering objects: spheres, polydispersive spheres, ellipsoids, parallelepipeds, cylinders"
    options: ["VT_PTCL_SPHERE", "VT_PTCL_POLY_SPH", "VT_PTCL_ELLIPS", "VT_PTCL_EPIPED", "VT_PTCL_CYL", "VT_ISOTROPIC"]
    default: "VT_PTCL_SPHERE"
    prefix: "-O"
    column: 0

  - name: "RadiusPtcl"
    type: "float"
    label: "radius 1 or length"
    unit: "Ang"
    tooltip: "Size of the particles:  (Min.) radius of a sphere, thickness of a parallelepiped, or first radius of a cylinder or an ellipsoid. (See also Help|sample)"
    min: 0.0001
    default: 100.0
    column: 0
    prefix: "-U"
  - name: "WidthPtcl"
    type: "float"
    label: "radius 2 or width"
    unit: "Ang"
    tooltip: "Size of the particles:  Width of a parallelepiped or 2nd or max. radius of an ellipsoid, a cylinder or max. radius of spheres. (See also Help|sample)"
    default: 0.5
    min: 0.0
    column: 1
    prefix: "-V"
  - name: "HeightPtcl"
    type: "float"
    label: "radius 3 or height"
    unit: "Ang"
    tooltip: "Size of the particles:  Height of a parallelepiped or cylinder or 3rd radius of an ellipsoid. (See also Help|sample)"
    default: 0.5
    min: 0.0
    column: 2
    prefix: "-W"

  - name: "ScatLenPtcl"
    type: "float"
    label: "scat. len. dens. particl"
    unit: "1/cm^2"
    tooltip: "Scattering length density of the particles"
    default: 2.0e+10
    min: 0.0
    column: 0
    prefix: "-l"
  - name: "ScatLenSolv"
    type: "float"
    label: "scat. len. dens. solvent"
    unit: "1/cm^2"
    tooltip: "Scattering length density of the solvent"
    default: 1.0e+10
    min: 0.0
    column: 1
    prefix: "-L"
  - name: "PtclFrac"
    type: "float"
    label: "vol. fraction of particles"
    unit: ""
    tooltip: "Normalization factor for the structure factor See also Help|sample"
    default: 1.0
    min: 0.000001
    column: 2
    prefix: "-f"

  - name: "MuScatIncoh"
    type: "float"
    label: "incoherent scattering"
    unit: "1/cm"
    tooltip: "Macroscopic incoherent scattering cross section of the SANS sample material. Needed if 'Incoherent scattering' is chosen."
    default: 0.0
    min: 0.0
    column: 0
    prefix: "-i"
  - name: "MuScatTotal"
    type: "float"
    label: "total scattering"
    unit: "1/cm"
    tooltip: "Macroscopic total scattering cross section of the SANS sample material (used for attenuation)"
    default: 20.0
    min: 0.5
    column: 1
    prefix: "-T"
  - name: "MuAbsorb"
    type: "float"
    label: "absorption"
    unit: "1/cm"
    tooltip: "Macroscopic absorption cross section of the SANS sample material for 1.798 Ang (used for attenuation)"
    default: 0.1
    min: 0.0
    column: 2
    prefix: "-m"
