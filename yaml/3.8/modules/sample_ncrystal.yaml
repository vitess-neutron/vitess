sample_ncrystal:
  executable: "sample_ncrystal"
  label: "sample_ncrystal"
  category: "sample"

  parameters:
  - name: "Title_Config"
    type: "title"
    label: "NCrystal Config string definition"
  - name: "sParFile"
    type: "file"
    plottable: false
    label: "material file"
    tooltip: "File that contains the sample scattering information."
    column: 0
    default: "scatter_default.ncmat"
    prefix: "-f"
  - name: "temp"
    type: "float"
    label: "Temperature"
    unit: "K"
    tooltip: "Temperature of the sample. Ignored when state of matter is gas or liquid."
    column: 0
    min: 0.0
    default: 0.0
    prefix: "-T"
  - name: "staofm"
    type: "bool"
    label: "Solid sample"
    tooltip: "If the sample is solid please insert the desired crystal axis directions. If no, please give default values."
    column: 0
    default: true
    prefix: "-s"

  - name: "Title_Crystal"
    type: "title"
    label: "Crystal parameters"
  - name: "dcutoff"
    type: "float"
    label: "d-cutoff"
    unit: "Ang"
    tooltip: "Minimum d-spacing to consider in the simulation."
    column: 0
    min: 0
    default: 0.5
    prefix: "-d"
  - name: "mos"
    type: "float"
    label: "crystal mosaicity"
    unit: ""
    tooltip: "Crystal mosaicity to consider in the simulation."
    column: 1
    min: 0
    default: 0
    prefix: "-m"
  - name: "dirtol"
    type: "float"
    label: "Axis 2 dir tolerance"
    unit: "deg"
    tooltip: "NCrystal specified tolerance on the crystal axis n. 2. Default is 1e-4 rad = 0.0057 deg."
    column: 2
    min: 0
    default: 0.0057
    prefix: "-D"

  - name: "Title_Directions"
    type: "title"
    label: "Crystal directions"
  - name: "inh"
    type: "float"
    label: "Axis 1 h"
    unit: ""
    tooltip: "This h-index specifies the crystallographic axis 'Axis 1'."
    column: 0
    min: 0.0
    default: 0.0
    prefix: "-h"
  - name: "ink"
    type: "float"
    label: "Axis 1 k"
    unit: ""
    tooltip: "This k-index specifies the crystallographic axis 'Axis 1'."
    column: 1
    min: 0.0
    default: 0.0
    prefix: "-k"
  - name: "inl"
    type: "float"
    label: "Axis 1 l"
    unit: ""
    tooltip: "This l-index specifies the crystallographic axis 'Axis 1'."
    column: 2
    min: 0.0
    default: 0.0
    prefix: "-l"
  - name: "inx"
    type: "float"
    label: "Axis 1 dir x"
    unit: ""
    tooltip: "Unit vector component x defining the orientation of the crystallographic axis 'Axis 1' in the NCrystal lab coordinates."
    column: 0
    min: 0.0
    default: 0.0
    prefix: "-a"
  - name: "iny"
    type: "float"
    label: "Axis 1 dir y"
    unit: ""
    tooltip: "Unit vector component y defining the orientation of the crystallographic axis 'Axis 1' in the NCrystal lab coordinates."
    column: 1
    min: 0.0
    default: 0.0
    prefix: "-b"
  - name: "inz"
    type: "float"
    label: "Axis 1 dir z"
    unit: ""
    tooltip: "Unit vector component z defining the orientation of the crystallographic axis 'Axis 1' in the NCrystal lab coordinates."
    column: 2
    min: 0.0
    default: 0.0
    prefix: "-c"

  - name: "ouh"
    type: "float"
    label: "Axis 2 h"
    unit: ""
    tooltip: "This h-index specifies the crystallographic axis 'Axis 2'."
    column: 0
    min: 0.0
    default: 0.0
    prefix: "-H"
  - name: "ouk"
    type: "float"
    label: "Axis 2 k"
    unit: ""
    tooltip: "This k-index specifies the crystallographic axis 'Axis 2'."
    column: 1
    min: 0.0
    default: 0.0
    prefix: "-K"
  - name: "oul"
    type: "float"
    label: "Axis 2 l"
    unit: ""
    tooltip: "This l-index specifies the crystallographic axis 'Axis 2'."
    column: 2
    min: 0.0
    default: 0.0
    prefix: "-L"
  - name: "oux"
    type: "float"
    label: "Axis 2 dir x"
    unit: ""
    tooltip: "Unit vector component x defining the orientation of the crystallographic axis 'Axis 2' in the NCrystal lab coordinates."
    column: 0
    min: 0.0
    default: 0.0
    prefix: "-A"
  - name: "ouy"
    type: "float"
    label: "Axis 2 dir y"
    unit: ""
    tooltip: "Unit vector component y defining the orientation of the crystallographic axis 'Axis 2' in the NCrystal lab coordinates."
    column: 1
    min: 0.0
    default: 0.0
    prefix: "-B"
  - name: "ouz"
    type: "float"
    label: "Axis 2 dir z"
    unit: ""
    tooltip: "Unit vector component z defining the orientation of the crystallographic axis 'Axis 2' in the NCrystal lab coordinates."
    column: 2
    min: 0.0
    default: 0.0
    prefix: "-C"

  - name: "Title_Repetitions"
    type: "title"
    label: "Repetitions of the same neutron event"
  - name: "reprate"
    type: "int"
    label: "repetition"
    tooltip: "number of trajectories generated per incoming trajectory."
    column: 0
    default: 1
    prefix: "-R"

  - name: "Title_Shape"
    type: "title"
    label: "Sample shape"
  - name: "cyl" # TODO name
    <<: *VtSmplGeom
    label: "sample geometry"
    tooltip: "geometry of the sample: cylinder, hollow cylinder, sphere, or cuboid"
    column: 0
    options: ["VT_CYL", "VT_HOL_CYL", "VT_SPHERE", "VT_CUBE"]
    default: "VT_CYL"
    prefix: "-G"

  - name: "Title_Position"
    type: "title"
    label: "Sample position and size"
  - name: "x1"
    type: "float"
    label: "X"
    unit: "cm"
    tooltip: "position of the sample centre"
    column: 0
    default: 50
    prefix: "-X"
  - name: "y1"
    type: "float"
    label: "Y"
    unit: "cm"
    tooltip: "position of the sample centre"
    column: 1
    default: 0
    prefix: "-Y"
  - name: "z1"
    type: "float"
    label: "Z"
    unit: "cm"
    tooltip: "position of the sample centre"
    column: 2
    default: 0
    prefix: "-Z"
  - name: "trad"
    type: "float"
    label: "thickness or diameter"
    unit: "cm"
    tooltip: "thickness of the sample in x direction or diameter in case of cylinder or sphere"
    column: 0
    min: 0
    default: 3.0
    prefix: "-t"
  - name: "hei"
    type: "float"
    label: "height"
    unit: "cm"
    tooltip: "height of sample in z direction if cuboid or cylinder, no relevance if sphere"
    column: 1
    min: 0
    default: 3.0
    prefix: "-g"
  - name: "wid"
    type: "float"
    label: "inner diameter or width"
    unit: "cm"
    tooltip: "inner diameter of hollow cylinder or width of sample - inactive for full cylinder option"
    column: 2
    min: 0
    default: 3.0
    prefix: "-w"
  - name: "hoff"
    type: "float"
    label: "offset angle horiz."
    unit: "deg"
    tooltip: "rotation angle of the sample about the z-axis in a horizontal plane (first rotation) to define its orientation"
    column: 0
    default: 0.0
    prefix: "-o"
  - name: "voff"
    type: "float"
    label: "offset angle vert."
    unit: "deg"
    tooltip: "rotation angle of the sample about the (new) y-axis in a vertical direction (second rotation) to define its orientation"
    column: 1
    default: 0.0
    prefix: "-O"

  - name: "Title_Incident"
    type: "title"
    label: "Incident neutron parameters"
  - name: "lam"
    type: "float"
    label: "incident lambda"
    unit: "Ang"
    tooltip: "incident neutron wavelength"
    column: 0
    min: 0.0
    default: 1.0
    prefix: "-M"

  - name: "Title_Frame"
    type: "title"
    label: "Output frame"
  - name: "x2"
    type: "float"
    label: "X'"
    unit: "cm"
    tooltip: "position of the output frame in the original frame along the beam axis"
    column: 0
    min: 0.0
    default: 50.0
    prefix: "-x"
  - name: "y2"
    type: "float"
    label: "Y'"
    unit: "cm"
    tooltip: "horizontal position of the output frame in the original frame (to the left)"
    column: 1
    min: 0.0
    default: 0.0
    prefix: "-y"
  - name: "z2"
    type: "float"
    label: "Z'"
    unit: "cm"
    tooltip: "vertical position of the output frame in the original frame"
    column: 2
    min: 0.0
    default: 0.0
    prefix: "-z"
  - name: "ha"
    type: "float"
    label: "horiz. angle"
    unit: "deg"
    tooltip: "rotation angle of the output frame about the z-axis in horizontal (first rotation) plane. Rotation (0, 0) means along the original beam axis (x-axis)"
    column: 0
    default: 0.0
    prefix: "-u"
  - name: "va"
    type: "float"
    label: "vert. angle"
    unit: "deg"
    tooltip: "rotation angle of the output frame about the (new) y-axis in a vertical direction (second rotation). Rotation (0, 0) means along the original beam axis (x-axis)"
    column: 1
    default: 0.0
    prefix: "-U"
