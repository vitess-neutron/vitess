mon1_divy:
  executable: "monitor1"
  label: "mon1_divy"
  category: "monitor"

  parameters:
  - <<: *monitor_eMonPar
    default: "MON_DIV_Y"
  - <<: *monitor_sMonFile
    tooltip: "monitor output file containing intensity as a function of the horizontal deviation from straight neutron flight direction [deg]"
    default: "monitor.mdy"
  - <<: *monitor_sRefFile
    tooltip: "Reference input file containing data to normalize the monitored divergence spectrum"

  - *monitor_Title_Range
  - name: "MinDivY"
    type: "float"
    label: "min. hor. divergence"
    unit: "deg"
    tooltip: "lower bound value of the monitored horizontal divergence negative values: to the right, positive values: to the left (seen in the direction of the flying neutron)"
    default: 0.0
    column: 0
    prefix: "-m"
    required: true
  - name: "MaxDivY"
    type: "float"
    label: "max. hor. divergence"
    unit: "deg"
    tooltip: "upper bound value of the monitored horizontal divergence negative values: to the right, positive values: to the left (seen in the direction of the flying neutron?"
    column: 1
    default: 10.0
    prefix: "-M"
    required: true
  - *monitor_nBins

  - *monitor_Title_Opt
  - *monitor_iColor
  - *monitor_bAllFile

  - *monitor_bProbWeight
  - *monitor_bExcl
  - *monitor_eMonNorm

  - *monitor_Title_Filter
  - *monitor_FilterMinLambda
  - *monitor_FilterMaxLambda
  - *monitor_FilterMinY
  - *monitor_FilterMaxY
  - *monitor_FilterMinZ
  - *monitor_FilterMaxZ
