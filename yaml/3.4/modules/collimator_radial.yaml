collimator_radial:
  executable: "collimator_radial"
  label: "collimator_radial"
  category: "collimator"

  parameters:
  - name: "AngleCntr"
    type: "float"
    label: "center [deg]"
    tooltip: "Direction to the center of the collimator 0 deg: beam direction before sample, 90 deg: to the left"
    default: 90.0
    min: -180.0
    max: 180.0
    column: 0
    prefix: "-a"
  - name: "AngleWidth"
    type: "float"
    label: "width [deg]"
    tooltip: "Angular range of the radial collimator"
    default: 160.0
    min: 0.0
    max: 360.0
    column: 1
    prefix: "-w"
  - name: "OscWidth"
    type: "float"
    label: "oscillation to width  [deg]"
    tooltip: "Angular width of the oscillation oscillation width = 0.0 means: no oscillation regarded"
    default: 9.0
    min: 0.0
    max: 360.0
    column: 2
    prefix: "-o"

  - name: "EntrHeight"
    type: "float"
    label: "entrance height [cm]"
    tooltip: "Height of the entrance of the radial collimator"
    default: 10.0
    min: 0.0001
    column: 0
    prefix: "-h"
  - name: "ExitHeight"
    type: "float"
    label: "exit height [cm]"
    tooltip: "Height of the exit of the radial collimator"
    default: 12.0
    min: 0.0001
    column: 1
    prefix: "-H"

  - name: "Distance"
    type: "float"
    label: "distance[cm]"
    tooltip: "Distance from sample center to the collimator entrance"
    default: 10.0
    min: 0.0
    column: 0
    prefix: "-d"
  - name: "Length"
    type: "float"
    label: "length [cm]"
    tooltip: "Length of the collimator channels"
    default: 20.0
    min: 0.0
    column: 1
    prefix: "-l"

  - name: "nChannels"
    type: "int"
    label: "number of channels"
    tooltip: "Number of the collimator channels"
    default: 40
    min: 1
    column: 0
    prefix: "-n"
  - name: "BladeThickn"
    type: "float"
    label: "wall thickness [cm]"
    tooltip: "Thickness of the blades separating two channels of the collimator"
    default: 0.01
    min: 0.0
    column: 1
    prefix: "-s"
