beamstop:
  executable: "beamstop"
  label: "beamstop"
  parameters:
  - name: "Distance"
    type: "float"
    label: "distance from sample [cm]"
    tooltip: "distance between sample and beamstop"
    default: 0.0
    min: 0.0
    column: 0
    prefix: "-d"

  - name: "eShape"
    label: "beamstop shape"
    tooltip: "shape of the beamstop"
    <<: *VtShape
    options: ["VT_SQUARE","VT_CIRCLE"]
    default: "VT_SQUARE"
    column: 0
    prefix: "-R"
  - name: "bProp"
    type: "bool"
    label: "beam propagation"
    tooltip: "'no' (default): neutrons remain on the sample surface 'yes': neutrons are propagated to the beamstop"
    default: no
    column: 1
    prefix: "-p"

  - name: "Title_cir"
    type: "title"
    label: "circular beamstop coordinates"
  - name: "Radius"
    type: "float"
    label: "radius [cm]"
    tooltip: "radius of circular beamstop"
    min: 0.0
    column: 0
    prefix: "-r"

  - name: "Title_rect"
    type: "title"
    label: "co-ordinates of a rectangular beamstop"
  - name: "Width"
    type: "float"
    label: "max. y [cm]"
    tooltip: "Width of a rectangular beamstop"
    min: 0.0
    column: 0
    prefix: "-W"
  - name: "Height"
    type: "float"
    label: "max. z [cm]"
    tooltip: "Height of a rectangular beamstop"
    min: 0.0
    column: 1
    prefix: "-H"
