#input fields so far:
#type:    title, file, string, float, int, combo (for selection list or switch)
#descr:   description of the parameter lable
#default: Value for title, values for selection list, optional default values
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe
monitor1D:
   Name    :                 #                  name of the component
     type: "string" 
     column: 0                     
   MonFile :                 # -O "NoFile" [-]  common part of the output file names, up to 3 files possible with x-parameter A, B and C
     type: "file" 
     descr: "monitor file" 
   IdParA  :                 # -X  -1    [-]    parameter A to be shown on the x axis 
     type: "combo" 
     descr: "1st parameter\non x-axis"
     default: ["POS_Y", "POS_Z", "POS_X", "DIV_Y", "DIV_Z", "LAMBDA", "ENERGY", "TIME", "K_Y", "K_Z", "POS_R", "POS_PHI",
               "DIR_PHI", "DIR_THETA", "COL_VERT", "COL_HOR", "COLOR"]
     column: 0                     
     prefix: "-X"   
   IdParB  :                 # -Y  -1    [-]    parameter B to be shown on the x axis 
     type: "combo" 
     descr: "2nd parameter\non x-axis" 
     default: ["NONE", "POS_Y", "POS_Z", "POS_X", "DIV_Y", "DIV_Z", "LAMBDA", "ENERGY", "TIME", "K_Y", "K_Z", "POS_R", "POS_PHI",
               "DIR_PHI", "DIR_THETA", "COL_VERT", "COL_HOR", "COLOR"]
     column: 1                     
     prefix: "-Y"  
   IdParC  :                 # -Z  -1    [-]    parameter C to be shown on the x axis 
     type: "combo" 
     descr: "3rd parameter\non x-axis" 
     default: ["NONE", "POS_Y", "POS_Z", "POS_X", "DIV_Y", "DIV_Z", "LAMBDA", "ENERGY", "TIME", "K_Y", "K_Z", "POS_R", "POS_PHI",
               "DIR_PHI", "DIR_THETA", "COL_VERT", "COL_HOR", "COLOR"]
     column: 2                     
     prefix: "-Z"  
   MinParA :                 # -w  -1   [var]   minimum x value 
     type: "float" 
     descr: "1st minimal\nx-value"  
     column: 0                     
     prefix: "-w"  
   MinParB :                 # -f  -1   [var]   minimum x value 
     type: "float" 
     descr: "2nd minimal\nx-value" 
     column: 1                     
     prefix: "-f"  
   MinParC :                 # -g  -1   [var]   minimum x value 
     type: "float" 
     descr: "3rd minimal\nx-value" 
     column: 2                     
     prefix: "-g"  
   MaxParA :                 # -W  -1   [var]   maximum x value 
     type: "float" 
     descr: "1st maximal\nx-value"
     column: 0                     
     prefix: "-W"  
   MaxParB :                 # -F  -1   [var]   maximum x value 
     type: "float" 
     descr: "2nd maximal\nx-value" 
     column: 1                     
     prefix: "-F"   
   MaxParC :                 # -G  -1   [var]   maximum x value 
     type: "float" 
     descr: "3nd maximal\nx-value" 
     column: 2                     
     prefix: "-G"  
   nBinParA:                 # -x   0    [-]    number of x bins 
     type: "int" 
     descr: "1st number\nof x-bins" 
     column: 0                     
     prefix: "-x"  
   nBinParB:                 # -y   0    [-]    number of x bins 
     type: "int" 
     descr: "2nd number\nof x-bins" 
     column: 1                     
     prefix: "-y"   
   nBinParC:                 # -z   0    [-]    number of x bins 
     type: "int" 
     descr: "3rd number\nof x-bins" 
     column: 2                     
     prefix: "-z"   
   bProbWt :                 # -p  YES   [-]    use eigher actual probability of trajectories or 1 for all trajectories
     type: "combo" 
     descr: "probability\nweight" 
     default: ["NO", "YES"]
     column: 0                     
     prefix: "-p"  
   bExclude:                 # -e  NO    [-]    do not forward neutrons to the pipe that do not contribute to the monitor data
     type: "combo" 
     descr: "exclusive\ncounts" 
     default: ["NO", "YES"]
     column: 1                     
     prefix: "-e"  
 
   # optional input parameters (filters and polarisation analysis)
   title_FilSelect: 
     type: "title" 
     default: "Filter selection"
   LmbdMin :                 # -l  -1.0 [Ang]   minimum wavelength, filter for the monitor
     type: "float" 
     descr: "filter lambda\nmin [A]"  
     column: 0                     
     prefix: "-l"   
   LmbdMax :                 # -L  -1.0 [Ang]   maximum wavelength, filter for the monitor
     type: "float" 
     descr: "filter lambda\nmax [A]" 
     column: 1                     
     prefix: "-L"  
   IdFilt1 :                 # -I  -1    [-]    filter parameter 1
     type: "combo" 
     descr: "filter\nparameter 1"  
     default: ["NONE", "POS_Y", "POS_Z", "POS_X", "DIV_Y", "DIV_Z", "LAMBDA", "ENERGY", "TIME", "K_Y", "K_Z", "POS_R", "POS_PHI",
               "DIR_PHI", "DIR_THETA", "COL_VERT", "COL_HOR", "COLOR"]
     column: 0                     
     prefix: "-I"  
   IdFilt2 :                 # -J  -1    [-]    filter parameter 2
     type: "combo" 
     descr:  "filter\nparameter 2"
     default: ["NONE", "POS_Y", "POS_Z", "POS_X", "DIV_Y", "DIV_Z", "LAMBDA", "ENERGY", "TIME", "K_Y", "K_Z", "POS_R", "POS_PHI",
               "DIR_PHI", "DIR_THETA", "COL_VERT", "COL_HOR", "COLOR"]
     column: 1                    
     prefix: "-J"  
   FiltComb:                 # -C  -1    [-]    filter 1 and 2 combined with AND or OR
     type: "combo" 
     descr: "filter\ncombination" 
     default: ["OR", "AND"]
     column: 2                     
     prefix: "-C"  
   MinFilt1:                 # -u  -1.0 [var]   minimum value of parameter 1, additional filter for the monitor
     type: "float" 
     descr: "filter 1\nmin value" 
     column: 0                     
     prefix: "-u"  
   MaxFilt1:                 # -U  -1.0 [var]   minimum value of parameter 1, additional filter for the monitor
     type: "float" 
     descr: "filter 1\nmax value" 
     column: 1                     
     prefix: "-U"  
   MinFilt2:                 # -v  -1.0 [var]   maximum value of parameter 2, additional filter for the monitor
     type: "float" 
     descr: "filter 2\nmin value"  
     column: 0                     
     prefix: "-v"  
   Maxfilt2:                 # -V  -1.0 [var]   maximum value of parameter 2, additional filter for the monitor
     type: "float" 
     descr:  "filter 2\nmax value"
     column: 1                     
     prefix: "-V"  

   title_Pol: 
     type: "title" 
     default: "Polarisation analysis"
   bPolAna :                 # -P  NO    [-]    switched on if polarisation analysis desired
     type: "combo" 
     descr: "Polarisation\nanalysis" 
     default: ["NO","YES"]
     column: 0                     
     prefix: "-P"  

   title_AnaDir: 
     type: "title" 
     default: "Analysis direction"
   PolDirX :                 # -r   0.0  [-]    x-component of the polarisation analysis vector
     type: "float" 
     descr: "direction\nX" 
     column: 0                     
     prefix: "-r"  
   PolDirY :                 # -s   0.0  [-]    y-component polarisation analysis vector
     type: "float" 
     descr: "direction\nY" 
     column: 1                     
     prefix: "-s"  
   PolDirZ :                 # -t   0.0  [-]    z-component polarisation analysis vector
     type: "float" 
     descr: "direction\nZ" 
     column: 2                     
     prefix: "-t"   

