#input fields so far
#type: title, file, string, float, int, combo (for selection list)
#descr: description of the parameter lable
#default: Value for title, values for selection list, optional default values
#min: minimum value optional
#max: maximum value optional
#column: column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix: prefix for parameter in pipe
spacewindow:
  - Name    : 
      type:    "string"
      descr:   "name" 
  - Distance:                
      type:    "float" 
      descr:   "distance\nto slit [cm]" 
      tooltip: "distance from origin to slit (along the x-axis)"
      default: 0.0
      min:     0.0
      column:  0                     
      prefix:  "-d"   
  - Width:               
      type:    "float" 
      descr:   "width [cm]"  
      tooltip: "width of the (rectangular) slit"
      min:     0.0
      column:  1                     
      prefix:  "-W"   
  - Height:       
      type:    "float" 
      descr:   "height [cm]"  
      tooltip: "height of the (rectangular) slit"
      min:     0.0
      column:  2                     
      prefix:  "-H"   


