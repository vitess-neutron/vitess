#input fields so far:
#type:    title, file, string, float, int, combo(for selection list),switch (Set: Yes)
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label 
#default: Value for title, values for selection list, optional default values
#index:   indexlist for comboBox, if related values not in default order (0,1,2..)
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe
mon_brilliance:           # source module that will be executed
  - sName:
      type:    "string" 
      descr:   "name"

  - sMonFile:              #     -O  "monitor file"              "Monitor output file containing brilliance or brilliance transfer as a function of the chosen parameter"
      type:    "file" 
      descr:   "monitor file"
      tooltip: "Monitor output file containing brilliance or brilliance transfer as a function of the chosen parameter"
      default: "Sample.brl" 
      prefix:  "-O"  

  - sRefFile:              #     -S  "reference file"            "Brilliance file used as reference (it is used to calculate the brilliance transfer)"
      type:    "file" 
      descr:   "reference file" 
      tooltip: "Brilliance file used as reference (it is used to calculate the brilliance transfer)"
      prefix:  "-S"  

  - sFlxFile:              #     -F  "flux file"                 "This file is used to monitor the average and max. brilliance as a function of the given parameter set.\n1 line is written in each simulation"
      type:    "file" 
      descr:   "flux file"  
      tooltip: "This file is used to monitor the average and max. brilliance as a function of the given parameter set.\n1 line is written in each simulation"
      prefix:  "-F"  
 
  - ePar:                  #     -k  "variable\nparameter"       "ID for the parameter, as a function of which the brilliance is shown"
      type:    "combo" 
      descr:   "variable\nparameter"
      tooltip: "ID for the parameter, as a function of which the brilliance is shown"
      default: ["NO_PAR","MON_LAMBDA","MON_TIME","MON_Y","MON_Z","MON_DIV_Y","MON_DIV_Z","MON_DIV_RAD"] 
      column:  0            
      prefix:  "-k"

  - eBrl:                  #     -N  "norm. type"                "BRL_ABS: absolute brilliance [n/(cm²s sr Ang)]   BRL_TRANSF: relative brilliance (= brilliance transfer)   BRL_PCT: brilliance within 1% DelLamdba/Lambda [n/(cm²s sr)]
      type:    "combo" 
      descr:   "norm. type"
      tooltip: "BRL_ABS:    absolute brilliance [n/(cm²s sr Ang)]\nBRL_TRANSF: relative brilliance (= brilliance transfer)\nBRL_PCT:    brilliance within 1% DelLamdba/Lambda [n/(cm²s sr)]"
      default: ["BRL_ABS","BRL_TRANSF","BRL_PCT"]
      column:  1            
      prefix:  "-N"

  - bLogBin:                #     -B  "logarithmic\nbinning"      "YES: bin size increases exponentially   NO: linear binning"
      type:    "switch" 
      descr:   "logarithmic\nbinning" 
      tooltip: "YES: bin size increases exponentially   NO: linear binning"
      column:  0            
      prefix:  "-B" 

  - bExclude:              #     -e  "exclusive\ncounts"         "YES: only neutrons meeting the monitor conditions are written   NO: all are written
      type:    "switch" 
      descr:   "exclusive\ncounts" 
      tooltip: "YES: only neutrons meeting the monitor conditions are written\nNO : all are written"
      column:  1                     
      prefix:  "-e"   
 
  - nBins:                 # >=1 -n  "number\nof bins"           "number of monitor channels"
      type:    "int" 
      descr:   "number\nof bins" 
      tooltip: "number of monitor channels"
      default: 100
      min:     1
      column:  0            
      prefix:  "-n"

  - iColour:               #     -C  "color"                     "color of the trajectories condidered by the monitor   (default: ALL)
      type:    "int" 
      descr:   "color" 
      tooltip: "color of the trajectories condidered by the monitor   (default: ALL)"
      min:     -1
      column:  1            
      prefix:  "-C"
   
  - TimeMin:               #     -t  "min. time [ms]"            "minimal time-of-flight to be taken into account"
      type:    "float" 
      descr:   "min. time [ms]" 
      tooltip: "minimal time-of-flight to be taken into account"
      column:  0               
      prefix:  "-t"

  - TimeMax:               #     -T  "min. time [ms]"            "maximal time-of-flight to be taken into account"
      type:    "float" 
      descr:   "max. time [ms]"
      tooltip: "maximal time-of-flight to be taken into account"
      column:  1             
      prefix:  "-T"

  - LmbdMin:               #     -l  "min. lambda [Ang]"         "minimal wavelength to be taken into account"
      type:    "float" 
      descr:   "min. lambda [Ang]"
      tootip:  "minimal wavelength to be taken into account"
      column:  0            
      prefix:  "-l"
  - LmbdMax:               #     -L  "max. lambda [Ang]"         "maximal wavelength to be taken into account"
      type:    "float" 
      descr:   "max. lambda [Ang]" 
      tooltip: "maximal wavelength to be taken into account"
      column:  1            
      prefix:  "-L"
  - EMin:                  #     -m  "min. energy [meV]"         "minimal energy to be taken into account
      type:    "float" 
      descr:   "min. energy [meV]"
      tooltip: "minimal energy to be taken into account"
      column:  0            
      prefix:  "-m"
  - EMax:                  #     -M  "max. energy [meV]"         "maximal energy to be taken into account
      type:    "float" 
      descr:   "max. energy [meV]"
      tooltip: "maximal energy to be taken into account"
      column:  1            
      prefix:  "-M"
  - yMin:                  #     -y  "min. width  [cm]"          "minimal width to be taken into account"
      type:    "float" 
      descr:   "min. width  [cm]"
      tooltip: "minimal width to be taken into account"
      column:  0            
      prefix:  "-y"
  - yMax:                  #     -Y  "max. width  [cm]"          "maximal width to be taken into account"
      type:    "float" 
      descr:   "max. width  [cm]"
      tooltip: "maximal width to be taken into account"
      column:  1           
      prefix:  "-Y"
  - zMin:                  #     -z  "min. height [cm]"          "minimal height to be taken into account"
      type:    "float" 
      descr:   "min. height [cm]" 
      tooltip: "minimal height to be taken into account"
      column:  0            
      prefix:  "-z"
  - zMax:                  #     -Z  "max. height [cm]"          "maximal height to be taken into account"
      type:    "float" 
      descr:   "max. height [cm]"
      tooltip: "maximal height to be taken into account"
      column:  1            
      prefix:  "-Z"

  - DivYMin:               #     -h  "min. hor. \ndiv. [deg]"    "minimal hor. div. to be taken into account
      type:    "float" 
      descr:   "min. hor. \ndiv. [deg]" 
      tooltip: "minimal hor. div. to be taken into account"
      column:  0              
      prefix:  "-h"
  - DivYMax:               #     -H  "max. hor. \ndiv. [deg]"    "maximal hor. div. to be taken into account
      type:    "float" 
      descr:   "max. hor. \ndiv. [deg]"
      tooltip: "maximal hor. div. to be taken into account"
      column:  1             
      prefix:  "-H"
  - DivZMin:               #     -v  "min. vert. \ndiv. [deg]"   "minimal vert. div. to be taken into account
      type:    "float" 
      descr:   "min. vert. \ndiv. [deg]"
      tooltip: "minimal vert. div. to be taken into account"
      column:  0            
      prefix:  "-v"
  - DivZMax:               #     -V  "max. vert. \ndiv. [deg]"   "maximal vert. div. to be taken into account
      type:    "float" 
      descr:   "max. vert. \ndiv. [deg]"
      tooltip: "minimal vert. div. to be taken into account"
      column:  1            
      prefix:  "-V"
  - DivRMin:               #     -r  "min. radial \ndiv. [deg]"  "minimal radial div. to be taken into account
      type:    "float" 
      descr:   "min. radial \ndiv. [deg]" 
      tooltip: "minimal radial div. to be taken into account"
      column:  0             
      prefix:  "-r"  
  - DivRMax:               #     -R  "max. radial \ndiv. [deg]"  "maximal radial div. to be taken into account
      type:    "float" 
      descr:   "max. radial \ndiv. [deg]"
      tooltip: "maximal radial div. to be taken into account"
      column:  1            
      prefix:  "-R"
  - Freq:                  #     -f  "frequency [Hz]"            "source frequency"
      type:    "float" 
      descr:   "frequency [Hz]"
      tooltip: "source frequency"
      column:  0            
      prefix:  "-f"
                               
