#input fields so far:
#type:    title, file, string, float, int, combo(for selection list),switch (Set: Yes)
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label 
#default: Value for title, values for selection list, optional default values
#index:   indexlist for comboBox, if related values not in default order (0,1,2..)
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe

Moderator:
   ModName :
     descr:   "name"
     type:    "string"
     column:  0                #0-2

   eType   :                   #   [-]    enum: moderator type:  POISONED DECOUPLED COUPLED MULT_SPEC
     type:    "combo" 
     descr:   "type"
     tooltip: "moderator type"
     default: ["COUPLED","DECOUPLED","POISONED", "MULT_SPEC"] 
     index:   [3,2,1]
     column:  0                     
     prefix:  "-t"    

   Diameter:                   #   [cm]   diameter of the moderator 
     type:    "float" 
     descr:   "diameter [cm]"
     tooltip: "diameter of the moderator"
     default: 2.0
     column:  0                     
     prefix:  "-r"     

   Width   :                   #   [cm]   width  of the moderator 
     type:    "float" 
     descr:   "width [cm]"
     tooltip: "width of the moderator"
     column:  1                     
     prefix:  "-w" 
   Height  :                   #   [cm]   height of the moderator 
     type:    "float" 
     descr:   "height [cm]"
     tooltip: "height of the moderator"
     default: 3.0
     column:  2                     
     prefix:  "-h"     
    
   CntrX   :                   #   [cm]   x coordinate of the center of the moderator 
     type:    "float" 
     descr:   "center x [cm]"
     tooltip: "x coordinate of the center of the moderator"
     default: 0.0
     column:  0                     
     prefix:  "-X"     
   CntrY   :                   #   [cm]   y coordinate of the center of the moderator 
     type:    "float" 
     descr:   "center y [cm]"
     tooltip: "y coordinate of the center of the moderator"
     default: 0.0
     column:  1                    
     prefix:  "-Y"    
   CntrZ   :                   #   [cm]   z coordinate of the center of the moderator 
     type:    "float" 
     descr:   "center z [cm]"
     tooltip: "z coordinate of the center of the moderator"
     default: 0.0
     column:  2                     
     prefix:  "-Z"

   Order   :                   #   [-]    spatial order of the moderator (the higher the number the more it is in the background) 
     type:    "int" 
     descr:   "spatial order"
     tooltip: "spatial order of the moderator (the higher the number the more it is in the background)"
     column:  0                     
     prefix: "-o" 
   Color   :                   #   [-]    the trajectories can be marked by this 'color' to identify the moderator of origin 
     type:    "int" 
     descr:   "color"
     tooltip: "the trajectories can be marked by this 'color' to identify the moderator of origin"
     min:    -1
     column:  1                     
     prefix: "-c" 
     
   Temp    :                   #   [K]    temperature of a Maxwellian distribution 
     type:    "float" 
     descr:   "temperature [K]"
     tooltip: "Temperature of a Maxwellian distribution"
     default: 50.0             # [50.0, 325.0]?
     column:  0                   
     prefix: "-T"      
   PfmcFact:                   #   [-]    Factor allowing for losses by aging or engineering design d 
     type:    "float" 
     descr:   "performance\nfactor"
     tooltip: "Factor allowing for losses by aging or engineering design d"
     min:     0.0
     default: 1.0
     column:  1                     
     prefix: "-p"      
   Current :                   #  [n/s]   Moderator current (only useful if moderator flux is zero) 
     type:    "float" 
     descr:   "current [n/s]"
     tooltip: "Average moderator current (only useful if moderator flux is zero)"
     column:  2                     
     prefix: "-I"     
