#input fields so far:
#type:    title, file, string, float, int, combo(for selection list),switch (Set: Yes)
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label 
#default: Value for title, values for selection list, optional default values
#index:   indexlist for comboBox, if related values not in default order (0,1,2..)
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe

Moderator:
  - ModName :
      descr:   "name"
      type:    "string"
      column:  0                       #0-2
  - eType   :                   # COUPLED     [-]  enum: moderator type:  POISONED DECOUPLED COUPLED 
      type:    "combo" 
      descr:   "type"
      tooltip: "moderator type"
      default: ["COUPLED","DECOUPLED","POISONED"] 
      index:   [3,2,1]
      column:  0                     
      prefix:  "-A"    
  - eShape  :                   # RECTANGULAR [-]  enum: moderator shape: RECTANGULAR CIRCULAR 
      type:    "combo" 
      descr:   "shape"
      tooltip: "moderator shape"
      default: ["RECTANGULAR","CIRCULAR"] 
      index:   [1,0]
      column:  1                     
      prefix:  "-A"    

  - Diameter:                   #      0.0  [cm]   diameter of the moderator 
      type:    "float" 
      descr:   "diameter [cm]"
      tooltip: "diameter of moderator"
      default: 0.0
      column:  0                     
      prefix:  "-A"    
  - Height  :                   #      0.0  [cm]   height of the moderator 
      type:    "float" 
      descr:   "height [cm]"
      tooltip: "height of moderator"
      default: 0.0
      column:  1                     
      prefix:  "-A"     
  - Width   :                   #      0.0  [cm]   width  of the moderator 
      type:    "float" 
      descr:   "width [cm]"
      tooltip: "width of moderator"
      default: 0.0
      column:  2                     
      prefix:  "-A" 
    
  - CntrX   :                   #      0.0  [cm]   x coordinate of the center of the moderator 
      type:    "float" 
      descr:   "center x [cm]"
      tooltip: "x coordinate of the center of the moderator"
      default: 0.0
      column:  0                     
      prefix:  "-A"     
  - CntrY   :                   #      0.0  [cm]   y coordinate of the center of the moderator 
      type:    "float" 
      descr:   "center y [cm]"
      tooltip: "y coordinate of the center of the moderator"
      default: 0.0
      column:  1                    
      prefix:  "-A"    
  - CntrZ   :                   #      0.0  [cm]   z coordinate of the center of the moderator 
      type:    "float" 
      descr:   "center z [cm]"
      tooltip: "z coordinate of the center of the moderator"
      default: 0.0
      column:  2                     
      prefix:  "-A"

  - Order   :                   #      0     [-]   spatial order of the moderator (the higher the number the more it is in the background) 
      type:    "int" 
      descr:   "spatial order"
      tooltip: "spatial order of the moderator (the higher the number the more it is in the background)"
      default: 0
      column:  0                     
      prefix:  "-A"    
  - Color   :                   #      0     [-]   the trajectories can be marked by this 'color' to identify the moderator of origin 
      type:    "int" 
      descr:   "color"
      tooltip: "the trajectories can be marked by this 'color' to identify the moderator of origin"
      default: 0
      column:  1                     
      prefix:  "-A"    
  - Temp    :                   #           [K]    temperature of a Maxwellian distribution 
      type:    "float" 
      descr:   "temperature [K]"
      tooltip: "temperature of a Maxwellian distribution"
      column:  2                   
      prefix:  "-A"     

  - Flux    :                   #        [n/cm²/s] Flux on moderator surface into solid angle 2*pi integrated over wavelength 
      type:    "float" 
      descr:   "total flux\n[n/cm²/s]"
      tooltip: "Flux on moderator surface into solid angle 2*pi integrated over wavelength"
      column:  0                     
      prefix:  "-A"   
  - Current :                   #           [n/s]  Moderator current (only useful if moderator flux is zero) 
      type:    "float" 
      descr:   "current [n/s]"
      tooltip: "Moderator current (only useful if moderator flux is zero)"
      column:  1                     
      prefix:  "-A"    
  - PfmcFact:                   #      1.0  [cm]   Factor allowing for losses by aging or engineering design d 
      type:    "float" 
      descr:   "performance\nfactor"
      tooltip: "Factor allowing for losses by aging or engineering design d"
      default: 1.0
      column:  2                     
      prefix:  "-A"     

  - LmbdFile:                 #      ""    [-]   file containing the wavelength distribution function 
      type:    "file" 
      descr:   "wavelength\ndist file"
      tooltip: "file containing the wavelength distribution function"
      prefix:  "-A"     
  - TimeFile:                   #      ""    [-]   file containing the time distribution function 
      type:    "file" 
      descr:   "time\ndist file"
      tooltip: "file containing the time distribution function"
      prefix:  "-A"  
  - L_T_File:                   #      ""    [-]   file containing the wavelength-time distribution function 
      type:    "file" 
      descr:   "wavelength-time\ndist file"
      tooltip: "file containing the wavelength-time distribution function"
      prefix:  "-A"  

  - tau_1   :                   #      0.0  [us]   first time constant of the pulse (ascending) tau_1 < tau_2 
      type:    "float" 
      descr:   "tau_1 [us]"
      tooltip: "first time constant of the pulse (ascending) tau_1 < tau_2"
      default: 0.0
      column:  0                     
      prefix:  "-A"    
  - tau_2   :                   #      0.0  [us]   second time constant of the pulse (descending) tau_1 < tau_2 
      type:    "float" 
      descr:   "tau_2 [us]"
      tooltip: "second time constant of the pulse (descending) tau_1 < tau_2"
      default: 0.0
      column:  1                     
      prefix:  "-A"   

