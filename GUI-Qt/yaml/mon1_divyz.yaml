#input fields so far:
#type:    title, file, string, float, int, combo (for selection list or switch)
#descr:   description of the parameter lable
#tooltip: detailed parameter description
#default: Value for title, values for selection list, optional default values
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe
monitor1:
  - sName   :
      type:    "string"
      descr:   "name" 
  - sMonFile:                 # -O    [-]   monitor output file containing intensity as a function of the chosen parameter
      type:    "file"
      descr:   "monitor file" 
      tooltip: "monitor output file containing intensity as a function of the chosen parameter"
      default: "monitor.dat"
      prefix:  "-O"   

  - MinY:                     # -m   [var]  lower bound value of the monitored radial divergence range
      type:    "float" 
      descr:   "min. div.\nx <-> yz [deg]" 
      tooltip: "lower bound value of the monitored radial divergence range"
      default: 0.0
      column:  0                     
      prefix:  "-m"  
  - MaxY:                     # -M   [var]  upper bound value of the monitored radial divergence range
      type:    "float" 
      descr:   "max. div.\nx <-> yz [deg]" 
      tooltip: "upper bound value of the monitored radial divergence range"
      column:  1                     
      default: 10.0
      prefix:  "-M"   
  - nBins:                    # -n    [-]   number of bins
      type:    "int" 
      descr:   "number\nof bins" 
      default: 100
      min:     1
      column:  2                     
      prefix:  "-n"  

  - RotMin:                   # -a   [deg]  lower bound rotation projection angle
      type:    "float" 
      descr:   "rot. angle\nmin [deg]" 
      tooltip: "lower bound rotation projection angle"
      column:  0                     
      prefix:  "-a"  
  - RotMax  :                 # -A   [deg]  upper bound rotation projection angle
      type:    "float" 
      descr:   "rot. angle\nmax [deg]" 
      tooltip: "upper bound rotation projection angle"
      column:  1                     
      prefix:  "-A"  
  - RotStep :                 # -s   [deg]  rotation projection angle step
      type:    "float" 
      descr:   "rot. angle\nstep [deg]" 
      tooltip: "rotation projection angle step"
      min:     0.00001
      column:  2                     
      prefix:  "-s" 

  - bSplitWt:                 # -P    [-]   flag: YES split weight   NO: multiplication by number of detection angles
      type:    "switch" 
      descr:   "split\nweight" 
      tooltip: "flag: YES split weight   NO: multiplication by number of detection angles"
      column:  0                     
      prefix:  "-P"    
  - iColour:                  # -C    [-]   index: for bAllFile=FALSE excludes all neutrons with diff. color from monitoring, if iColour >= 0 
                             #                    for bAllFile=TRUE  max. color to which additional monitor files are generated             
      type:    "int" 
      descr:   "color" 
      tooltip: "bAllFile=FALSE excludes all neutrons with diff. color from monitoring, if iColour >= 0\nbAllFile=TRUE  max. color to which additional monitor files are generated"  
      min:     -1
      column:  1                     
      prefix:  "-C"   
  - bAllFile:                 # -c    [-]   flag: generates additional files for colour:0, 1, ..., iColour
      type:    "switch" 
      descr:   "all files" 
      tooltip: "flag: generates additional files for colour:0, 1, ..., iColour"
      column:  2                     
      prefix:  "-c"   

  - bProbWt :                 # -p    [-]   flag: YES: Probability weight   NO: number of trajectories
      type:    "switch" 
      descr:   "probability\nweight" 
      tooltip: "flag: YES: Probability weight   NO: number of trajectories"
      column:  0                     
      prefix:  "-p"   
  - bExclude:                 # -e    [-]   flag: YES: only neutrons meeting the monitor conditions are written   NO: all are written
      type:    "switch" 
      descr:   "exclusive\ncounts" 
      tooltip: "flag: YES: only neutrons meeting the monitor conditions are written   NO: all are written"
      column:  1                     
      prefix:  "-e"   
  - eNorm   :                 # -f    [-]   enum  NO_NORM    intensities of the neutron trajctories distributed unchanged into channels 
                             #                   NORM_SIZE  intensities normalized to bin size
                             #                   NORM_REF   intensities normalized to reference file
      type:    "combo" 
      descr:   "normalize" 
      tooltip: "NO_NORM    intensities of the neutron trajctories distributed unchanged into channels\nNORM_SIZE  intensities normalized to bin size\nNORM_REF   intensities normalized to reference file"
      default: ["NO_NORM","NORM_SIZE","NORM_REF"]   
      column:  2                     
      prefix:  "-f"    

  - sRefFile:                 # -R    [-]   Reference input file containing data to normalize the monitor data
      type:    "file"
      descr:   "reference file" 
      tooltip: "reference input file containing data to normalize the monitor data"
      prefix:  "-R"   

  - title_FilSelect: 
      type:    "title" 
      default: "Filter selection"

  - FtimeMin :                 # -t    [ms]  minimal TOF to be taken into account
      type:    "float" 
      descr:   "time interval\nbegin [ms]" 
      tooltip: "minimal TOF to be taken into account"
      column:  0                     
      prefix:  "-t"  
  - FtimeMax :                 # -T    [ms]  maximal TOF to be taken into account
      type:    "float" 
      descr:   "time interval\nend [ms]" 
      tooltip: "maximal TOF to be taken into account"
      column:  1                     
      prefix:  "-T" 

  - FlmbdMin:                 # -l   [Ang]  minimal wavelength to be taken into account
      type:    "float" 
      descr:   "filter lambda\nmin [A]"  
      tooltip: "minimal wavelength to be taken into account"
      min:     0.0
      column:  0                     
      prefix:  "-l"  
  - FlmbdMax:                 # -L   [Ang]  maximal wavelength to be taken into account
      type:    "float" 
      descr:   "filter lambda\nmin [A]" 
      tooltip: "maximal wavelength to be taken into account"
      min:     0.0
      column:  1                     
      prefix:  "-L"   

  - FyMin   :                 # -y    [cm]  minimal horizontal position to be taken into account
      type:    "float" 
      descr:   "filter y pos.\nmin [cm]"  
      tooltip: "minimal horizontal position to be taken into account" 
      column:  0                     
      prefix:  "-y"  
  - FyMax   :                 # -Y    [cm]  maximal horizontal position to be taken into account
      type:    "float" 
      descr:   "filter y pos.\nmax [cm]"  
      tooltip: "maximal horizontal position to be taken into account"
      column:  1                     
      prefix:  "-Y"  

  - FzMin   :                 # -z    [cm]  minimal vertical position to be taken into account
      type:    "float" 
      descr:   "filter z pos.\nmin [cm]" 
      tooltip: "minimal vertical position to be taken into account"
      column:  0                     
      prefix:  "-z"   
  - FzMax   :                 # -Z    [cm]  maximal vertical position to be taken into account
      type:    "float" 
      descr:   "filter z pos.\nmax [cm]"  
      tooltip: "maximal vertical position to be taken into account" 
      column:  1                     
      prefix:  "-Z"  

