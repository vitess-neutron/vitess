source:
   SimName : 
     descr:   "simulation\nname"
     type:    "string"
     default: "First Simulation" 
     column:  0                       #0-2
   eKind   :                          # -K        [-]  enum: kind of source: SRC_SIMPLE  SRC_CWS  SRC_PULSED  SRC_ISIS  SRC_ESS
     type:    combo                   # Das soll nicht ausgewählt, sondern durch die Wahl der Quelle bestimmt werden.  
     descr:   "source type" 
     default: ["SRC_PULSED","SRC_PULSED"] 
     index:   [3,3]
     prefix:  "-K"     

   titel_0 :                       
     type:    "title" 
     default: "Source, moderator and beamline parameters"
   SrcName :                          # -N   ""    [-]   name of the source
     type:    "combo" 
     descr:   "source\nname" 
     default: ["ILL","HBS","ESS","CSNS","SNS","ISIS","IPNS"] 
     tooltip: "name of the source"
     column:  0                     
     prefix:  "-N"     

   Moderator_pulsed:
     type:    "window"
     descr:   "moderator"
     tooltip: "moderator description parameter"   
#     default: "moderator.yaml"

   Freq    :                          # -R        [Hz]   pulse frequency 
     type:    "float" 
     descr:   "frequency [Hz]"
     tooltip: "pulse repetition rate" 
     default: 50 
     column:  0                     
     prefix:  "-R"     
   Length  :                          # -p   1.0  [ms]   proton pulse length  
     type:    "float" 
     descr:   "proton pulse\nlength [ms]"
     tooltip: "proton pulse length"
     default: 1.0 
     column:  1                     
     prefix:  "-p"     
   Power   :                          # -L   2.0  [MW]   average source power
     type:    "float" 
     descr:   "source power\n[MW]"
     tooltip: "average source power"
     column:  2                     
     prefix:  "-L"     

   Decl    :                          # -i   0.0  [deg]  declination between moderator surface normal and propagation window 
     type:    "float" 
     descr:   "declination\n[deg]"
     tooltip: "declination between moderator surface normal and propagation window" 
     default: 0.0
     column:  0                     
     prefix:  "-i"     

   titel_1 :                       
     type:    "title" 
     default: "Simulation parameters"
   nBundle :                          # -n   10 [-]   number of bundles  
     type:    "int" 
     descr :  "number of\nbundels"
     tooltip: "number of packages into which the whole simulation is separated"
     default: 10
     column:  0                     
     prefix:  "-l"     
   nTraj   :                          # -n   1.0e6 [-]   number of neutron trajectories (events)  
     type:    "int" 
     descr :  "number of traj.\nper bundle"
     tooltip: "number of neutron trajectories (events) created in each bundle"
     default: 1000000 
     column:  1                     
     prefix:  "-n"     

   Lmin    :                          # -m        [Ang]  minimum of the wavelength range 
     type:    "float" 
     descr:   "min. wave-\nlength [Ang]"
     tooltip: "minimum of the wavelength range"
     min    : 0.0
     default: 1.0
     column:  0                     
     prefix:  "-m"     
   Tmin    :                          # -t        [ms]   minimum of the time frame to start neutrons 
     type:    "float" 
     descr:   "min. time [ms]"   
     tooltip: "minimum of the time frame to start neutrons"
     min    : 0.0
     default: 0.0
     column:  1                     
     prefix:  "-t"     

   Lmax    :                          # -M        [Ang]  maximum of the wavelength range 
     type:    "float" 
     descr:   "max. wave-\nlength [Ang]"
     tooltip: "maximum of the wavelength range" 
     default: 5.0
     column:  0                     
     prefix:  "-M"     
   Tmax    :                          # -T        [ms]   maximum of the time frame to start neutrons 
     type:    "float" 
     descr:   "max. time [ms]"
     tooltip: "maximum of the time frame to start neutrons" 
     default: 2.0
     column:  1                     
     prefix:  "-T"     

   eDir    :                          # -d  WINDOW [-]   enum: mode to determine neutron directions: DIVERGENCE  WINDOW 
     type:    "combo" 
     descr:   "direction\ndefined"
     tooltip: "mode to determine neutron directions" 
     default: ["VT_VIRT_WND", "VT_REAL_WND", "VT_DIVERGENCE"] 
     index:   [2,1,0]
     column:  0                     
     prefix:  "-d"     

   DivHmin :                          # -y        [deg]  minimum horizontal divergence (absolute value) 
     type:    "float" 
     descr:   "min. divergence\nx <-> y [deg]"   
     tooltip: "minimum horizontal divergence (absolute value)" 
     column:  0                     
     prefix:  "-b"     
   DivVmin :                          # -y        [deg]  minimum vertical divergence (absolute value)
     type:    "float"    
     descr:   "min. divergence\nx <-> z [deg]"
     tooltip: "minimum vertical divergence (absolute value)"
     column:  1                     
     prefix:  "-c"     

   DivHmax :                          # -z        [deg]  maximum horizontal divergence (half of angular spread x-z-plane, if min. value is zero) 
     type:    "float" 
     descr:   "max. divergence\nx <-> y [deg]"
     tooltip: "maximum horizontal divergence (half of angular spread x-z-plane, if min. value is zero)" 
     column:  0                     
     prefix:  "-y"     
   DivVmax :                          # -z        [deg]  maximum vertical divergence (half of angular spread x-z-plane, if min. value is zero) 
     type:    "float" 
     descr:   "max. divergence\nx <-> z [deg]"
     tooltip: "maximum vertical divergence (half of angular spread x-z-plane, if min. value is zero)"
     column:  1                     
     prefix:  "-z"     

   titel_2 :                       
     type:    "title" 
     default: "Propagation"
   TDist   :                          # -D 100.0  [cm]   distance moderator - target window 
     type:    "float" 
     descr:   "distance to\nwindow [cm]"
     tooltip: "distance moderator - target window" 
     min    :   0.0
     default: 100.0
     column:  0                     
     prefix:  "-D"     
   TWidth  :                          # -w   3.0  [cm]   width of the target window 
     type:    "float" 
     descr:   "window\nwidth [cm]"
     tooltip: "width of the target window" 
     min    : 0.0
     default: 3.0
     column:  1                     
     prefix:  "-w"     
   THeight :                          # -h   3.0  [cm]   height of the target window 
     type:    "float" 
     descr:   "window\nheight [cm]"
     tooltip: "height of the target window"
     min    : 0.0
     default: 3.0
     column:  2                     
     prefix:  "-h"     

   titel_3 :                       
     type:    "title" 
     default: "Time window"
   TofDist :                          # -s        [cm]   distance moderator - position of time window   
     type:    "float" 
     descr:   "distance to\ntime window [cm]"
     tooltip: "distance moderator - position of time window"
     column:  0                     
     prefix:  "-s"     
   TofMin  :                          # -f        [cm]   min TOF allowed in time window  
     type:    "float"    
     descr:   "min. TOF to\ntime window [ms]"
     tooltip: "min TOF allowed in time window" 
     column:  1                     
     prefix:  "-f"     
   TofMax  :                          # -F        [cm]   max TOF allowed in time window 
     type:    "float" 
     descr:   "max. TOF to\ntime window [ms]"
     tooltip: "max TOF allowed in time window" 
     column:  2                     
     prefix:  "-F"     

   titel_4 :                       
     type:    "title" 
     default: "Polarization"
   PolVecX :                          # -X        [cm]   x-component of the polarisation 
     type:    "float" 
     descr:   "polarisation\ndirection X"
     tooltip: "x-component of the polarisation" 
     column:  0                     
     prefix:  "-X"        
   PolVecY :                          # -Y        [cm]   y-component of the polarisation
     descr:   "Y"
     type:    "float" 
     tooltip: "y-component of the polarisation"
     column:  1                     
     prefix:  "-Y"     
   PolVecZ :                          # -V        [cm]   z-component of the polarisation
     type:    "float" 
     descr:   "Z"
     tooltip: "z-component of the polarisation"
     column:  2                     
     prefix:  "-V"     
   PolDeg  :                          # -P        [cm]   degree of polarization [%] 
     type:    "float" 
     descr:   "degree of pola-\nrization [%]"
     tooltip: "degree of polarization [%]" 
     column:  0                     
     prefix:  "-P"     

   titel_5 :                       
     type:    "title" 
     default: "Special simulation parameters"
   TimeMeas:                          # -A         [s]   time of measurement in second
     type:    "float" 
     descr:   "time of\nmeasurement [s]"
     tooltip: "time of measurement in second (used for detector counts)"
     column:  0                     
     prefix:  "-A"     
   LmbdWant:                          # -W        [Ang]  desired wavelength           
     type:    "float"   
     descr:   "desired\nwavelength [Ang]"
     tooltip: "desired wavelength (can be used for chopper phasing)" 
     column:  1                     
     prefix:  "-W"     
   eTrcMode:                          # -k                mode: NO_TRACING  WRITE_TRC_FILES  ONLY_TRC_TRAJ
     type:    "combo" 
     descr:   "kind of\nraytracing"
     tooltip: "mode of tracing:\nWRITE_TRC_FILES: write files for traj. of interest\n ONLY_TRC_TRAJ: simulation only with traj. of interest"
     default: ["NO_TRACING","WRITE_TRC_FILES","ONLY_TRC_TRAJ"] 
     index:   [0,1,2]
     column:  0                     
     prefix:  "-k"     
   TrcFile :                          # -r         [-]   name of the file containing the IDs for tracing
     type:    "file" 
     descr:   "raytracing file"
     tooltip: "name of the file containing the IDs for tracing"
     prefix:  "-r"     

