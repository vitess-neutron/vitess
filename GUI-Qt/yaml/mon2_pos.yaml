#input fields so far:
#type:    title, file, string, float, int, combo(for selection list),switch (Set: Yes)
#descr:   description of the parameter lable
#tooltip: detailed description shown when mouse cursor remains over label 
#default: Value for title, values for selection list, optional default values
#index:   indexlist for comboBox, if related values not in default order (0,1,2..)
#min:     minimum value optional
#max:     maximum value optional
#column:  column of parameter in gui (0-2),default = 0, title and file are always streched over all columns 
#prefix:  prefix for parameter in pipe
mon2_pos:                 # source module that will be executed          
  - sName   :                        
      type:    "string" 
      descr:   "name" 
  - sMonFile:              #     -O  "monitor file"              "Monitor output file containing intensity as a function of y- and z-position"
      type:    "file" 
      descr:   "monitor file"  
      tooltip: "monitor output file containing intensity as a function of y- and z-position"
      default: "sample.pos"
      prefix:  "-O"  
   
  - WidthMin:              #     -w  "min. y-value\n[cm]"        "left edge position of the monitored area"
      type:    "float" 
      descr:   "min. y-value\n[cm]"
      tooltip: "left edge position of the monitored area"
      default: -5.0
      column:  0                     
      prefix:  "-w"  
  - WidthMax:              #     -W  "max. y-value\n[cm]"        "right edge position of the monitored area"
      type:    "float" 
      descr:   "max. y-value\n[cm]" 
      tooltip: "right edge position of the monitored area"
      default: 5.0
      column:  1                     
      prefix:  "-W"  
  - nBinsY  :              # >=1 -y  "number\nof y-bins"         "number of monitor channels in horizontal direction"
      type:   "int" 
      descr:   "number\nof y-bins"
      tooltip: "number of monitor channels in horizontal direction"
      default: 50 
      min:     1 
      column:  2                     
      prefix:  "-y"  
  - HiteMin :               #     -h  "min. z-value\n[cm]"        "bottom position of the monitored area"
      type:   "float" 
      descr:   "min. z-value\n[cm]" 
      tooltip: "bottom position of the monitored area"
      default: -5.0 
      column:  0                     
      prefix:  "-h"  
  - HiteMax :               #     -H  "max. z-value\n[cm]"        "top position of the monitored area"
      type:    "float" 
      descr:   "max. z-value\n[cm]"  
      tooltip: "top position of the monitored area"
      default: 5.0  
      column:  1                     
      prefix:  "-H"  
  - nBinsZ  :              # >=1 -z  "number\nof z-bins"         "number of monitor channels in vertical direction"
      type:    "int" 
      descr:   "number\nof z-bins"  
      tooltip: "number of monitor channels in vertical direction"
      default: 50 
      min:     1
      column:  2                     
      prefix:  "-z"  
  - bProbWt :              #     -p  "probability\nweight"       "Display  : YES: Beam intensity   NO: number of trajectories"
      type:    "switch" 
      descr:   "probability\nweight" 
      tooltip: "Display  : YES: Beam intensity   NO: number of trajectories"
      default: "YES"
      column:  0                     
      prefix:  "-p"  
  - bExclude:              #     -e  "exclusive\ncounts"         "Exclusion: YES: only neutrons meeting the monitor conditions are written   NO: all are written"
      type:    "switch" 
      descr:   "exclusive\ncounts" 
      tooltip: "Exclusion: YES: only neutrons meeting the monitor conditions are written   NO: all are written"
      column:  1                     
      prefix:  "-e"  
  - eFormat :              #     -F  "file format"               "file format for output:  MATRIX: 2D matrix   XYZ: xyz"
      type:    "combo" 
      descr:   "file format" 
      tooltip:  "file format for output:  MATRIX: 2D matrix   XYZ: xyz"
      default: ["MATRIX","XYZ"]
      column:  2                     
      prefix:  "-F"  
  - FlmbdMin:              #     -l  "filter lambda\nmin [Ang]"  "minimal wavelength to be taken into account"
      type:    "float" 
      descr:   "filter lambda\nmin [Ang]"
      tooltip: "minimal wavelength to be taken into account"
      column:  0                     
      prefix:  "-l"  
  - FlmbdMax:              #     -L  "filter lambda\nmax [Ang]"  "maximal wavelength to be taken into account"
      type:    "float" 
      descr:   "filter lambda\nmax [Ang]"
      tooltip: "maximal wavelength to be taken into account"
      column:  1                     
      prefix:  "-L"  

